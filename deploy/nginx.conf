# Pacsi – nginx a Coolify proxy (Traefik) mögött. A HTTPS-t és a www → pacsit.hu átirányítást a proxy intézi.
#
# Gyorsítótár: a HTML, a service worker és a manifest mindig újraellenőrzött (no-cache + ETag), így egy új
# kiadás azonnal kiér. A képek egy napig, az ikonok egy hétig cache-elhetők: a service worker a telepítéskor
# úgyis a HTTP-gyorsítótárat megkerülve (cache: 'reload') tölti le őket.
map $uri $pacsi_cache {
  default     "no-cache";
  ~^/img/     "public, max-age=86400";
  ~^/icons/   "public, max-age=604800";
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;   # a proxy mögött az nginx http-t lát: relatív átirányítás, ne http://… cím

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header Cache-Control $pacsi_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /manifest.webmanifest { default_type application/manifest+json; }

  # Az app egyetlen oldal (az állapot a # után van): ismeretlen útvonalról a kezdőlapra irányítunk
  location = / { try_files /index.html =404; }
  location / { try_files $uri @home; }
  location @home { return 302 /; }
}
