# Pacsi – nginx a Coolify proxy (Traefik) mögött. A HTTPS-t és a www → pacsit.hu átirányítást a proxy intézi.
#
# Gyorsítótár: a HTML, a service worker és a manifest mindig újraellenőrzött (no-cache + ETag), így egy új
# kiadás azonnal kiér. A képek egy napig, az ikonok egy hétig cache-elhetők: a service worker a telepítéskor
# úgyis a HTTP-gyorsítótárat megkerülve (cache: 'reload') tölti le őket.
map $uri $pacsi_cache {
  default     "no-cache";
  ~^/img/     "public, max-age=86400";
  ~^/icons/   "public, max-age=604800";
}

# Rövid, követhető linkek a közösségi posztokba: a statisztika (Umami) így látja a platformot és a posztot.
#   /f/<poszt> Facebook · /i Instagram · /t TikTok · /l LinkedIn · /y YouTube – poszt nélkül: bio-link
#   → /?utm_source=<platform>&utm_medium=social&utm_campaign=pacsi&utm_content=<poszt vagy bio>
map $uri $pacsi_src {
  default  web;
  ~^/f     facebook;
  ~^/i     instagram;
  ~^/t     tiktok;
  ~^/l     linkedin;
  ~^/y     youtube;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;   # a proxy mögött az nginx http-t lát: relatív átirányítás, ne http://… cím

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header Cache-Control $pacsi_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /manifest.webmanifest { default_type application/manifest+json; }

  location ~ "^/[fitly](?:/(?<post>[a-z0-9_-]{1,40}))?/?$" {   # idézőjel kell: a { } különben blokknak számít
    set $content $post;
    if ($content = "") { set $content bio; }
    return 302 /?utm_source=$pacsi_src&utm_medium=social&utm_campaign=pacsi&utm_content=$content;
  }

  # Landing-útvonalak a hirdetésekhez (Google Ads): ugyanaz az app, megfelelő kezdőállapottal (kvíz, szűrő, lista, térkép).
  # A lekérdezés ($args, pl. utm_*) megmarad – a hirdetés követése (Umami) ettől működik. A # utáni rész az app saját állapota.
  location = /kviz        { return 302 "/?$args#kviz"; }
  location = /fajtak      { return 302 "/?$args#v=lista"; }
  location = /gyerekbarat { return 302 "/?$args#f=gyerek&v=lista"; }
  location = /lakas       { return 302 "/?$args#f=lakas&v=lista"; }
  location = /kezdo       { return 302 "/?$args#f=kezdo&v=lista"; }
  location = /csendes     { return 302 "/?$args#f=csendes&v=lista"; }
  location = /hullas      { return 302 "/?$args#f=hullas&v=lista"; }
  location = /magyar      { return 302 "/?$args#f=magyar&v=lista"; }
  location = /terkep      { return 302 "/?$args#v=terkep"; }

  # Hirdetés-csomag (Ads Engine): brief, kész hirdetések és képek a Google Ads motornak. Nincs indexelés, mindig friss (ETag).
  # A location saját add_header-jei felülírják a szerver szintűeket, ezért itt megismételjük a fontosakat.
  location /ads/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # Az app egyetlen oldal (az állapot a # után van): ismeretlen útvonalról a kezdőlapra irányítunk (a lekérdezés megmarad)
  location = / { try_files /index.html =404; }
  location = /hirlevel { return 301 "/hirlevel/$is_args$args"; }   # hírlevél-feliratkozó oldal
  location / { try_files $uri $uri/index.html @home; }
  location @home { return 302 "/$is_args$args"; }
}
