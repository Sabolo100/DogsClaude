<title>Pacsi Marketing Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..800,0..100;1,9..144,500..800,0..100&family=Manrope:wght@400..800&display=swap">
<style>
:root {
  --bg: #FBF6EE; --bg-2: #F5EDE1; --surface: #FFFDF9; --raise: #FFFFFF;
  --ink: #1E1B18; --ink-2: #6B625A; --ink-3: #9A9088;
  --line: rgba(30, 27, 24, .10); --line-2: rgba(30, 27, 24, .06);
  --primary: #EE5A2C; --primary-2: #FF8A3D; --primary-soft: #FFE3D6; --on-primary: #fff;
  --teal: #17756E; --teal-soft: #D5EFEA; --ok: #2E9E6A; --ok-soft: #DDF3E6; --warn: #B8631A; --warn-soft: #FDECD6;
  --idea: #7C6BD6; --idea-soft: #ECE8FF; --bad: #C23B2E; --bad-soft: #FBE3DF;
  --pf-email: var(--teal);
  --pf-tiktok: #111111; --pf-instagram: #D6336C; --pf-facebook: #1877F2; --pf-linkedin: #0A66C2; --pf-youtube: #FF0000;
  --shadow: 0 1px 2px rgba(90, 50, 20, .06), 0 6px 20px rgba(90, 50, 20, .07);
  --shadow-lg: 0 2px 6px rgba(90, 50, 20, .08), 0 24px 60px rgba(90, 50, 20, .18);
  --font-d: 'Fraunces', ui-serif, Georgia, serif;
  --font-u: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121A; --bg-2: #1A1722; --surface: #1D1A25; --raise: #25212F;
    --ink: #F4EFE8; --ink-2: #B4ABA2; --ink-3: #7F776F;
    --line: rgba(244, 239, 232, .12); --line-2: rgba(244, 239, 232, .07);
    --primary: #FF7F55; --primary-2: #FFA05C; --primary-soft: #3A2226; --on-primary: #1A0D08;
    --teal: #3CC2B4; --teal-soft: #173432; --ok: #5BD69A; --ok-soft: #173326; --warn: #FFB45C; --warn-soft: #3A2A16;
    --idea: #A99BFF; --idea-soft: #26213F; --bad: #FF8A7E; --bad-soft: #3A1F22;
    --pf-tiktok: #EDEDED; --pf-instagram: #FF5C8E; --pf-facebook: #4C9BFF; --pf-linkedin: #4DA3F0; --pf-youtube: #FF4D4D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .3);
    --shadow-lg: 0 4px 10px rgba(0, 0, 0, .35), 0 30px 80px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14121A; --bg-2: #1A1722; --surface: #1D1A25; --raise: #25212F;
  --ink: #F4EFE8; --ink-2: #B4ABA2; --ink-3: #7F776F;
  --line: rgba(244, 239, 232, .12); --line-2: rgba(244, 239, 232, .07);
  --primary: #FF7F55; --primary-2: #FFA05C; --primary-soft: #3A2226; --on-primary: #1A0D08;
  --teal: #3CC2B4; --teal-soft: #173432; --ok: #5BD69A; --ok-soft: #173326; --warn: #FFB45C; --warn-soft: #3A2A16;
  --idea: #A99BFF; --idea-soft: #26213F; --bad: #FF8A7E; --bad-soft: #3A1F22;
  --pf-tiktok: #EDEDED; --pf-instagram: #FF5C8E; --pf-facebook: #4C9BFF; --pf-linkedin: #4DA3F0; --pf-youtube: #FF4D4D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .3);
  --shadow-lg: 0 4px 10px rgba(0, 0, 0, .35), 0 30px 80px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--font-u); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 600px) { .wrap { padding-inline: 16px; } }

/* fejléc */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 64px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.logo { font: 800 28px/1 var(--font-d); font-variation-settings: "SOFT" 100, "opsz" 72; letter-spacing: -.02em; position: relative; }
.logo .i { position: relative; display: inline-block; }
.logo .i svg { position: absolute; width: .5em; height: .5em; left: 50%; top: -.28em; transform: translateX(-50%) rotate(-12deg); fill: var(--primary); }
.brand small { font: 700 12px/1 var(--font-u); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line-2); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tstat { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.dot.on { background: var(--ok); } .dot.busy { background: var(--warn); }
@media (max-width: 760px) { .tabs { order: 3; width: 100%; } .tstat .ver { display: none; } }

main { padding-block: 26px 80px; }
h1, h2, h3 { font-family: var(--font-d); font-variation-settings: "SOFT" 100, "opsz" 96; letter-spacing: -.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 18px; font-weight: 700; }
.lead { color: var(--ink-2); max-width: 70ch; margin: 8px 0 0; }
.kicker { font: 800 11.5px/1 var(--font-u); letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }

/* chip-ek, címkék */
.pf { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.pf i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 700 12px/1.6 var(--font-u); white-space: nowrap; border: 1px solid transparent; }
.st-tervezett { background: var(--bg-2); color: var(--ink-2); border-color: var(--line); }
.st-kesz { background: var(--teal-soft); color: var(--teal); }
.st-kiposztolva { background: var(--ok-soft); color: var(--ok); }
.st-otlet { background: var(--idea-soft); color: var(--idea); border: 1px dashed color-mix(in srgb, var(--idea) 50%, transparent); }
.kind { background: var(--primary-soft); color: var(--primary); }
.btn, .seg button { font-family: var(--font-u); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--ink); text-decoration: none; }
.btn:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.btn.fill { background: var(--primary); border-color: transparent; color: var(--on-primary); }
.btn.fill:hover { filter: brightness(1.05); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* következő posztok */
.next { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .next { grid-template-columns: 1fr; } }
.ncard { display: grid; grid-template-columns: 86px 1fr; gap: 14px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); text-align: left; align-items: center; }
.ncard .th { width: 86px; height: 86px; border-radius: 14px; background: var(--bg-2) center/cover; }
.ncard .when { font: 800 13px/1.2 var(--font-u); font-variant-numeric: tabular-nums; }
.ncard .t { font: 700 15px/1.3 var(--font-u); margin: 4px 0 6px; }
.ncard .pfl { display: flex; gap: 4px 12px; flex-wrap: wrap; }
.ncard.first { border-color: color-mix(in srgb, var(--primary) 40%, transparent); }

/* naptár */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; }
.cal .dh { background: var(--bg-2); padding: 8px 10px; font: 800 11px/1 var(--font-u); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.day { background: var(--surface); min-height: 124px; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
.day .dn { font: 800 13px/1 var(--font-u); color: var(--ink-3); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
.day.today { background: color-mix(in srgb, var(--primary-soft) 55%, var(--surface)); }
.day.today .dn { color: var(--primary); }
.day.past { background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.day.out { background: var(--bg); }
.day .ev { font-size: 11px; color: var(--primary); font-weight: 800; }
.slot { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 7px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--raise); text-align: left; font: 600 12px/1.25 var(--font-u); color: var(--ink); min-width: 0; }
.slot i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.slot .dots { display: inline-flex; gap: 3px; flex: none; }
.slot b { font-weight: 800; font-variant-numeric: tabular-nums; flex: none; }
.slot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.slot.done { opacity: .6; } .slot.done span { text-decoration: line-through; }
.slot.idea { border-style: dashed; border-color: color-mix(in srgb, var(--idea) 60%, transparent); background: var(--idea-soft); }
.slot:hover { border-color: color-mix(in srgb, var(--primary) 50%, transparent); }
.agenda { display: none; }
@media (max-width: 820px) {
  .cal { display: none; }
  .agenda { display: flex; flex-direction: column; gap: 10px; }
  .aday { background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; padding: 12px; }
  .aday h3 { font: 800 14px/1.2 var(--font-u); margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
  .aday .slot { padding: 9px 10px; font-size: 13.5px; margin-top: 6px; }
}
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }

/* tartalmak */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-weight: 700; font-size: 13px; color: var(--ink-2); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fsep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-top: 18px; }
.card { display: flex; flex-direction: column; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); overflow: hidden; text-align: left; padding: 0; color: var(--ink); }
.card:hover { border-color: color-mix(in srgb, var(--primary) 40%, transparent); transform: translateY(-2px); transition: transform .2s, border-color .2s; }
.card .th { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2) center/contain no-repeat; border-bottom: 1px solid var(--line-2); }
.card .th .play { position: absolute; left: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; }
.card .th .play svg { width: 18px; height: 18px; fill: #fff; margin-left: 2px; }
.card .th .n { position: absolute; right: 10px; top: 10px; }
.card .bd { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card .t { font: 800 15px/1.3 var(--font-u); }
.card .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-3); }
.card .pfs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }
.empty { padding: 40px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: var(--r); margin-top: 18px; }

/* ötletek, útmutató */
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.icard { border-radius: var(--r); padding: 18px; background: var(--surface); border: 1px dashed color-mix(in srgb, var(--idea) 45%, transparent); display: flex; flex-direction: column; gap: 8px; }
.icard .hook { font: italic 700 17px/1.3 var(--font-d); color: var(--primary); }
.icard textarea { min-height: 60px; }
.gtab { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.gtab th, .gtab td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line-2); vertical-align: top; font-size: 14px; }
.gtab th { font: 800 11.5px/1.2 var(--font-u); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); background: var(--bg-2); }
.tw { overflow-x: auto; border-radius: var(--r); }
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.panel ol { margin: 10px 0 0; padding-left: 20px; } .panel li { margin: 6px 0; }
.bio { display: grid; gap: 10px; }
.bio .row { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); }
.bio pre { margin: 0; white-space: pre-wrap; font: 500 14px/1.5 var(--font-u); }
@media (max-width: 600px) { .bio .row { grid-template-columns: 1fr; } }

/* részletek (oldalpanel) */
.scrim { position: fixed; inset: 0; background: rgba(20, 14, 10, .38); z-index: 50; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(980px, 100%); z-index: 51; background: var(--bg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.sheet .sh { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet .sh h2 { font-size: 20px; flex: 1; min-width: 0; }
.sheet .sb { overflow: auto; padding: 18px; display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 22px; align-items: start; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 820px) { .sheet .sb { grid-template-columns: 1fr; } }
.pv { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 820px) { .pv { position: static; } }
.pv .media { border-radius: 16px; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line-2); }
.pv video, .pv img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; background: #000; }
.pv img { background: var(--bg-2); }
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.strip img { width: 86%; flex: none; scroll-snap-align: start; border-radius: 14px; border: 1px solid var(--line-2); }
.dl { display: flex; flex-direction: column; gap: 8px; }
.dl .btn { justify-content: space-between; }
.dl .btn small { color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
.box { background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; padding: 16px; }
.box + .box { margin-top: 14px; }
.box h3 { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line-2); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
textarea, select, input[type="text"], input[type="search"], input[type="date"], input[type="time"] { width: 100%; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.5; }
textarea { resize: vertical; min-height: 170px; }
textarea:focus, input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 22%, transparent); }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.cnt { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cnt.over { color: var(--warn); font-weight: 800; }
.tip { font-size: 12.5px; color: var(--ink-2); background: var(--bg-2); border-radius: 10px; padding: 8px 11px; margin-top: 10px; }
.slots { display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: 120px 1fr 110px auto; gap: 8px; align-items: center; }
@media (max-width: 520px) { .srow { grid-template-columns: 1fr 1fr; } }
.chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.chk input { width: 18px; height: 18px; accent-color: var(--ok); }
.notes { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; } .notes li { margin: 5px 0; }
.alts { display: grid; gap: 10px; margin-top: 12px; }
.alt { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--raise); }
.alt p { margin: 0 0 8px; white-space: pre-wrap; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow-lg); }
.foot { margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
/* ---------- e-mail (eDM) ---------- */
.ser { display: inline-flex; align-items: center; gap: 6px; font: 800 11px/1 var(--font-u); letter-spacing: .08em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
.ser i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.est-terv { background: var(--bg-2); color: var(--ink-2); border-color: var(--line); }
.est-kesz { background: var(--teal-soft); color: var(--teal); }
.est-jovahagyva { background: var(--ok-soft); color: var(--ok); }
.est-piszkozat { background: var(--idea-soft); color: var(--idea); }
.est-utemezve { background: var(--warn-soft); color: var(--warn); }
.est-kikuldve { background: var(--ok-soft); color: var(--ok); font-weight: 800; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font: 700 11.5px/1.6 var(--font-u); background: var(--bg-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.egrid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .egrid { grid-template-columns: 1fr; } }
.enext { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: center; width: 100%; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent); box-shadow: var(--shadow); text-align: left; color: var(--ink); }
.enext .eth { width: 100%; aspect-ratio: 2 / 1; border-radius: 12px; background: var(--bg-2) center/cover; }

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = ymd(new Date());
const HU_DAY = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];
const HU_MON = ['január', 'február', 'március', 'április', 'május', 'június', 'július', 'augusztus', 'szeptember', 'október', 'november', 'december'];
const EVENTS = { '2026-10-04': 'Állatok világnapja', '2026-10-23': 'Nemzeti ünnep', '2026-10-31': 'Halloween', '2026-11-11': 'Márton-nap',
  '2026-11-27': 'Black Friday', '2026-12-06': 'Mikulás', '2026-12-24': 'Szenteste', '2026-12-31': 'Szilveszter' };
const ic = n => ({
  dl: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>',
  copy: '<svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  x: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  spark: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>',
  undo: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  open: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
  search: '<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  cal: '<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
}[n]);
const fmtB = b => b > 1e6 ? (b / 1e6).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' kB';
const dateHu = d => { const x = new Date(d + 'T12:00:00'); return `${HU_MON[x.getMonth()].slice(0, 3)}. ${x.getDate()}., ${HU_DAY[x.getDay()]}`; };

/* ---------------- állapot és tárolás ---------------- */
const S = { tab: 'naptar', fk: 'all', fp: 'all', open: null, pf: null, edits: {}, ideas: {}, ro: false,
  emails: {}, contacts: {}, setup: {}, eopen: null, copen: null, ef: 'all', pv: 'd', cc: 'all', cs: 'all', ck: 'all', cq: '', cp: false, cn: 60,
  metrics: {}, hall: false, repv: false, utm: null };
const LS = 'pacsi-cms:v1';
const cap = { db: null, dl: null, sample: null, ready: false };
const setSave = (txt, cls = '') => { $('#saveState').innerHTML = `<span class="dot ${cls}"></span> ${esc(txt)}`; };
try { const raw = localStorage.getItem(LS); if (raw) { const j = JSON.parse(raw); S.edits = j.edits || {}; S.ideas = j.ideas || {}; S.emails = j.emails || {}; S.contacts = j.contacts || {}; S.setup = j.setup || {}; S.metrics = j.metrics || {}; } } catch (e) { /* privát ablak */ }
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify({ edits: S.edits, ideas: S.ideas, emails: S.emails, contacts: S.contacts, setup: S.setup, metrics: S.metrics })); } catch (e) { /* nem elérhető */ } };
const STORE = { edits: () => S.edits, ideas: () => S.ideas, emails: () => S.emails, contacts: () => S.contacts, setup: () => S.setup, metrics: () => S.metrics };

const pend = new Map(), chain = new Map(), dirty = new Set();   // késleltetett, dokumentumonként egymás utáni írások
function persist(col, id) {
  if (!cap.db) { saveLocal(); setSave('Mentve ezen az eszközön', 'on'); return; }
  const key = col + '/' + id;
  dirty.add(key);
  clearTimeout(pend.get(key));
  setSave('Mentés…', 'busy');
  pend.set(key, setTimeout(() => {
    const prev = chain.get(key) || Promise.resolve();
    const next = prev.then(async () => {
      const body = STORE[col]()[id] || {};
      try {
        await cap.db.doc(key).set({ ...JSON.parse(JSON.stringify(body)), updatedAt: new Date().toISOString() });
        if (!pend.has(key)) dirty.delete(key);
        setSave('Mentve – mindenki látja', 'on');
      } catch (e) {
        if (e && e.code === 'invalid_argument') { S.ro = true; setSave('Csak olvasható – nincs szerkesztési jogod'); }
        else setSave('Nem sikerült menteni – próbáld újra');
      }
    });
    chain.set(key, next);
    pend.delete(key);
  }, 700));
}
async function initCaps() {
  const c = window.claude;
  if (!c || !c.use) { setSave(`Helyi mód – ${location.protocol === 'file:' ? 'fájlból' : 'ezen az eszközön'} ment`, 'on'); return; }
  const [db, dl, sm] = await Promise.all([c.use('db'), c.use('downloads'), c.use('sample')]);
  cap.dl = dl; cap.sample = sm;
  if (db) {
    cap.db = db;
    setSave('Szinkronizálva', 'on');
    db.collection('edits').onSnapshot(snap => {
      const e = {};
      snap.docs.forEach(d => { e[d.id] = JSON.parse(JSON.stringify(d.data() || {})); });
      for (const k of dirty) if (k.startsWith('edits/')) { const id = k.slice(6); if (S.edits[id]) e[id] = S.edits[id]; }
      const changed = snap.docChanges().map(c => c.doc.id);
      S.edits = e;
      synced(changed.includes(S.open) && !dirty.has('edits/' + S.open));
    }, () => setSave('A szinkron megszakadt – frissítsd az oldalt'));
    db.collection('ideas').onSnapshot(snap => {
      const e = {};
      snap.docs.forEach(d => { e[d.id] = JSON.parse(JSON.stringify(d.data() || {})); });
      for (const k of dirty) if (k.startsWith('ideas/')) { const id = k.slice(6); if (S.ideas[id]) e[id] = S.ideas[id]; }
      S.ideas = e;
      if (S.tab === 'otletek' || S.tab === 'attekintes') synced(false);
    }, () => {});
    const sub = (col, after) => db.collection(col).onSnapshot(snap => {
      const e = {};
      snap.docs.forEach(d => { e[d.id] = JSON.parse(JSON.stringify(d.data() || {})); });
      for (const k of dirty) if (k.startsWith(col + '/')) { const id = k.slice(col.length + 1); if (STORE[col]()[id]) e[id] = STORE[col]()[id]; }
      S[col] = e;
      const a = document.activeElement, typing = !!a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT');
      after(snap.docChanges().map(x => x.doc.id), typing);
    }, () => {});
    // a nyitott panel csak akkor rajzolódik újra, ha máshol módosították, és épp nem gépelsz benne
    sub('emails', (ch, typing) => {
      if (S.eopen) { if (ch.includes(S.eopen) && !dirty.has('emails/' + S.eopen) && !typing) renderEmailSide(); }
      else if (S.tab === 'email' || S.tab === 'naptar' || S.tab === 'attekintes' || S.tab === 'eredmenyek') synced(false);
    });
    sub('setup', () => { if (S.tab === 'inditas' || S.tab === 'attekintes') synced(false); });
    sub('contacts', (ch, typing) => {
      if (S.copen && S.copen !== '__new') { if (ch.includes(S.copen) && !dirty.has('contacts/' + S.copen) && !typing) openContact(S.copen, true); }
      else if (S.tab === 'kapcsolatok' && !typing) refreshContacts();
      else if ((S.tab === 'attekintes' || S.tab === 'eredmenyek') && !typing) synced(false);
    });
    sub('metrics', (ch, typing) => { if ((S.tab === 'eredmenyek' || S.tab === 'attekintes') && !typing) synced(false); });
  } else setSave('Helyi mód – ezen az eszközön ment', 'on');
  cap.ready = true;
  if (S.open) openItem(S.open, true);
}

/* szerkesztett értékek (a content.json az alap, a tároló a felülírás) */
const E = id => (S.edits[id] = S.edits[id] || {});
const copyOf = (it, pf) => { const b = (it.copy || {})[pf] || { text: '', tags: '' }; const e = ((S.edits[it.id] || {}).copy || {})[pf] || {}; return { text: e.text ?? b.text, tags: e.tags ?? b.tags }; };
const statusOf = it => (S.edits[it.id] || {}).status || it.status;
const slotsOf = it => (it.slots || []).map((s, i) => ({ ...s, ...(((S.edits[it.id] || {}).slots || {})[i] || {}) }));

/* minden idősáv (tartalom + ötlet), dátum szerint */
function allSlots() {
  const out = [];
  for (const it of D.items) slotsOf(it).forEach((s, i) => out.push({ ...s, i, it }));
  for (const o of D.ideas) out.push({ platform: 'tiktok', date: o.date, time: '19:00', idea: o, note: 'TikTok + Reels' });
  if (EM) for (const e of EM.emails) if (e.date) out.push({ platform: 'email', date: e.date, time: e.time, email: e, done: eStatus(e) === 'kikuldve' });
  return out.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}

/* ---------------- nézetek ---------------- */
function render() {
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  $('#main').innerHTML = ({ attekintes: vDash, naptar: vCal, inditas: vSetup, tartalmak: vLib, email: vEmail, kapcsolatok: vContacts,
    eredmenyek: vResults, otletek: vIdeas, arculat: vBrand, utmutato: vGuide })[S.tab]() + footer();
}
let rrT = 0;
/* szinkron után a háttérnézet frissül; a nyitott panel csak akkor, ha azt máshol módosították
   (így nem ugrik vissza a lejátszott videó, és nem vész el, amit éppen gépelsz) */
function synced(reopen) {
  clearTimeout(rrT);
  rrT = setTimeout(() => {
    const a = document.activeElement, typing = a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT');
    if (!(typing && !S.open)) render();
    if (reopen && S.open && !typing) openItem(S.open, true);
  }, 60);
}
const footer = () => `<div class="foot"><span>Pacsi Marketing Studio · v${esc(D.version)} · build ${esc(D.build)} · tartalom: ${esc(D.built)}</span><span>Pacsi by DarwinAI · <a href="${esc(D.site)}" target="_blank" rel="noopener" style="color:inherit">${esc(D.siteLabel)}</a></span></div>`;
const pfChip = p => `<span class="pf" style="--c:var(--pf-${p})"><i></i>${esc(PF[p].name)}</span>`;
const stPill = st => `<span class="pill st-${st}">${st === 'kiposztolva' ? '✓ ' : ''}${esc(D.statuses[st] || st)}</span>`;

function groupSlots(sl) {
  const g = new Map(), out = [];
  for (const s of sl) {
    if (s.idea || s.email) { out.push(s); continue; }
    const k = s.date + '|' + s.it.id;
    if (!g.has(k)) { const x = { date: s.date, time: s.time, it: s.it, pfs: [], done: true, notes: [] }; g.set(k, x); out.push(x); }
    const x = g.get(k);
    x.pfs.push(s.platform); x.done = x.done && !!s.done; if (s.time < x.time) x.time = s.time;
    if (s.note) x.notes.push(s.note);
  }
  return out;
}
function vCal() {
  const sl = allSlots();
  const gs = groupSlots(sl);
  const up = gs.filter(s => !s.idea && !s.email && !s.done && s.date >= TODAY).slice(0, 3);
  const nextHtml = up.length ? up.map((s, k) => `<button class="ncard${k ? '' : ' first'}" data-open="${s.it.id}" data-pf="${s.pfs[0]}">
      <span class="th" style="background-image:url('${s.it.thumb || ''}')"></span>
      <span><span class="when">${esc(dateHu(s.date))} · ${esc(s.time)}</span><div class="t">${esc(s.it.title)}</div><span class="pfl">${[...new Set(s.pfs)].map(pfChip).join('')}</span></span></button>`).join('')
    : '<div class="empty">Minden tervezett poszt kint van. 🎉 Nézd meg a Következő videók fület!</div>';
  // naptárrács: az első idősáv hetének hétfőjétől az utolsó hét vasárnapjáig
  const first = new Date(sl[0].date + 'T12:00:00'), last = new Date(sl[sl.length - 1].date + 'T12:00:00');
  const start = new Date(first); start.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  const end = new Date(last); end.setDate(last.getDate() + (6 - (last.getDay() + 6) % 7));
  const byDay = {};
  gs.forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  const slotBtn = s => s.email
    ? `<button class="slot${s.done ? ' done' : ''}" data-email="${s.email.id}" style="--c:var(--pf-email)" title="E-mail: ${esc(eSubject(s.email))}"><i></i><b>${esc(s.time)}</b><span>✉ ${esc(s.email.title)}</span></button>`
    : s.idea
    ? `<button class="slot idea" data-idea="${s.idea.id}" style="--c:var(--idea)" title="Ötlet: ${esc(s.idea.title)}"><i></i><b>${esc(s.time)}</b><span>Ötlet: ${esc(s.idea.title)}</span></button>`
    : `<button class="slot${s.done ? ' done' : ''}" data-open="${s.it.id}" data-pf="${s.pfs[0]}" title="${esc([...new Set(s.pfs)].map(p => PF[p].name).join(', '))} · ${esc(s.it.title)}"><span class="dots">${[...new Set(s.pfs)].map(p => `<i style="--c:var(--pf-${p})"></i>`).join('')}</span><b>${esc(s.time)}</b><span>${s.done ? '✓ ' : ''}${esc(s.it.title)}</span></button>`;
  let cells = ['H', 'K', 'Sze', 'Cs', 'P', 'Szo', 'V'].map(d => `<div class="dh">${d}</div>`).join('');
  let agenda = '';
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = ymd(d), list = byDay[k] || [];
    const cls = k === TODAY ? ' today' : k < TODAY ? ' past' : '';
    cells += `<div class="day${cls}"><div class="dn"><span>${d.getMonth() + 1}. ${d.getDate()}.</span>${EVENTS[k] ? `<span class="ev">★</span>` : ''}</div>${EVENTS[k] ? `<div class="ev">${esc(EVENTS[k])}</div>` : ''}${list.map(slotBtn).join('')}</div>`;
    if (list.length) agenda += `<div class="aday"><h3>${esc(dateHu(k))}${k === TODAY ? ' <span class="pill kind">ma</span>' : ''}${EVENTS[k] ? ` <span class="muted small">★ ${esc(EVENTS[k])}</span>` : ''}</h3>${list.map(slotBtn).join('')}</div>`;
  }
  const done = sl.filter(s => !s.idea && !s.email && s.done).length, total = sl.filter(s => !s.idea && !s.email).length;
  return `<div class="kicker">Tartalomnaptár</div><h1 style="margin-top:8px">Mit posztolunk, és mikor?</h1>
    <p class="lead">Kétnaponta új TikTok/Reels videó, hetente 3–4 kép- vagy karusszelposzt, heti egy LinkedIn-poszt – és csütörtökönként a Pacsi-levél (✉). Kattints egy bejegyzésre: letöltheted a fájlt, kimásolhatod és szerkesztheted a szöveget, és kiposztoltnak jelölheted.</p>
    <section class="sec"><div class="sec-h"><h2>Következő posztok</h2><span class="muted small">${done} / ${total} idősáv kiposztolva</span></div><div class="next">${nextHtml}</div></section>
    <section class="sec"><div class="sec-h"><h2>${esc(HU_MON[start.getMonth()])} – ${esc(HU_MON[end.getMonth()])}</h2><span class="muted small">Szaggatott keret: még elkészítendő videóötlet</span></div>
      <div class="cal">${cells}</div><div class="agenda">${agenda}</div>
      <div class="legend">${PFK.map(pfChip).join('')}<span class="pf" style="--c:var(--pf-email)"><i></i>E-mail</span><span class="pf" style="--c:var(--idea)"><i></i>Videóötlet</span></div></section>`;
}

function vLib() {
  const kinds = [['all', 'Mind'], ...Object.entries(D.kinds).filter(([k]) => k !== 'otlet' && D.items.some(i => i.kind === k))];
  let list = D.items.filter(i => (S.fk === 'all' || i.kind === S.fk) && (S.fp === 'all' || (i.copy && i.copy[S.fp]) || (i.slots || []).some(s => s.platform === S.fp)));
  const cards = list.map(it => {
    const st = statusOf(it), next = slotsOf(it).filter(s => !s.done).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
    const pfs = [...new Set([...(it.slots || []).map(s => s.platform), ...Object.keys(it.copy || {})])];
    const pages = (it.files || []).filter(f => f.role === 'page').length;
    return `<button class="card" data-open="${it.id}">
      <span class="th" style="background-image:url('${it.thumb || ''}');${it.ratio && it.ratio > 1.05 ? 'background-size:contain' : ''}">${it.kind === 'video' ? `<span class="play">${ic('play')}</span>` : ''}${pages ? `<span class="n pill st-tervezett">${pages} dia</span>` : ''}</span>

    <p class="lead">${D.items.length} anyag: videók, posztképek, karusszel, storyk, hirdetések és profilképek. A kártyára kattintva letöltheted a fájlokat és a posztszövegeket.</p>

      <span class="fsep"></span>${[['all', 'Minden platform'], ...PFK.map(p => [p, PF[p].name])].map(([k, l]) => `<button class="fchip" data-fp="${k}" aria-pressed="${S.fp === k}">${esc(l)}</button>`).join('')}
      <button class="btn sm ghost" id="csv" style="margin-left:auto">${ic('dl')} Szövegek (CSV)</button></div>
    ${cards ? `<div class="grid">${cards}</div>` : '<div class="empty">Ehhez a szűréshez nincs anyag.</div>'}`;
}

let toastT = 0;
function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Kimásolva ✓'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { /* régi böngésző */ }
    ta.remove(); toast(ok ? 'Kimásolva ✓' : 'Jelöld ki és másold ki kézzel');
  }
}
async function download(f) {
  if (!f.url) { toast('Ez a fájl még nincs feltöltve'); return; }
  if (cap.dl) {
    toast('Letöltés előkészítése…');
    try {
      const blob = await (await fetch(f.url)).blob();
      await cap.dl.save({ filename: f.name, data: blob });
      toast('Letöltve ✓');
    } catch (e) { if (!e || e.code !== 'declined') toast(e && e.code === 'too_large' ? 'Túl nagy fájl ehhez a nézethez' : 'A letöltés nem sikerült'); }
    return;
  }
  if (window.claude) { window.open(f.url, '_blank', 'noopener'); return; }
  const a = document.createElement('a'); a.href = f.url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
}
function csv() {
  const rows = [['azonosító', 'cím', 'típus', 'platform', 'dátum', 'időpont', 'szöveg', 'hashtagek', 'alternatív szöveg']];

  }

  const f = new Blob([body], { type: 'text/csv' });
  if (cap.dl) { cap.dl.save({ filename: 'pacsi_posztszovegek.csv', data: f }).then(() => toast('Letöltve ✓'), e => { if (!e || e.code !== 'declined') toast('A letöltés nem sikerült'); }); return; }
  if (window.claude) { toast('A letöltés itt nem érhető el'); return; }

/* közösségi idősávok naponként és tartalmanként összevonva, a slot-sorszámokkal (a naptárexport állandó azonosítójához) */
function postGroups() {
  const g = new Map();
  for (const s of allSlots()) {
    if (s.idea || s.email) continue;
    const k = s.date + '|' + s.it.id;
    if (!g.has(k)) g.set(k, { date: s.date, time: s.time, it: s.it, pfs: [], idx: [], done: true, notes: [] });
    const x = g.get(k);
    x.pfs.push(s.platform); x.idx.push(s.i); x.done = x.done && !!s.done; if (s.time < x.time) x.time = s.time;
    if (s.note) x.notes.push(s.note);
  }
  return [...g.values()].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}

  const end = addDays(TODAY, 7), from = addDays(TODAY, -14), rows = [];

/* ---------- heti jelentés (másolható szöveg: e-mailbe, csevegőbe) ---------- */
function weeklyReport() {
  const from = addDays(TODAY, -6), next = addDays(TODAY, 7), L = [];
  const pfs = g => [...new Set(g.pfs)].map(p => PF[p].name).join(', ');
  const pg = postGroups();
  const posted = pg.filter(g => g.done && g.date >= from && g.date <= TODAY), late = pg.filter(g => !g.done && g.date < TODAY);
  const up = pg.filter(g => !g.done && g.date >= TODAY && g.date <= next);
  L.push(`${(BRD && BRD.name) || 'Marketing'} – heti összefoglaló (${dShort(from)} – ${dShort(TODAY)})`, '');
  L.push('KIPOSZTOLVA', ...(posted.length ? posted.map(g => `- ${dShort(g.date)} ${g.time} · ${g.it.title} (${pfs(g)})`) : ['- ezen a héten még semmi']));
  if (late.length) L.push('', 'LEKÉSETT (még nincs kint)', ...late.map(g => `- ${dShort(g.date)} · ${g.it.title} (${pfs(g)})`));
  if (EM) {
    const sent = EM.emails.filter(e => e.date && e.date >= from && e.date <= TODAY && eStatus(e) === 'kikuldve');
    const nx = EM.emails.filter(e => e.date && e.date > TODAY && e.date <= next);
    L.push('', 'HÍRLEVÉL', ...(sent.length ? sent.map(e => { const r = (e.mc || {}).report; return `- kiküldve: ${e.id} „${eSubject(e)}”${r ? ` – megnyitás ${Math.round((r.open_rate || 0) * 100)}%, kattintás ${Math.round((r.click_rate || 0) * 100)}%` : ''}`; }) : ['- ezen a héten nem ment levél']),
      ...nx.map(e => `- jön: ${dShort(e.date)} ${e.time} · ${e.id} „${eSubject(e)}” (${EST[eStatus(e)] || eStatus(e)})`));
  }
  const o = INS && INS.outreach;
  if (o || CT) {
    const wk = o ? o.days.filter(d => d.date >= from && d.date <= TODAY) : [];
    const s = wk.reduce((n, d) => n + d.sent, 0), b = wk.reduce((n, d) => n + d.bounced, 0);
    const all = CT ? contactsAll() : [];
    const rep = all.filter(c => REPLIED.includes(cStatus(c)) && (cOv(c).updated || '') >= from).length;
    L.push('', 'PARTNERMEGKERESÉSEK', `- a héten elküldve: ${s} · visszapattant: ${b}${s ? ` (${Math.round(b / s * 100)}%)` : ''} · válasz: ${rep}`,
      `- összesen: ${o ? o.sent : 0} elküldve · partner: ${all.filter(c => cStatus(c) === 'partner').length}${o && o.paused ? ' · a kiküldés most szünetel' : ''}`);
  }
  if (SU.length) { const p = setupProgress(); L.push('', 'PROFILINDÍTÁS', `- ${p.done}/${p.tot} lépés kész`); }
  const ideas = D.ideas.filter(x => x.date >= TODAY && x.date <= next);
  L.push('', 'JÖVŐ HÉT', ...(up.length ? up.map(g => `- ${dShort(g.date)} ${g.time} · ${g.it.title} (${pfs(g)})`) : ['- nincs tervezett poszt']),
    ...ideas.map(x => `- ${dShort(x.date)} · videóötlet: ${x.title}${(S.ideas[x.id] || {}).want ? ' (kérve)' : ''}`));
  const w = warnings().filter(x => x.lvl !== 'info').slice(0, 6);
  if (w.length) L.push('', 'TEENDŐK', ...w.map(x => `- ${x.text}`));
  L.push('', `(${D.siteLabel} · Marketing Studio v${D.version} · build ${D.build})`);
  return L.join('\n');
}

/* ---------- naptárexport (iCalendar): Google Naptár, Outlook, Apple Naptár ---------- */
function icsText() {
  const ie = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const enc = new TextEncoder();
  const fold = l => { const out = []; let cur = ''; for (const ch of l) { if (enc.encode(cur + ch).length > 74) { out.push(cur); cur = ' ' + ch; } else cur += ch; } out.push(cur); return out.join('\r\n'); };
  const dt = (d, t) => d.replace(/-/g, '') + 'T' + (t || '10:00').replace(':', '') + '00';
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const url = BRD && BRD.cmsUrl, ev = [];
  const add = (uid, d, t, mins, sum, desc, alarm) => ev.push(['BEGIN:VEVENT', `UID:${uid}@pacsi-cms`, `DTSTAMP:${stamp}`, `DTSTART;TZID=Europe/Budapest:${dt(d, t)}`, `DURATION:PT${mins}M`,
    `SUMMARY:${ie(sum)}`, `DESCRIPTION:${ie(desc)}`, ...(url ? [`URL:${url}`] : []), ...(alarm ? ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${ie(sum)}`, 'TRIGGER:-PT15M', 'END:VALARM'] : []), 'END:VEVENT']);
  for (const g of postGroups()) {
    const pfs = [...new Set(g.pfs)];
    add(`post-${g.it.id}-s${Math.min(...g.idx)}`, g.date, g.time, 20, `${g.done ? '✓ ' : ''}${pfs.map(p => PF[p].name).join(' + ')}: ${g.it.title}`,
      [g.it.sub || '', ...[...new Set(g.notes)], `Fájl és szöveg: ${url ? url + '#' + g.it.id : 'CMS → Tartalmak'}`].filter(Boolean).join('\n'), !g.done);
  }
  if (EM) for (const e of EM.emails) if (e.date) {
    const st = eStatus(e);
    add(`email-${e.id}`, e.date, e.time, 15, `${st === 'kikuldve' ? '✓ ' : ''}✉ ${e.id}: ${eSubject(e)}`, `Hírlevél · ${EST[st] || st} · ${EM.segments[e.segment] || e.segment}${url ? `\n${url}#${e.id}` : ''}`, st !== 'kikuldve');
  }
  for (const o of D.ideas) add(`idea-${o.id}`, o.date, '19:00', 30, `Videóötlet: ${o.title}`, `${o.brief}\n${o.hook}`, false);
  const tz = ['BEGIN:VTIMEZONE', 'TZID:Europe/Budapest', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
    'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD', 'END:VTIMEZONE'];
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DarwinAI//Pacsi Marketing Studio//HU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    `X-WR-CALNAME:${ie(((BRD && BRD.name) || 'Marketing') + ' – tartalomnaptár')}`, 'X-WR-TIMEZONE:Europe/Budapest', ...tz, ...ev.flat(), 'END:VCALENDAR'];
  return { text: lines.map(fold).join('\r\n') + '\r\n', n: ev.length };
}

/* ---------- Arculat és eszközök (szövegbank, hangnem, színek, betűk, logók, linkek, UTM-linképítő) ---------- */
const utmSlug = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9_.\-]/g, '');
function utmInit() {
  if (S.utm || !BRD) return;
  const p = BRD.utm.presets[0];
  S.utm = { preset: p.id, url: BRD.utm.url, source: p.source, medium: p.medium, campaign: p.campaign, content: p.content };
}
function applyPreset(id) { const p = BRD.utm.presets.find(x => x.id === id); if (p) Object.assign(S.utm, { preset: id, source: p.source, medium: p.medium, campaign: p.campaign, content: p.content }); }
function utmUrl() {
  const u = S.utm, raw = (u.url || D.site).trim(), hi = raw.indexOf('#'), base = hi >= 0 ? raw.slice(0, hi) : raw, hash = hi >= 0 ? raw.slice(hi) : '';
  const q = ['source', 'medium', 'campaign', 'content'].filter(k => utmSlug(u[k])).map(k => `utm_${k}=${encodeURIComponent(utmSlug(u[k]))}`).join('&');
  return base + (q ? (base.includes('?') ? '&' : '?') + q : '') + hash;
}
/* a közösségi rövid link (pacsit.hu/f/<id>) csak akkor egyenértékű, ha a paraméterek pontosan a szerver szabályát követik */
function utmShort() {
  const u = S.utm, p = BRD.utm.presets.find(x => x.id === u.preset);
  if (!p || !p.short || utmSlug(u.source) !== p.source || utmSlug(u.medium) !== 'social' || utmSlug(u.campaign) !== 'pacsi' || (u.url || D.site).trim().replace(/\/$/, '') !== D.site.replace(/\/$/, '')) return '';
  const c = utmSlug(u.content);    // a poszt nélküli rövid link (pacsit.hu/f) a szerveren utm_content=bio lesz
  if (!c || !/^[a-z0-9_-]{1,40}$/.test(c)) return '';   // a szerver (nginx) csak ilyen azonosítót fogad el
  return D.site + p.short + (c !== 'bio' ? '/' + c : '');
}

/* ---------- globális keresés (Ctrl+K vagy /) ---------- */
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function searchIndex() {
  const x = [];
  const tabs = [['attekintes', 'Áttekintés'], ['naptar', 'Naptár'], ['inditas', 'Indítás'], ['tartalmak', 'Tartalmak'], ['email', 'E-mail'], ['kapcsolatok', 'Kapcsolatok'],
    ['eredmenyek', 'Eredmények'], ['otletek', 'Következő videók'], ['arculat', 'Arculat'], ['utmutato', 'Útmutató']];
  for (const [k, l] of tabs) x.push({ g: 'Fülek', t: l, s: 'fül', h: norm(l + ' ' + k), go: 'tab:' + k });
  for (const it of D.items) x.push({ g: 'Tartalmak', t: it.title, s: `${D.kinds[it.kind] || ''} · ${it.id}`, h: norm([it.id, it.title, it.sub, ...Object.values(it.copy || {}).map(c => c.text + ' ' + c.tags)].join(' ')), go: 'item:' + it.id });
  if (EM) for (const e of EM.emails) x.push({ g: 'Levelek', t: `${e.id} · ${eSubject(e)}`, s: e.date ? dShort(e.date) : (e.delay || ''), h: norm([e.id, e.title, e.subject, ...(e.subjectAlt || []), e.preheader, e.theme].join(' ')), go: 'email:' + e.id });
  if (CT) for (const c of contactsAll()) x.push({ g: 'Kapcsolatok', t: c.name, s: `${cId(c)}${c.city ? ' · ' + c.city : ''}`, h: norm([...(c.eids || []), c.name, c.city, c.county, c.type, ...(c.emails || []), ...(c.breeds || []).map(b => BN[b] || b)].join(' ')), go: 'contact:' + c.id });
  for (const o of D.ideas) x.push({ g: 'Ötletek', t: o.title, s: dShort(o.date), h: norm([o.title, o.hook, o.brief].join(' ')), go: 'idea:' + o.id });
  for (const p of SU) p.steps.forEach((st, i) => x.push({ g: 'Indítás', t: `${p.name}: ${st.do.replace(/\*\*|`/g, '')}`, s: `${i + 1}. lépés`, h: norm(`${p.name} ${st.do} ${st.copy || ''}`), go: 'setup:' + p.id }));
  if (BRD) for (const t of BRD.texts) x.push({ g: 'Arculat', t: t.label, s: 'szövegbank', h: norm(t.label + ' ' + t.text), go: 'tab:arculat' });
  return x;
}
let SIDX = null;
function openSearch() {
  if ($('#cmdk')) return;
  const w = document.createElement('div');
  w.id = 'cmdk';
  w.innerHTML = `<div class="cmdk-scrim"></div><div class="cmdk" role="dialog" aria-modal="true" aria-label="Keresés"><label class="sr" for="cmdq">Keresés</label>
    <input type="search" id="cmdq" placeholder="Keresés: tartalom, levél, kapcsolat (PK0042), ötlet, lépés…" autocomplete="off" spellcheck="false">
    <div class="res" id="cmdr" role="listbox" aria-label="Találatok"></div><div class="hint"><span><kbd>↑</kbd> <kbd>↓</kbd> választás</span><span><kbd>Enter</kbd> megnyitás</span><span><kbd>Esc</kbd> bezárás</span></div></div>`;
  document.body.appendChild(w);
  SIDX = searchIndex();
  searchRender('');
  $('#cmdq').focus();
}
function closeSearch() { const w = $('#cmdk'); if (w) w.remove(); SIDX = null; }
function searchRender(q) {
  const n = norm(q.trim()), toks = n.split(/\s+/).filter(Boolean), idx = SIDX || searchIndex();
  const hits = !toks.length ? idx.filter(x => x.g === 'Fülek')
    : idx.filter(x => toks.every(t => x.h.includes(t))).map(x => ({ x, r: norm(x.t).startsWith(n) ? 0 : norm(x.t).includes(n) ? 1 : 2 })).sort((a, b) => a.r - b.r).map(y => y.x);
  let html = '', k = 0;
  for (const g of ['Fülek', 'Tartalmak', 'Levelek', 'Kapcsolatok', 'Ötletek', 'Indítás', 'Arculat']) {
    const list = hits.filter(x => x.g === g).slice(0, g === 'Kapcsolatok' ? 8 : g === 'Fülek' && !toks.length ? 10 : 6);
    if (!list.length) continue;
    html += `<div class="grp">${esc(g)}</div>` + list.map(x => `<button class="hit" role="option" data-hit="${esc(x.go)}" aria-selected="${k++ === 0}"><span>${esc(x.t)}</span><small>${esc(x.s || '')}</small></button>`).join('');
  }
  $('#cmdr').innerHTML = html || `<div class="empty" style="margin:8px">Nincs találat erre: „${esc(q)}”</div>`;
}
function moveSel(d) {
  const all = $$('#cmdr [data-hit]'); if (!all.length) return;
  let i = all.findIndex(x => x.getAttribute('aria-selected') === 'true');
  if (i >= 0) all[i].setAttribute('aria-selected', 'false');
  i = (i + d + all.length) % all.length;
  all[i].setAttribute('aria-selected', 'true'); all[i].scrollIntoView({ block: 'nearest' });
}
/* ugrás: item:<id> · email:<id> · contact:<id> · idea:<id> · setup:<platform> · tab:<fül> */
function go(target) {
  const i = target.indexOf(':'), k = target.slice(0, i), id = target.slice(i + 1);
  closeSearch();
  if (k === 'item' && BY[id]) { S.eopen = null; S.copen = null; openItem(id); return; }
  if (k === 'email' && EBY[id]) { openEmail(id); return; }
  if (k === 'contact' && CT) { openContact(id); return; }
  if (S.open || S.eopen || S.copen) closeItem();
  if (k === 'idea') { S.tab = 'otletek'; render(); setTimeout(() => { const el = $(`[data-want="${id}"]`); if (el) el.closest('.icard').scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 30); return; }
  if (k === 'setup') { S.tab = 'inditas'; render(); setTimeout(() => { const el = document.getElementById('su-' + id); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 30); return; }
  if (k === 'tab') { S.tab = id; render(); window.scrollTo(0, 0); }
}

/* az új elemek eseményei – a meglévő kezelők előtt regisztrálva (a keresőablak Esc-je ne zárja be a mögötte nyitott panelt) */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#sopen') || t.closest('[data-search]')) { openSearch(); return; }
  const hit = t.closest('[data-hit]'); if (hit) { go(hit.dataset.hit); return; }
  if (t.closest('.cmdk-scrim')) { closeSearch(); return; }
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (t.closest('[data-ics]')) { saveBlob(new Blob([icsText().text], { type: 'text/calendar' }), 'pacsi_naptar.ics'); return; }
  if (t.closest('[data-rep]')) { copyText(weeklyReport()); return; }
  if (t.closest('[data-repv]')) { S.repv = !S.repv; render(); return; }
  if (t.closest('[data-hall]')) { S.hall = !S.hall; render(); return; }
  const bdl = t.closest('[data-bdl]'); if (bdl) { const [iid, k] = bdl.dataset.bdl.split(':'); const it = BY[iid]; if (it && it.files[+k]) download(it.files[+k]); }
});
document.addEventListener('keydown', e => {
  if ($('#cmdk')) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeSearch(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); return; }
    if (e.key === 'Enter') { const a = $('#cmdr [data-hit][aria-selected="true"]'); if (a) { e.preventDefault(); go(a.dataset.hit); } }
    return;
  }
  const tag = (e.target && e.target.tagName) || '', typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable);
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); return; }
  if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openSearch(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cmdq') { searchRender(t.value); return; }
  if (t.dataset.utm && S.utm) { S.utm[t.dataset.utm] = t.value; utmRefresh(); return; }
  if (t.dataset.met && !S.ro) {
    const [id, i, k] = t.dataset.met.split(':');
    const d = (S.metrics[id] = S.metrics[id] || {}); d.s = d.s || {};
    const x = (d.s[i] = d.s[i] || {});
    if (t.value === '') delete x[k]; else x[k] = Math.max(0, Math.round(+t.value) || 0);
    x.at = TODAY;
    persist('metrics', id);
    const el = document.querySelector(`[data-er="${id}:${i}"]`); if (el) el.textContent = pctHu(erOf(x));
  }
});
document.addEventListener('change', e => { if (e.target.id === 'utmp' && S.utm) { applyPreset(e.target.value); render(); } });

/* ---------------- események ---------------- */
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('.tabs [data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.closest('#home')) { e.preventDefault(); S.tab = 'naptar'; render(); return; }
  const op = t.closest('[data-open]'); if (op) { if (op.dataset.pf) S.pf = op.dataset.pf; openItem(op.dataset.open); return; }
  const idea = t.closest('[data-idea]'); if (idea) { S.tab = 'otletek'; render(); setTimeout(() => { const el = $(`[data-want="${idea.dataset.idea}"]`); el && el.closest('.icard').scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 30); return; }
  if (t.closest('[data-close]')) { closeItem(); return; }
  const fk = t.closest('[data-fk]'); if (fk) { S.fk = fk.dataset.fk; render(); return; }
  const fp = t.closest('[data-fp]'); if (fp) { S.fp = fp.dataset.fp; render(); return; }
  if (t.closest('#csv')) { csv(); return; }
  const ct = t.closest('[data-copytext]'); if (ct) { copyText(ct.dataset.copytext); return; }
  const sdl = t.closest('[data-sudl]'); if (sdl) { const [iid, k] = sdl.dataset.sudl.split(':'); const it = BY[iid]; if (it && it.files[+k]) download(it.files[+k]); return; }
  const snv = t.closest('[data-sunav]'); if (snv) { e.preventDefault(); const el = document.getElementById('su-' + snv.dataset.sunav); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const em = t.closest('[data-email]'); if (em) { openEmail(em.dataset.email); return; }
  const efb = t.closest('[data-ef]'); if (efb) { S.ef = efb.dataset.ef; render(); return; }
  const ctr = t.closest('[data-contact]'); if (ctr) { openContact(ctr.dataset.contact); return; }
  const ccb = t.closest('[data-cc]'); if (ccb) { S.cc = ccb.dataset.cc; S.cn = 60; render(); return; }
  if (t.closest('[data-cmore]')) { S.cn += 100; refreshContacts(); return; }
  if (t.closest('[data-cnew]')) { openNewContact(); return; }
  if (t.closest('[data-ccsv]')) { contactsCsv(); return; }
  const pvb = t.closest('[data-pv]'); if (pvb && S.eopen) { S.pv = pvb.dataset.pv; renderPreview(); return; }
  const apb = t.closest('[data-eapprove]'); if (apb && S.eopen && !S.ro) {
    const d = eDoc(S.eopen); d.approved = apb.dataset.eapprove === '1';
    d.approvedAt = d.approved ? new Date().toISOString().slice(0, 16).replace('T', ' ') : '';
    persist('emails', S.eopen); renderEmailSide(); toast(d.approved ? 'Jóváhagyva ✓' : 'Jóváhagyás visszavonva'); return;
  }
  const csb = t.closest('[data-cset]'); if (csb && S.copen && S.copen !== '__new' && !S.ro) {
    const d = cDoc(S.copen); d.status = csb.dataset.cset; d.updated = TODAY;
    if (d.status === 'megkeresve' && !d.sent) d.sent = TODAY;
    persist('contacts', S.copen); openContact(S.copen, true); toast('Állapot: ' + (CS()[d.status] || d.status)); return;
  }
  const it = S.open && BY[S.open];
  if (!it) return;
  const pft = t.closest('[data-pft]'); if (pft) { S.pf = pft.dataset.pft; openItem(it.id, true); return; }
  const dl = t.closest('[data-dl]'); if (dl) { download(it.files[+dl.dataset.dl]); return; }
  const cp = t.closest('[data-copy]'); if (cp) { const c = copyOf(it, S.pf); copyText(cp.dataset.copy === 'all' && c.tags ? `${c.text}\n\n${c.tags}` : c.text); return; }
  const stb = t.closest('[data-status]'); if (stb && !S.ro) { E(it.id).status = stb.dataset.status; persist('edits', it.id); openItem(it.id, true); return; }
  if (t.closest('[data-reset]')) { const ed = E(it.id); if (ed.copy) { delete ed.copy[S.pf]; persist('edits', it.id); } openItem(it.id, true); return; }
  if (t.closest('[data-ai]')) { aiVariants(it); return; }
  const use = t.closest('[data-use]'); if (use) { const v = ($('#ai') || {})._vs?.[+use.dataset.use]; if (v) { const ed = E(it.id); ed.copy = ed.copy || {}; ed.copy[S.pf] = { text: v.text, tags: v.tags || copyOf(it, S.pf).tags }; persist('edits', it.id); openItem(it.id, true); toast('Átvéve – elmentve ✓'); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.icom) { (S.ideas[t.dataset.icom] = S.ideas[t.dataset.icom] || {}).comment = t.value; persist('ideas', t.dataset.icom); return; }
  if (t.id === 'cq') { S.cq = t.value; S.cn = 60; refreshContacts(); return; }
  if (t.dataset.ecom && !S.ro) { eDoc(t.dataset.ecom).comment = t.value; persist('emails', t.dataset.ecom); return; }
  if (t.dataset.cnote && !S.ro) { const d = cDoc(t.dataset.cnote); d.note = t.value; d.updated = TODAY; persist('contacts', t.dataset.cnote); return; }
  const it = S.open && BY[S.open]; if (!it || S.ro) return;
  if (t.dataset.f) {
    const ed = E(it.id); ed.copy = ed.copy || {};
    const cur = copyOf(it, S.pf);
    ed.copy[S.pf] = { ...cur, [t.dataset.f]: t.value };
    persist('edits', it.id);
    const c = copyOf(it, S.pf), full = c.text + (c.tags ? '\n\n' + c.tags : ''), lim = PF[S.pf].limit;
    const n = (c.tags.match(/#[^\s#]+/g) || []).length, el = $('#cnt');
    if (el) { el.textContent = `${full.length} / ${lim} karakter${S.pf === 'instagram' ? ` · ${n} hashtag` : ''}`; el.classList.toggle('over', full.length > lim); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'cs' || t.id === 'ck') { S[t.id] = t.value; S.cn = 60; refreshContacts(); return; }
  if (t.id === 'cp') { S.cp = t.checked; S.cn = 60; refreshContacts(); return; }
  if (t.dataset.su && !S.ro) {
    const [pid, i] = t.dataset.su.split(':'); const d = (S.setup[pid] = S.setup[pid] || {}); d.done = d.done || {};
    if (t.checked) d.done[i] = true; else delete d.done[i];

  if (t.dataset.esubj != null && S.eopen && !S.ro) {

  const it = S.open && BY[S.open]; if (!it || S.ro || t.dataset.si == null) return;
  const ed = E(it.id); ed.slots = ed.slots || {};
  const i = +t.dataset.si; ed.slots[i] = ed.slots[i] || {};
  ed.slots[i][t.dataset.sf] = t.type === 'checkbox' ? t.checked : t.value;
  persist('edits', it.id);

});
document.addEventListener('keydown', e => {

document.addEventListener('submit', e => {
  if (e.target.id !== 'cform') return;

});
