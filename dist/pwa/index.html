 adored little spaniels. Gentle, friendly and exceptionally people-oriented, it gets on well with children, older people and other dogs, but is no good at all as a watchdog. A flexible companion that is equally happy on the sofa or on a longer walk. You should know, though, that mitral valve disease (MVD) and syringomyelia are very common in the breed, so choose only from parents that have been heart-screened and MRI-screened.","mozgas":"A 45–60-minute walk daily, with some off-lead running","erdekesseg":"The modern Cavalier was reborn in the 1920s, when an American, Roswell Eldridge, offered prize money at the Crufts show for breeding back the longer-nosed spaniels known from old paintings.","kinekIgen":["Beginner owners and families with children","Older people, calm city homes","People who want a constant, cuddly companion"],"kinekNem":["Those looking for a watchdog","Owners who leave the dog alone for long hours","Anyone who can’t set money aside for heart screening and treatment"],"egeszseg":["Mitral valve disease (MVD) – heart-screened parents!","Syringomyelia (SM) – MRI-screened parents!","Patellar luxation","Eye diseases (e.g. cataracts)"],"orszag":"United Kingdom"},"shih-tzu":{"nev":"Shih Tzu","tagline":"Chrysanthemum-faced little lion – born for a palace.","leiras":"The Shih Tzu comes from Tibet and the Chinese imperial court, where it was pampered as a palace dog for centuries. A friendly, even-tempered and cheerful companion that would rather choose your lap than a long hike, and a good choice for a first-time owner. Its long coat sheds little but needs daily brushing or regular clipping. Because of its short muzzle, breathing difficulties (brachycephalic syndrome) can occur and it copes poorly with heat, so choose from health-screened parents.","mozgas":"30–45 minutes of gentle walking and play daily","erdekesseg":"Its name means “lion” in Chinese, and because the hair around its face fans out in a circle, it is also nicknamed the “chrysanthemum-faced dog”.","kinekIgen":["Beginner owners, flats","Older people and calm families","People who enjoy coat grooming"],"kinekNem":["Active, sporty lifestyles","Anyone unwilling to spend time or money on grooming","Hot homes without air conditioning"],"egeszseg":["Brachycephalic syndrome (breathing difficulties)","Eye problems (prominent eyes, corneal injury)","Patellar luxation","Dental problems"],"orszag":"Tibet / China"},"maltai-selyemkutya":{"nev":"Maltese","tagline":"Snow-white silk and boundless devotion.","leiras":"The Maltese is a lapdog of the Mediterranean region with a history stretching back thousands of years. Lively, playful and very affectionate, it is brave despite its tiny size, feels happiest close to its owner, and alertly raises a loud alarm when the doorbell rings. Its snow-white, silky coat sheds little but needs daily brushing and regular eye cleaning. Tiny and fragile, it does not cope well with rough play from small children, and it does not like being left alone for long.","mozgas":"30–45 minutes of walking daily and lots of play","erdekesseg":"One of the oldest European lapdog breeds: similar little white dogs were already kept and depicted by the ancient Greeks and Romans.","kinekIgen":["Beginner owners, small flats","Older people and adult-only households","People looking for a low-shedding companion"],"kinekNem":["Busy families with young children","Anyone who is away from home a lot","Anyone who doesn’t want to comb daily"],"egeszseg":["Patellar luxation","Dental problems","Watery eyes, tear duct problems","Portosystemic shunt (liver shunt)"],"orszag":"Mediterranean region"},"bichon-frise":{"nev":"Bichon Frisé","tagline":"A cheerful cotton-wool puff that hardly sheds.","leiras":"The Bichon Frisé descends from Mediterranean lapdogs and was a favourite at the French royal court in the Renaissance. Cheerful, gentle and sociable: it gets on well with children, strangers and other animals too, so it is a good choice for a first-time owner. Its curly coat sheds little but needs regular brushing and a groomer every 4–6 weeks, otherwise it mats. It finds being left alone for long hard to bear, and house-training can take more patience.","mozgas":"30–60 minutes of walking and play a day","erdekesseg":"In the 19th century it went from the palaces to the streets and became a star of fairground performers and circuses, because it learns tricks easily.","kinekIgen":["Beginner owners and families with children","People looking for a low-shedding dog","City flats, lots of time spent at home"],"kinekNem":["Anyone who is away from home all day","Anyone unwilling to pay for a regular groomer"],"egeszseg":["Allergies, skin problems","Patellar luxation","Bladder stones","Cataracts"],"orszag":"France / Belgium"},"havanese":{"nev":"Havanese","tagline":"A friendly little companion with a Cuban dancer’s soul.","leiras":"The Havanese (Havana Bichon) is the national dog of Cuba, descended from the bichons that arrived with Spanish sailors. Cheerful, playful and extremely sociable: it loves being the centre of attention, gets on well with children too, and enjoys learning tricks. Its long, silky coat sheds little but must be brushed several times a week, or kept clipped short. It bonds very closely with its person, so it belongs in a home where it is rarely left alone.","mozgas":"30–60 minutes of walking and playing together daily","erdekesseg":"After the Cuban Revolution the breed all but vanished in its homeland, and it was revived from a few dogs that had reached the United States with their owners.","kinekIgen":["Beginner owners and families with children","City flats, older people too","People who enjoy teaching tricks"],"kinekNem":["Anyone who is away from home a lot","Anyone who doesn’t want to comb regularly"],"egeszseg":["Patellar luxation","Eye problems (cataracts, PRA)","Legg–Calvé–Perthes disease (femoral head necrosis)"],"orszag":"Cuba"},"uszkar":{"nev":"Poodle","tagline":"A curly genius in four sizes – elegant, sporty, doesn’t shed.","leiras":"The Poodle was originally a water-retrieving gundog and today lives with us in four sizes – toy, miniature, medium and standard. Extremely clever, quick to learn, sensitive and affectionate, it is a real genius at dog sports and at learning tricks. Its curly coat sheds little but needs clipping every 4–8 weeks and regular brushing. Without mental work and enough exercise it gets bored, and the larger sizes need more running than their elegant looks suggest.","mozgas":"Depending on size, 45 minutes to 2 hours daily, with plenty of brain teasers","erdekesseg":"Its name comes from the German “pudeln” (to splash about), and the classic pom-pom clip was originally practical: it protected the joints and chest of a dog working in the water from the cold.","kinekIgen":["Beginner and experienced owners alike","People looking for a low-shedding dog","Those who enjoy dog sports and learning tricks"],"kinekNem":["Anyone unwilling to pay for a regular groomer","Anyone who sees it as a decoration, with no activities"],"egeszseg":["Progressive retinal atrophy (PRA)","Patellar luxation (toy and miniature)","Hip dysplasia, gastric dilatation-volvulus (standard size)","Addison’s disease, sebaceous adenitis (standard size)"],"orszag":"France"},"boston-terrier":{"nev":"Boston Terrier","tagline":"A little gentleman in a tuxedo, a cheerful city companion.","leiras":"The Boston Terrier was born in Boston in the late 19th century from English Bulldog and terrier ancestors. Cheerful, friendly and playful, it gets on well with children and is relatively easy to train. It barks little, is adaptable, and is content even in a small flat if it gets enough attention. Because of its short muzzle, however, breathing difficulties (brachycephalic syndrome) can occur, it tolerates heat poorly, and its large eyes are vulnerable – choose only from health-screened parents.","mozgas":"A 45–60-minute walk and play daily, less in hot weather","erdekesseg":"Because of its tuxedo-like markings and charming manners, it is nicknamed the “American Gentleman”, and it is the official dog of the state of Massachusetts.","kinekIgen":["Beginner owners, city flats","Families with children","People looking for a cheerful but not noisy companion"],"kinekNem":["Those looking for a running partner or hiking dog","Hot homes without air conditioning"],"egeszseg":["Brachycephalic syndrome (breathing difficulties)","Eye injuries, corneal ulcers","Cataracts","Patellar luxation"],"orszag":"USA"},"whippet":{"nev":"Whippet","tagline":"A lightning-fast sprinter outdoors, a sofa statue at home.","leiras":"The Whippet is an English sighthound breed that, despite its medium size, is among the fastest dogs. At home it is quiet, gentle, kind with children and thoroughly cuddly: it happily snoozes on the sofa and rarely barks. Outdoors, though, it is a lightning-fast sprinter that needs regular off-lead runs in a safe, fenced area. Its strong hunting instinct means it may chase cats and rabbits, its recall is not always reliable, and its thin coat means it needs a coat of its own in winter.","mozgas":"About 1 hour of walking daily, including safe sprints","erdekesseg":"In the 19th century, the miners of northern England called it the “poor man’s racehorse”, because in their spare time they raced it and hunted rabbits with it.","kinekIgen":["Those who enjoy a calm home and active walks","City flats too, if it has somewhere to run","Those looking for a quiet, cuddly companion"],"kinekNem":["Households with small pets (judge case by case)","Outdoor living in the cold","Anyone who would walk it off the lead everywhere"],"egeszseg":["Skin injuries, tears (thin skin)","Sensitivity to certain anaesthetics","Heart valve disease (in later life)"],"orszag":"United Kingdom"},"magyar-agar":{"nev":"Hungarian Greyhound","tagline":"A tireless Hungarian whirlwind – and a great sleeper after a sprint.","leiras":"The Hungarian Greyhound is an ancient Hungarian hunting dog, used for centuries for hare and fox hunting in the Carpathian Basin. At home it is calm, quiet and affectionate, loyal to its family, and reserved and alert with strangers. Outdoors it is a tireless runner that keeps up the pace not only in sprints but over long distances too, so it needs regular gallops in a safe, fenced area. Its short coat needs hardly any grooming, but its strong hunting instinct means it may chase small animals, and its recall is not always reliable.","mozgas":"1.5–2 hours daily, including safe off-lead running","erdekesseg":"According to tradition, its ancestors arrived in the Carpathian Basin with the conquering Magyars, so it is regarded as one of the oldest Hungarian dog breeds.","kinekIgen":["Runners, cyclists and active owners","Those looking for a quiet dog that barks little","Lovers of Hungarian breeds"],"kinekNem":["Households with cats or small pets","Anyone who would let it off the lead everywhere","Sedentary lifestyles"],"egeszseg":["Sensitivity to certain anaesthetics (typical of sighthounds)","Muscle and skin injuries while running","Gastric dilatation-volvulus (bloat, due to deep chest)"],"orszag":"Hungary","alias":["Magyar Agár","Hungarian Sighthound"]},"olasz-agar":{"nev":"Italian Greyhound","tagline":"A porcelain-fine mini sighthound, elegant even in a jumper.","leiras":"The Italian Greyhound is the smallest sighthound breed and became a true fashion dog at the Italian courts of the Renaissance. Gentle, sensitive and very cuddly, it seeks its owner’s closeness and is not a big barker. With its thin coat and little body fat it feels the cold, needs a jumper in winter, and dislikes cold, rainy weather. Because of its fragile leg bones, big jumps can be dangerous, and house-training takes patience.","mozgas":"A 45–60-minute walk, with the occasional safe sprint","erdekesseg":"King Frederick the Great of Prussia loved his Italian Greyhounds so much that, as he had wished, he was finally buried on the terrace of Sanssouci Palace, next to his dogs.","kinekIgen":["City flats, calm homes","Adult-only households and older people","People looking for a cuddly, elegant little companion"],"kinekNem":["Busy families with young children","Outdoor living or cold homes","Anyone counting on quick house-training"],"egeszseg":["Leg fractures (especially when young)","Dental problems (tartar, gingivitis)","Patellar luxation","Sensitivity to certain anaesthetics"],"orszag":"Italy","alias":["Italian Sighthound","Iggy"]},"tervueren":{"nev":"Belgian Tervuren","tagline":"The Belgian Malinois’s long-haired, elegant sibling – same engine.","leiras":"The Belgian Tervuren developed in Belgium in the late 19th century and is named after the village of Tervuren near Brussels. An extremely attentive, intelligent and hard-working dog that bonds closely with its owner, is initially reserved with strangers and keeps a watchful eye on its surroundings. It learns quickly and excels at dog sports, but it is sensitive and handles harsh treatment badly. Without a daily task and plenty of exercise it easily becomes tense and wound up, and its long coat needs regular brushing and sheds heavily.","mozgas":"2 hours a day, with plenty of mental challenges","erdekesseg":"The FCI registers the four varieties of the Belgian Shepherd Dog – Malinois, Tervuren, Groenendael and Laekenois – as a single breed: they differ only in the length, texture and colour of their coat.","kinekIgen":["Active owners who do dog sports","People who enjoy training and working with their dog","Active families living in a house with a garden"],"kinekNem":["First-time dog owners with no preparation","Small flats with little exercise","Owners who leave the dog alone for many hours a day"],"egeszseg":["Epilepsy","Hip and elbow dysplasia","Eye diseases (e.g. PRA, cataracts)"],"orszag":"Belgium","alias":["Belgian Tervueren","Tervuren","Tervueren"]},"groenendael":{"nev":"Belgian Groenendael","tagline":"A black, silky-coated athlete with a sharp mind and even sharper focus.","leiras":"The Belgian Groenendael is the black, long-haired variety of the Belgian Shepherd Dog, developed in the late 19th century around Brussels. Sharp-witted, extremely attentive and hard-working, it bonds closely with its family, is reserved with strangers and is a reliable watchdog. It learns quickly and excels at agility, obedience and tracking, but it is sensitive, so positive reinforcement suits it better than a heavy hand. Without a job it soon becomes tense and nervy, and its thick black coat sheds heavily.","mozgas":"2 hours daily, with running and working together","erdekesseg":"It is named after the Groenendael château near Brussels, where its owner, Nicolas Rose, began deliberately breeding black, long-haired shepherd dogs in the late 19th century.","kinekIgen":["More experienced, active owners","Agility and dog sports fans","People who devote plenty of time to their dog every day"],"kinekNem":["Calm, stay-at-home lifestyles","Small flats with no garden","People who struggle with shedding"],"egeszseg":["Epilepsy","Hip and elbow dysplasia","Eye diseases (e.g. PRA, cataracts)","Hypothyroidism"],"orszag":"Belgium","alias":["Belgian Sheepdog"]},"collie":{"nev":"Rough Collie","tagline":"Lassie’s breed: gentle, clever, and shepherd to a whole family.","leiras":"The Rough Collie developed from the sheepdogs of the Scottish Highlands, and Queen Victoria’s fondness for it made it truly fashionable in the 19th century. A gentle, sensitive and very affectionate breed, patient with children and easy and willing to learn, so a good choice for a first-time owner. It is rather reserved with strangers, but not hostile. Be prepared for it to bark readily and a lot, and for its thick coat to need regular, thorough brushing – it sheds an enormous amount when moulting.","mozgas":"A 1–1.5-hour walk daily, with play and learning","erdekesseg":"Screen Lassie is a female dog, yet she was first played by a male collie called Pal, and his descendants carried on the role for generations.","kinekIgen":["Families with children","First-time dog owners who enjoy training","People who don’t mind regular brushing"],"kinekNem":["Neighbours sensitive to barking","People who struggle with shedding","Owners who leave the dog alone all day"],"egeszseg":["Collie eye anomaly (CEA)","MDR1 gene mutation (drug sensitivity)","Progressive retinal atrophy (PRA)"],"orszag":"United Kingdom"},"bearded-collie":{"nev":"Bearded Collie","tagline":"A cheerful, bearded clown whose coat is a hobby all of its own.","leiras":"The Bearded Collie herded sheep and cattle on the Scottish upland pastures, and its shaggy coat stood up well to rain and cold. A cheerful, bouncy, friendly dog that adores every member of the family and gets on brilliantly with children. Clever and quick to learn, but with opinions of its own, so patient, playful training suits it, and it likes to make itself heard. Its long, thick coat is a serious commitment: without thorough brushing several times a week it soon mats.","mozgas":"1.5–2 hours daily, with plenty of off-lead running and play","erdekesseg":"Puppies are typically born with darker colouring; the coat lightens by adolescence and then often takes on a darker shade again in adulthood.","kinekIgen":["Active, playful families with children","People who enjoy coat grooming","Those who enjoy dog sports and hiking"],"kinekNem":["Anyone with no time for regular brushing","Sedentary, stay-at-home lifestyles","Neighbours sensitive to barking"],"egeszseg":["Hip dysplasia","Hypothyroidism","Addison’s disease (adrenal insufficiency)"],"orszag":"United Kingdom"},"bobtail":{"nev":"Old English Sheepdog","tagline":"A teddy-bear cloud in a grey-and-white coat, with endless good cheer.","leiras":"In England the Old English Sheepdog helped farmers drive cattle and sheep to market; today it is above all a lovable family companion. Cheerful, gentle and patient, it gets on especially well with children and is often a real clown. Trainable, but it sometimes goes its own way, so cheerful, consistent training suits it. Its shaggy coat is the biggest commitment: it needs several hours of brushing a week or a regular professional groomer, it sheds heavily, and it handles heat badly.","mozgas":"A 1–1.5-hour walk and play daily, going easy in a heatwave","erdekesseg":"The Beatles’ song “Martha My Dear” takes its title from Paul McCartney’s Old English Sheepdog, Martha.","kinekIgen":["Cheerful families with children","People committed to coat grooming","Those living in a house with a garden"],"kinekNem":["Anyone with no time or money for coat grooming","Hot homes without air conditioning","People who struggle with shedding"],"egeszseg":["Hip dysplasia","Eye diseases (e.g. cataracts, PRA)","Hypothyroidism","MDR1 gene mutation (drug sensitivity)"],"orszag":"United Kingdom","alias":["OES"]},"feher-svajci-juhaszkutya":{"nev":"White Swiss Shepherd Dog","tagline":"A snow-white shepherd, the gentler-natured cousin of the German Shepherd.","leiras":"The White Swiss Shepherd Dog descends from white German Shepherds and was recognised as a breed in its own right in Switzerland. Gentle, friendly and very quick to learn, it bonds closely with its family, is patient with children and is reserved rather than suspicious with strangers. Sensitive by nature, it responds best to kind, consistent training and also takes part happily in dog sports. Its snow-white, thick coat sheds heavily all year round and, when moulting, covers practically everything.","mozgas":"1.5 hours of exercise daily, with play and learning","erdekesseg":"Because in the first half of the 20th century white was a disqualifying fault in the German Shepherd in Germany, the white lines survived mainly in the USA and Canada, and from there they found their way back to Europe.","kinekIgen":["Active families with children","People looking for a gentler sheepdog","Those who enjoy dog sports and hiking"],"kinekNem":["Households sensitive to shedding","Small flats with little exercise","Days with long hours alone"],"egeszseg":["Hip and elbow dysplasia","MDR1 gene mutation (drug sensitivity)","Degenerative myelopathy"],"orszag":"Switzerland","alias":["Berger Blanc Suisse"]},"csehszlovak-farkaskutya":{"nev":"Czechoslovakian Wolfdog","tagline":"Looks like a wolf and sometimes thinks like one: for professionals only.","leiras":"It was created in Czechoslovakia in the 1950s by crossing German Shepherds with Carpathian wolves, originally for border patrol duty. It is very attached to its owner and family, handles being left alone badly, is suspicious of strangers and has a strong hunting instinct. Clever but independent-minded: it learns the classic obedience exercises only through patient, consistent work. It rarely barks, preferring to howl, and is a skilled escape artist, so it is recommended only for an experienced owner who can devote plenty of time to it.","mozgas":"2+ hours daily, with running, hiking and tasks","erdekesseg":"The mother of the first wolf–dog litter was a Carpathian she-wolf named Brita, and the father was a German Shepherd named Cézar.","kinekIgen":["Very experienced, patient dog owners","Hikers, runners and country lifestyles","People who are at home almost all day"],"kinekNem":["First-time dog owners","City flats","Households with young children or small pets"],"egeszseg":["Hip dysplasia (screened parents!)","Pituitary dwarfism (DNA test available)","Degenerative myelopathy"],"orszag":"Czech Republic / Slovakia","alias":["Czechoslovakian Vlcak","Vlcak"]},"ausztral-pasztorkutya":{"nev":"Australian Cattle Dog","tagline":"A tough, tenacious herder who never asks when we’re going home.","leiras":"The Australian Cattle Dog developed in 19th-century Australia: the drovers’ cattle dogs were crossed with dingoes, among others, so that they could cope with the heat and long journeys. A tough, tenacious and extremely hard-working herder that bonds especially with one or two people and is reserved and alert with strangers. Clever and quick to learn, but independent, so it needs consistent training and a regular job. From herding instinct it tends to nip at heels, which can be unpleasant around small children.","mozgas":"2 hours of intense exercise daily and a regular job","erdekesseg":"For a long time the Guinness World Records listed an Australian Cattle Dog named Bluey as the oldest dog ever: it lived for more than 29 years.","kinekIgen":["Very active, experienced owners","Those living on a farm or in a large house with a garden","Runners, hikers and dog sports enthusiasts"],"kinekNem":["First-time dog owners","Flats and sedentary lifestyles","Families with young children"],"egeszseg":["Congenital deafness (BAER hearing test)","Progressive retinal atrophy (PRA)","Hip dysplasia","Primary lens luxation (PLL)"],"orszag":"Australia","alias":["Blue Heeler","Red Heeler"]},"torpe-pinscher":{"nev":"Miniature Pinscher","tagline":"Mini Dobermann, maxi self-confidence.","leiras":"The Miniature Pinscher is an old German breed that originally worked as a ratter in stables and farmyards. A lively, brave and curious little dog, a true watchdog that reacts to every little sound with loud barking. Clever, but prone to stubbornness and escaping, so it needs consistent training and a secure fence. Less recommended for families with small children, as it is fragile and does not tolerate rough handling; with its short coat it gets cold easily in winter.","mozgas":"A 45–60-minute walk and lively play daily","erdekesseg":"Although many people think it is a mini Dobermann, it is in fact the older breed: it existed in Germany even before the Dobermann was bred.","kinekIgen":["Active owners living in a city flat","Adult households or families with older children","People looking for an alert, plucky little companion"],"kinekNem":["Families with young children","Neighbours sensitive to barking","Outdoor living in cold weather"],"egeszseg":["Patellar luxation","Legg–Calvé–Perthes disease (femoral head necrosis)","Eye diseases (e.g. PRA)"],"orszag":"Germany"},"orias-schnauzer":{"nev":"Giant Schnauzer","tagline":"A bearded bodyguard in XXL: clever, strong, tireless.","leiras":"The Giant Schnauzer developed in Bavaria, in southern Germany, as a cattle-driving and farmyard guard dog and later became known as a police and service dog. Clever, strong, extremely energetic and decidedly protective, it is loyal to its family and reserved with strangers. Quick to learn but capable of being dominant, so it needs an experienced, consistent owner and lots of shared work. Its wiry coat hardly sheds but needs regular trimming or clipping, and it is worth keeping its beard clean after meals too.","mozgas":"2 hours of exercise daily, with lots of working together","erdekesseg":"The name schnauzer comes from the German word “Schnauze” (muzzle, snout) and refers to the breed’s distinctive, bearded muzzle.","kinekIgen":["Very experienced, active owners","Those who enjoy dog sports or protection work","Active families living in a house with a garden"],"kinekNem":["First-time dog owners","Flats and sedentary lifestyles","Anyone with no time for regular coat grooming"],"egeszseg":["Hip dysplasia","Hypothyroidism","Gastric dilatation-volvulus (bloat)","Toe tumours (squamous cell carcinoma)"],"orszag":"Germany"},"hovawart":{"nev":"Hovawart","tagline":"The “guardian of the farmstead”: loyal, self-assured, family-centred.","leiras":"The Hovawart was re-bred in the 1920s from old-type farm dogs, modelled on the medieval German farmyard guard dogs. Self-assured, loyal and family-centred: at home it is a sweet, playful companion, yet it guards the house and its family firmly. A slow-maturing breed with a mind of its own, so it needs patient, consistent training and early socialisation. Because of its strong guarding instinct it is recommended more for experienced owners and is happiest in a house with a garden.","mozgas":"1.5–2 hours of walking, running and working together daily","erdekesseg":"Its name comes from the Middle High German “hova” (yard, farm) and “wart” (guard), so it literally means “farmyard guardian”.","kinekIgen":["More experienced, consistent owners","Families living in a house with a garden","People looking for a loyal watchdog and companion"],"kinekNem":["First-time dog owners with no preparation","Flats and life without a garden","Busy households with lots of visitors"],"egeszseg":["Hip dysplasia (screened parents!)","Hypothyroidism","Degenerative myelopathy"],"orszag":"Germany"},"leonbergi":{"nev":"Leonberger","tagline":"A lion-maned gentle giant – the children’s favourite cushion.","leiras":"The Leonberger was born in the 19th century in the German town of Leonberg, traditionally bred using the Newfoundland, the Saint Bernard and the Pyrenean Mountain Dog. A calm, friendly and patient giant, especially gentle with children and always wanting to be close to its family. Quick to learn and happy to swim, but because of its size, good lead manners and basic obedience matter from puppyhood. Be prepared for very heavy shedding, drooling, high running costs and a shorter life expectancy of 8–10 years.","mozgas":"A 1–1.5-hour gentle walk daily, going easy during puppyhood","erdekesseg":"According to tradition, its breeder, Heinrich Essig, wanted a dog that resembled the lion on the coat of arms of the town of Leonberg.","kinekIgen":["Calm families with children","Those living in a large house with a garden","People who love water and hiking"],"kinekNem":["Anyone bothered by lots of hair and drool","Small flats with no garden","Tight dog budgets"],"egeszseg":["Hip and elbow dysplasia","Leonberger polyneuropathy (DNA test available)","Gastric dilatation-volvulus (bloat)","Bone cancer (osteosarcoma)"],"orszag":"Germany"},"pireneusi-hegyi-kutya":{"nev":"Pyrenean Mountain Dog","tagline":"A white mountain giant who is on duty at night too – loudly.","leiras":"For centuries the Pyrenean Mountain Dog protected the flocks of Pyrenean shepherds from wolves and bears, and later became fashionable at the French royal court too. It is calm, gentle and patient with its family, but a decisive guardian towards strangers and unfamiliar animals. Bred to make independent decisions, it is not known for blind obedience and finds recall hard to learn. Be prepared for a lot of barking, mainly at night, and for its thick white coat to shed heavily.","mozgas":"1 hour of gentle walking daily, plus free movement around the property","erdekesseg":"It has double dewclaws (two extra toes) on its hind legs, which the breed standard specifically requires.","kinekIgen":["Experienced owners used to large dogs","Those living on a farm with a large fenced plot","People looking for a livestock or property guardian"],"kinekNem":["First-time dog owners","City flats with close neighbours","People who struggle with shedding"],"egeszseg":["Hip dysplasia","Gastric dilatation-volvulus (bloat)","Bone cancer (osteosarcoma)"],"orszag":"France","alias":["Great Pyrenees","Pyrenean"]},"bordeaux-i-dog":{"nev":"Dogue de Bordeaux","tagline":"A wrinkle-browed French nobleman with an enormous head and heart.","leiras":"The Dogue de Bordeaux is one of the oldest French breeds, which for centuries guarded estates and assisted on big-game hunts. Calm, affectionate and very attached to its family, it is reserved with strangers, and because of its stubbornness it needs early socialisation and consistent training. It is important to know that its life expectancy is just 6–8 years, and because of its short muzzle it tolerates heat and exertion badly and gets out of breath easily. In some countries keeping the breed requires a permit, so look into the local rules.","mozgas":"2–3 gentle walks daily, in hot weather only when it is cool","erdekesseg":"In the film “Turner & Hooch” (1989), Tom Hanks’s drooling four-legged partner, Hooch, was a Dogue de Bordeaux.","kinekIgen":["Experienced, calm, confident owners","Calmer families living in a house with a garden","People willing to cover higher vet costs"],"kinekNem":["First-time dog owners","Hot homes without air conditioning","Anyone bothered by drooling"],"egeszseg":["Heart disease (e.g. aortic stenosis, cardiomyopathy)","Breathing difficulties, heat sensitivity (short nose)","Hip and elbow dysplasia","Gastric dilatation-volvulus (bloat)"],"orszag":"France","alias":["French Mastiff","Bordeaux Mastiff"]},"napolyi-masztiff":{"nev":"Neapolitan Mastiff","tagline":"An ancient guardian wrapped in wrinkles – slow, dignified and drooling.","leiras":"The Neapolitan Mastiff descends from the molossers of ancient Rome and for centuries guarded estates and farms in southern Italy. It is calm, dignified and deeply attached to its family, but suspicious of strangers, and it defends its home firmly. Because of its enormous strength and independence, it suits only a very experienced, consistent owner, and in some countries keeping one requires a permit. Expect heavy drooling, regular cleaning of the skin folds, and a dog that copes poorly with heat.","mozgas":"2–3 short, calm walks a day, taking it easy in warm weather","erdekesseg":"In the Harry Potter films, Hagrid’s dog Fang was played by Neapolitan Mastiffs.","kinekIgen":["Very experienced owners used to giant dogs","Spacious houses with a well-fenced garden","People looking for a calm, dignified guardian"],"kinekNem":["First-time dog owners","Anyone bothered by drool and wrinkle care","Sporty, hiking lifestyles"],"egeszseg":["Hip and elbow dysplasia","Eyelid problems (entropion, ectropion, cherry eye)","Skin fold dermatitis","Gastric dilatation-volvulus (bloat)"],"orszag":"Italy","alias":["Mastino"]},"bullmasztiff":{"nev":"Bullmastiff","tagline":"A silent gamekeeper’s dog: it doesn’t bark, it’s just there – and that’s enough.","leiras":"The Bullmastiff was bred in 19th-century England by crossing the Mastiff with the Bulldog, to quietly pin down poachers alongside gamekeepers. Calm, well balanced and very affectionate, it is usually patient with children and almost never barks needlessly. Reserved with strangers, it is a confident guard dog, so it needs early socialisation and consistent training; in some countries keeping one requires a permit. Because of its great strength, walking on the lead must be taught from puppyhood, and expect some drooling too.","mozgas":"1 hour of gentle walking a day, going easy in hot weather","erdekesseg":"In England it was once known as “the gamekeeper’s night dog”, because at night it patrolled the woods with the gamekeeper, on the trail of poachers.","kinekIgen":["Experienced, confident owners","Calm families living in a house with a garden","People looking for a quiet but alert guard dog"],"kinekNem":["First-time dog owners","Active owners looking for a running partner","Anyone bothered by drooling"],"egeszseg":["Hip and elbow dysplasia","Gastric dilatation-volvulus (bloat)","Lymphoma","Entropion (inward-turning eyelid)"],"orszag":"United Kingdom"},"shar-pei":{"nev":"Shar Pei","tagline":"A wrinkly little philosopher with a blue tongue and an independent spirit.","leiras":"In southern China it spent centuries guarding peasant farms and helping with hunting, and for a time it was also used for fighting. A calm, clean and dignified dog, it is loyally attached to its family, but reserved with strangers, and it takes its watchdog duties seriously. It barks little and is fine in a flat, but it is strong-willed, so it needs early socialisation and patient, consistent training. Because of its distinctive wrinkles and narrow ear canals, its skin, eyes and ears need regular attention.","mozgas":"About 1 hour of calm walking and play a day","erdekesseg":"By the 1970s it had become so rare that in 1978 the Guinness Book of Records listed it as the rarest dog breed in the world.","kinekIgen":["Experienced, consistent owners","Calm adult households, city flats too","Anyone looking for an independent, reserved companion"],"kinekNem":["First-time dog owners","Anyone who wants a dog that is friendly with everyone","Anyone who can’t afford higher vet bills"],"egeszseg":["Shar Pei fever and amyloidosis (kidney damage)","Entropion (inward-turning eyelid)","Skin fold dermatitis, skin infections","Ear infections (narrow ear canals)"],"orszag":"China","alias":["Chinese Shar-Pei"]},"kaukazusi-juhaszkutya":{"nev":"Caucasian Shepherd Dog","tagline":"A mountain guardian with a bear’s courage – definitely not the hospitable type.","leiras":"For centuries, in the Caucasus mountains and on the steppes of southern Russia, it protected flocks and farmsteads from wolves and bears. Extremely brave, independent and territorial: it is loyal to its family, but greets strangers with suspicion and gives warning with a deep, loud bark, especially at night. It is not an obedience dog but a guardian that makes its own decisions, so it needs a very experienced, confident owner, thorough socialisation and a spacious, well-fenced property. In some countries keeping one requires a permit or is restricted, so check your local rules.","mozgas":"About 1 hour of walking a day, plus a large fenced area","erdekesseg":"Within the FCI (Fédération Cynologique Internationale), Russia is the breed’s country of patronage, because its planned breeding and uniform standard took shape in the Soviet Union from the 1920s onwards.","kinekIgen":["Very experienced, confident dog owners","Those living on a large, well-fenced farmstead","Anyone looking for a serious, independent property guardian"],"kinekNem":["First-time dog owners","Cities, flats and close neighbours","Families with young children and lots of visitors"],"egeszseg":["Hip and elbow dysplasia","Gastric dilatation-volvulus (bloat)","Obesity (strains the joints)"],"orszag":"Caucasus","alias":["Caucasian Ovcharka"]},"kozep-azsiai-juhaszkutya":{"nev":"Central Asian Shepherd Dog","tagline":"The steppes’ ancient guardian: calm, independent, unshakeable.","leiras":"For centuries the pastoral peoples of Central Asia kept it to guard flocks, caravans and settlements, and its character was shaped by harsh steppe life. Calm, well balanced and confident, it defends its family and territory unshakeably, but is reserved with strangers. Very independent, it is not strong on unconditional obedience, so it suits only an experienced, level-headed and consistent owner, with early socialisation and a spacious, securely fenced property. In some countries keeping one requires a permit or is restricted, so check your local rules.","mozgas":"About 1 hour of walking a day, plus a large fenced garden","erdekesseg":"In Turkmenistan, where it is known as the Alabai, it is a national symbol: in 2020 a giant gilded statue of it was erected in the capital, Ashgabat, and it even has its own holiday.","kinekIgen":["Experienced, level-headed, confident owners","Those living on a large, fenced estate or farm","Anyone looking for a calm, independent guardian"],"kinekNem":["First-time dog owners","Flats or small houses with a garden","Families with young children and frequent guests"],"egeszseg":["Hip and elbow dysplasia","Gastric dilatation-volvulus (bloat)","Obesity (strains the joints)"],"orszag":"Central Asia","alias":["Alabai"]},"airedale-terrier":{"nev":"Airedale Terrier","tagline":"The king of terriers: big, brave and always up for a joke.","leiras":"It developed in the mid-19th century in the valley of the River Aire in northern England, where it was used to hunt otters and rats, and later proved itself as a police and military dog too. Of the classic terriers it is the largest: clever, brave and playful, often a real clown, attached to its family, and an alert watchdog. It needs plenty of exercise and mental tasks and, true to a terrier, it has ideas of its own, so it needs patient, consistent training. It sheds little, but its wiry coat has to be trimmed several times a year.","mozgas":"1.5–2 hours a day, with running, play and tasks","erdekesseg":"In the First World War the British Army used it as both a messenger and a guard dog, and it carried messages between the trenches.","kinekIgen":["Active, sporty families","Anyone looking for a playful, funny companion","Active owners living in a house with a garden"],"kinekNem":["Small flats with little exercise","Laid-back, stay-at-home lifestyles","Anyone unwilling to commit to regular trimming"],"egeszseg":["Hip dysplasia","Hypothyroidism","Skin allergies, dermatitis"],"orszag":"United Kingdom"},"welsh-terrier":{"nev":"Welsh Terrier","tagline":"Looks like a mini Airedale, but has a mind of its own: a cheerful Welsh rascal.","leiras":"One of Britain’s oldest terrier breeds, used on the hill farms of Wales to hunt fox, badger and otter. Cheerful, friendly and more even-tempered than many of its terrier relatives, but curious, energetic and happy to bark. It does well in a flat if it gets enough exercise and shared play, and it usually gets on well with children. It sheds little, but its wiry coat needs regular trimming, and because of its strong hunting instinct, take care around small pets and when it is off the lead.","mozgas":"1–1.5 hours of walking and active play a day","erdekesseg":"President John F. Kennedy’s family dog, Charlie, was a Welsh Terrier, and Charlie and Pushinka – a gift from Khrushchev and a puppy of the Soviet space dog Strelka – even had a litter together.","kinekIgen":["Active owners living in a flat","Playful families with older children","Anyone looking for a cheerful, hardy little companion"],"kinekNem":["If quiet matters","Homes with cats, rabbits or rodents","Anyone unwilling to commit to regular trimming"],"egeszseg":["Glaucoma","Primary lens luxation","Skin allergies"],"orszag":"United Kingdom"},"kerry-blue-terrier":{"nev":"Kerry Blue Terrier","tagline":"A blue-grey Irish rogue in velvety curls – though black as a puppy.","leiras":"In County Kerry in south-west Ireland it was the farmer’s all-rounder: it caught rats and otters, herded livestock and guarded the house. A lively, clever and affectionate dog, it is playful with its family, wary of strangers, and an excellent watchdog. It can be pushy with other dogs, so it needs early socialisation and a consistent, experienced hand. Its soft, wavy, blue-grey coat hardly sheds, but needs frequent brushing and clipping every few weeks.","mozgas":"1–1.5 hours of walking, play and a mental challenge a day","erdekesseg":"Michael Collins, the legendary figure of Ireland’s fight for independence, also kept a Kerry Blue Terrier and wanted to make the breed Ireland’s national dog.","kinekIgen":["Experienced, consistent owners","Anyone looking for a low-shedding dog","Active families who enjoy combing"],"kinekNem":["First-time dog owners","Multi-dog households with no preparation","Anyone unwilling to commit to regular clipping"],"egeszseg":["Eye problems (entropion, dry eye)","Cerebellar degeneration (rare, hereditary)","Skin cysts, hair follicle tumours"],"orszag":"Ireland"},"border-terrier":{"nev":"Border Terrier","tagline":"An otter-headed, modest little terrier – the most laid-back of the daredevils.","leiras":"Bred for fox hunting in the English–Scottish Border region: small enough to squeeze into a burrow, and long-legged enough to keep up with the hunters. Balanced, friendly and hardy, it is one of the easiest terriers to handle and gets on well with children too. Keen to learn and fine in a flat if it gets enough exercise, but because of its strong hunting instinct, stay alert around small pets and when it is off the lead. It loves to dig and explore, so the garden must be well fenced.","mozgas":"1–1.5 hours of walks, hiking and scent games a day","erdekesseg":"The breed standard still requires it to be able to “follow a horse”, that is, to keep up with hunters on horseback.","kinekIgen":["Active first-time dog owners","Families with children, flats too","Hikers and ramblers"],"kinekNem":["Homes with cats, rabbits or rodents","Poorly fenced gardens – it digs and escapes","Many hours alone every day"],"egeszseg":["Canine epileptoid cramping syndrome (CECS)","Epilepsy","Hypothyroidism"],"orszag":"United Kingdom"},"skot-terrier":{"nev":"Scottish Terrier","tagline":"A dignified little Scottish gentleman, with a moustache and opinions of his own.","leiras":"Bred in the Scottish Highlands to hunt foxes, badgers and rodents, it was formerly also known as the Aberdeen Terrier. A dignified, brave and independent little dog, it is loyally attached to its family, reserved with strangers, and an alert watchdog. It is stubborn and does not tolerate rough handling, so it needs patient, consistent, reward-based training. Its wiry coat needs regular trimming, and it tolerates the bustle of small children less well than many other family dogs.","mozgas":"About 1 hour of walking a day, with sniffing and play","erdekesseg":"US President Franklin D. Roosevelt’s inseparable companion, Fala, was a Scottish Terrier – his statue still stands next to his owner at the Roosevelt Memorial in Washington.","kinekIgen":["Calm adult households, flats too","Anyone who likes an independent, dignified dog","Anyone looking for an alert little watchdog"],"kinekNem":["Busy families with young children","Anyone expecting a biddable, obedient pupil","Anyone unwilling to commit to regular trimming"],"egeszseg":["Scottie cramp (movement disorder)","Von Willebrand disease (clotting disorder)","Bladder cancer (more common than average)","Craniomandibular osteopathy (CMO)"],"orszag":"United Kingdom","alias":["Scottie"]},"cairn-terrier":{"nev":"Cairn Terrier","tagline":"Toto’s breed from The Wizard of Oz: a shaggy, curious, brave little adventurer.","leiras":"In the Scottish Highlands and on the Isle of Skye it was kept to hunt foxes and rodents lurking among piles of stones (cairns), which is where its name comes from. A cheerful, curious, brave and friendly little dog, a real tough adventurer that gets on well with children too. Even a first-time owner can cope with it, and it does fine in a flat, but it likes to bark and, given the chance, digs enthusiastically. Its shaggy, wiry coat sheds little; occasional brushing and a few trimmings a year are enough.","mozgas":"About 1 hour of walking, play and sniffing a day","erdekesseg":"Toto in The Wizard of Oz (1939) was played by a female Cairn Terrier called Terry, who appeared in many other films too.","kinekIgen":["First-time dog owners","Families with children, flats too","Active older owners too"],"kinekNem":["If quiet matters","Homes with rabbits, rodents or other small pets","Anyone who treasures a well-kept lawn – it likes to dig"],"egeszseg":["Patellar luxation","Portosystemic shunt (liver blood vessel abnormality)","Ocular melanosis (secondary glaucoma)"],"orszag":"United Kingdom"},"bullterrier":{"nev":"Bull Terrier","tagline":"A gladiator with an egg-shaped head and a clown’s soul – loves to play.","leiras":"It developed in 19th-century England from Bulldog and terrier ancestors, and the breeder James Hinks made its distinctive egg-shaped head the breed’s trademark. Playful, funny and extremely affectionate, it wants to be near its owner almost all the time, but is rarely heard barking. Strong, energetic and stubborn, it needs consistent, patient training, plenty of shared exercise and early socialisation, especially around other dogs and small pets. In some countries keeping one requires a permit or is restricted, so check your local rules.","mozgas":"1–1.5 hours a day of walking, play and shared tasks","erdekesseg":"US General George S. Patton’s faithful companion in the Second World War was a Bull Terrier called Willie.","kinekIgen":["Experienced, consistent owners with a sense of humour","Active families with older children","Anyone who spends a lot of time with their dog"],"kinekNem":["First-time dog owners","Homes with cats or other small pets","Many hours alone every day"],"egeszseg":["Congenital deafness (mainly in white dogs)","Hereditary kidney diseases","Heart valve abnormalities","Skin allergies"],"orszag":"United Kingdom","alias":["English Bull Terrier"]},"drotszoru-foxterrier":{"nev":"Wire Fox Terrier","tagline":"The breed of Tintin’s Snowy: lively, daring, tireless.","leiras":"Bred in England for fox hunting: its job was to bolt a fox that had gone to ground, out in front of the pack. Lively, daring, curious and playful, with loads of energy and humour, but wilful and happy to bark. It needs plenty of exercise, play and consistent training, otherwise it works off its tension by digging, chewing or yapping. It sheds little, but its wiry coat needs regular trimming, and because of its hunting instinct, take care around small pets.","mozgas":"1.5–2 hours of active exercise a day, with plenty of play and tasks","erdekesseg":"At the Westminster Dog Show in New York it has won Best in Show more often than any other breed.","kinekIgen":["Active, sporty owners","Those who enjoy dog sports","Anyone who loves lively, funny dogs"],"kinekNem":["First-time dog owners longing for a quiet life","If quiet matters","Homes with cats, rabbits or rodents"],"egeszseg":["Primary lens luxation","Allergic dermatitis","Legg–Calvé–Perthes disease (femoral head necrosis)"],"orszag":"United Kingdom"},"parson-russell-terrier":{"nev":"Parson Russell Terrier","tagline":"The Jack Russell Terrier’s longer-legged, even sportier cousin.","leiras":"It descends from the fox-hunting terriers of John Russell, a Devon clergyman of the 19th century, and is now regarded as a breed separate from the shorter-legged Jack Russell Terrier: it got its longer legs for keeping up with hunters on horseback. A clever, brave, tenacious and astonishingly energetic little athlete that loves to work and play. If it doesn’t get enough exercise and tasks, it entertains itself by digging, barking and chewing. Its coat needs little grooming, but because of its strong hunting instinct, take care around small pets and when it is off the lead.","mozgas":"1.5–2 hours of active exercise a day, with running and tasks","erdekesseg":"The breed’s foundation bitch was a white-and-tan female called Trump, whom the Reverend Russell bought from a milkman while still an Oxford student.","kinekIgen":["Very active, sporty owners","Those interested in agility and flyball","Runners and ramblers"],"kinekNem":["First-time dog owners longing for a quiet life","Homes with cats, rabbits or rodents","Many hours alone every day"],"egeszseg":["Primary lens luxation","Congenital deafness","Cerebellar ataxia (DNA test available)","Patellar luxation"],"orszag":"United Kingdom","alias":["Parson"]},"bedlington-terrier":{"nev":"Bedlington Terrier","tagline":"A lion disguised as a lamb – soft curls, fast legs.","leiras":"In the 19th century it was kept for catching rats and rabbits in the mining district of Northumberland in northern England, around Bedlington. A real terrier lives behind its lamb-like looks: at home it is gentle, affectionate and calm, but outdoors it is a fast, tenacious and keen hunter. It does well in a flat and is usually kind with children, provided it gets its daily exercise. Its soft, curly coat sheds little, but needs regular brushing and clipping every few weeks.","mozgas":"About 1 hour of walking a day and, if possible, a free gallop in a fenced area","erdekesseg":"Puppies are born with dark coats, black or brown, and only lighten as they grow up to the characteristic pale bluish or sandy shade.","kinekIgen":["Active owners living in a flat","Anyone looking for a low-shedding dog","Calm families with children"],"kinekNem":["Anyone unwilling to commit to regular clipping","Homes with cats, rabbits or rodents","Anyone who would let it run free in unfenced places"],"egeszseg":["Copper storage liver disease (DNA test available)","Retinal dysplasia","Eyelash abnormalities (distichiasis)"],"orszag":"United Kingdom"},"ir-buzaszinu-terrier":{"nev":"Soft-Coated Wheaten Terrier","tagline":"A wheaten ball of silk with Irish cheer – and a legendary greeting.","leiras":"In Ireland it was long the all-rounder on small farms: it caught rats, herded livestock and guarded the yard. Cheerful, friendly and very people-oriented, it adores children and is famous for greeting arrivals with enthusiastic jumping, which is worth tackling from puppyhood. It is less suited to being a watchdog, because it makes friends with almost everyone, and training needs patience, since, true to a terrier, it can be wilful. Its silky coat sheds little but tangles easily, so it needs brushing almost daily.","mozgas":"1–1.5 hours of walking, play and running a day","erdekesseg":"Although it had long worked on Irish farms, the Irish Kennel Club only officially recognised it as a breed in its own right in 1937.","kinekIgen":["Sociable families with children","Anyone looking for a low-shedding dog","Anyone who enjoys combing and brushing"],"kinekNem":["Anyone who won’t make time for daily combing","Anyone who wants a restrained, quiet-natured dog","Anyone looking for a watchdog"],"egeszseg":["Protein-losing nephropathy (PLN)","Protein-losing enteropathy (PLE)","Renal dysplasia","Addison’s disease"],"orszag":"Ireland"},"ir-terrier":{"nev":"Irish Terrier","tagline":"A red daredevil – the Irish say it’s courage in canine form.","leiras":"One of the oldest Irish breeds: on farms it worked as a ratter, hunting dog and watchdog, and in the First World War it also proved itself as a messenger. Brave, daring and loyal, it is kind and playful with its family and children, wary of strangers, and an alert guard. It is prone to picking fights with other dogs, so it needs early socialisation and consistent training. Its red, wiry coat sheds little; weekly brushing and a few trimmings a year are enough.","mozgas":"1–1.5 hours of walking, running and play a day","erdekesseg":"The canine heroes of two Jack London novels, Jerry of the Islands and Michael, Brother of Jerry, are Irish Terriers too.","kinekIgen":["Active families, including those with children","Consistent owners who are ready to learn","Anyone looking for a brave, alert companion"],"kinekNem":["Multi-dog households with no preparation","Homes with cats, rabbits or rodents","Low-activity, stay-at-home owners"],"egeszseg":["Hereditary footpad hyperkeratosis (HFH, DNA test available)","Cystinuria (urinary stones)"],"orszag":"Ireland"},"nemet-vadaszterrier":{"nev":"German Hunting Terrier","tagline":"A professional hunter’s nature in a small body – not born for the sofa.","leiras":"Created by German hunters after the First World War with nothing but hunting performance in mind, it is still used today for going to ground after quarry, driving wild boar and water work. Extremely brave, tenacious and a passionate hunter, it is loyal to its owner, suspicious of strangers, and raises a loud alarm. A tough, energetic working dog that needs serious work every day, with a hunting instinct that overrides almost everything. It is not recommended as a family pet or alongside small children or small pets, and is only truly happy with a hunter as its owner.","mozgas":"2 hours or more a day, preferably with hunting work","erdekesseg":"The foundation of the breed was four black-and-tan terriers that zoo director Lutz Heck gave to one of the founders, Walter Zangenberg.","kinekIgen":["Active hunters","Very experienced, sporty dog owners","Those living in the country with a large garden"],"kinekNem":["First-time dog owners","Families with young children","Homes with cats or other small pets"],"egeszseg":["Primary lens luxation (DNA test available)","Injuries while hunting (bites, cuts)"],"orszag":"Germany"},"alaszkai-malamut":{"nev":"Alaskan Malamute","tagline":"A powerful sled dog that would rather “talk” than bark – and loves snow.","leiras":"The Alaskan Malamute is named after the Mahlemut Inuit of north-western Alaska, who kept them to haul heavy sleds and for hunting. Built not for speed but for strength and endurance, it is a friendly, cheerful, people-loving dog that greets everyone with enthusiasm, so it is unsuitable as a guard dog. It rarely barks, preferring to “talk” and howl, and when bored it likes to dig and destroy. Its independent, stubborn nature and strong hunting instinct call for consistent training, and its coat sheds heavily twice a year.","mozgas":"2 hours or more a day, with pulling and hiking, in cool weather","erdekesseg":"Since 2010 the Alaskan Malamute has been Alaska’s official state dog.","kinekIgen":["Experienced, active, consistent owners","Hikers and dog-pulling sport enthusiasts who like cold weather","Houses with a garden and a tall, secure fence"],"kinekNem":["First-time dog owners, small flats","Households with cats or small pets","Anyone looking for a watchdog"],"egeszseg":["Hip dysplasia","Hereditary dwarfism (chondrodysplasia)","Polyneuropathy (AMPN, DNA test available)","Hypothyroidism"],"orszag":"USA (Alaska)"},"keeshond":{"nev":"Keeshond (Wolfspitz)","tagline":"A bespectacled, smiling ball of fluff – a born family dog.","leiras":"The Keeshond (Wolfspitz) – Keeshond being its Dutch name – is the largest variety of German spitz, and was once the vigilant guardian of river barges and quays in Holland. A friendly, cheerful and decidedly people-oriented dog: patient with children, and following its family everywhere. It is excellent at sounding the alarm and announces every newcomer loudly, but it is not cut out to be a guard that bites. Its thick double coat needs brushing several times a week, it sheds heavily when it moults, and it does not cope well with being left alone for long.","mozgas":"1 hour of walking and play a day","erdekesseg":"According to tradition, it got its Dutch name from the dog of the 18th-century Patriot leader Cornelis “Kees” de Gyselaer, so for a time the breed became a symbol of the Dutch Patriots.","kinekIgen":["Families with children, first-time dog owners too","City flats with regular walks","People who enjoy combing regularly"],"kinekNem":["Anyone bothered by frequent barking","Owners who leave the dog alone all day","Anyone bothered by lots of shed hair"],"egeszseg":["Hip dysplasia","Patellar luxation","Hyperparathyroidism (DNA test available)","Hypothyroidism"],"orszag":"Germany / Netherlands","alias":["Wolfspitz"]},"japan-spicc":{"nev":"Japanese Spitz","tagline":"A snow-white mini Samoyed lookalike – cheerful, clean, adaptable.","leiras":"The Japanese Spitz developed in Japan in the first half of the 20th century, expressly as a companion dog. Cheerful, clever and affectionate, it enjoys playing with children and would go everywhere with its family. It adapts well to city flat life, learns easily and is good at dog sports too, but it announces strangers by barking. Its snow-white coat is surprisingly easy to keep clean, though it sheds heavily when it moults, so weekly brushing is a must.","mozgas":"45–60 minutes of walking and play a day","erdekesseg":"Its ancestors were white German Spitzes taken to Japan in the early 20th century, so it is a close relative of the European spitzes.","kinekIgen":["First-time dog owners","City flats, families with children too","People who would take their dog everywhere with them"],"kinekNem":["Owners who leave the dog alone all day","Anyone bothered by white hair shed during moulting"],"egeszseg":["Patellar luxation","Heavy tearing, tear stains under the eyes"],"orszag":"Japan"},"eurazsiai":{"nev":"Eurasier","tagline":"A well-balanced family spitz: reserved with strangers, devoted at home.","leiras":"The Eurasier is a young breed: it was developed in Germany in the 1960s by crossing the Keeshond (Wolfspitz) and the Chow Chow, later adding the Samoyed, expressly as a family dog. Calm, well balanced and quiet, it bonds deeply with its family and is reserved with strangers, but not aggressive. A sensitive soul, it copes badly with rough handling and with being kept in a kennel, and is happiest near its owners. Its thick coat needs regular brushing, and it sheds heavily when it moults.","mozgas":"1–1.5 hours of calm walking a day","erdekesseg":"A trait inherited from the Chow Chow, its tongue may be pink, bluish-black or spotted – the breed standard accepts all three.","kinekIgen":["Calm families with children","First-time dog owners, with patient training","People who spend a lot of time at home"],"kinekNem":["Kennels or outdoor living","Anyone who wants a dog that is friendly with everyone","Anyone bothered by lots of shed hair"],"egeszseg":["Hip dysplasia","Patellar luxation","Hypothyroidism","Eyelid abnormalities (entropion, ectropion)"],"orszag":"Germany"},"basenji":{"nev":"Basenji","tagline":"The “barkless dog”: it yodels, and washes itself like a cat.","leiras":"The Basenji is an ancient hunting dog of Central Africa, mainly the Congo Basin, where it drove game into nets. It does not bark but makes a characteristic, yodel-like sound, and grooms itself carefully like a cat, barely shedding. Clever, curious and independent, it only takes training seriously when it thinks it worthwhile, and because of its strong hunting instinct it easily runs off without a lead. When bored it entertains itself by chewing and destroying things, so it needs plenty of shared activities and play.","mozgas":"1–1.5 hours a day, with running in a fenced area","erdekesseg":"Basenji bitches, like wolves, come into season only once a year, instead of the twice that is usual for most dog breeds.","kinekIgen":["Experienced, patient owners with a sense of humour","People looking for a quiet dog that hardly sheds","City flats too, with lots of exercise"],"kinekNem":["First-time dog owners","Households with cats or small pets","Anyone who would walk it off the lead"],"egeszseg":["Fanconi syndrome (kidney disease, DNA test available)","Progressive retinal atrophy (PRA)","Pyruvate kinase deficiency (anaemia, DNA test available)","Hypothyroidism"],"orszag":"Congo"},"csau-csau":{"nev":"Chow Chow","tagline":"A lion-maned, blue-tongued aristocrat with a cat’s independence.","leiras":"The Chow Chow is one of China’s most ancient dog breeds, used for centuries for guarding, hunting and draught work. Dignified, independent and reserved: it bonds truly with just one or two people, eyes strangers with suspicion and does not like intrusive hugging. At home it is calm and notably clean, so it does fine in a flat, but it tolerates summer heat badly. Its thick coat needs regular, thorough brushing, and without early socialisation it can become overly suspicious.","mozgas":"45–60 minutes of calm walking a day, in summer during the cooler hours","erdekesseg":"Sigmund Freud’s favourite dog, Jofi, was a Chow Chow, and often lay in the consulting room during therapy sessions.","kinekIgen":["Experienced, calm, consistent owners","Quiet, adult-only households","People who respect a dog’s independence"],"kinekNem":["Families with young children","First-time dog owners","Anyone looking for a cuddly, playful dog"],"egeszseg":["Entropion (inward-turning eyelid)","Hip and elbow dysplasia","Hypothyroidism","Heat sensitivity"],"orszag":"China","alias":["Chow"]},"amerikai-akita":{"nev":"American Akita","tagline":"A bear-headed, powerful guardian – the Akita’s bigger, sturdier branch.","leiras":"The American Akita came to the United States after the Second World War, developed from larger, heavier-built Japanese Akitas, and is now regarded as a separate breed. A confident, dignified and quiet dog, it is deeply loyal to its family and firmly protects its territory and its people. It is reserved with strangers and often cannot get along with other dogs – especially those of the same sex. Its strong will calls for early, thorough socialisation and an experienced, consistent owner.","mozgas":"1–1.5 hours of walking a day, mostly on the lead","erdekesseg":"Helen Keller brought the first Akita to the United States in 1937, after being given it as a gift during her trip to Japan.","kinekIgen":["Experienced, confident, consistent owners","Houses with a garden where it has something to guard","Calm, adult-only households"],"kinekNem":["First-time dog owners","Families with young children","Multi-dog or cat households"],"egeszseg":["Hip dysplasia","Gastric dilatation-volvulus (bloat)","Autoimmune diseases (e.g. sebaceous adenitis)","Hypothyroidism"],"orszag":"USA / Japan"},"bloodhound":{"nev":"Bloodhound","tagline":"The world’s best nose, packed into droopy wrinkles.","leiras":"The Bloodhound’s ancestor was the scenthound of the monks of the Saint-Hubert Abbey in the Ardennes in the Middle Ages, which is where the name St Hubert Hound comes from. A gentle, patient and friendly giant, kind with children, but not at all suited to guard duty. Once it catches a scent it forgets everything else, so it must never be let off the lead, and training takes a lot of patience. Its deep, booming voice carries a long way, it drools heavily, and its drooping ears need cleaning regularly.","mozgas":"1.5–2 hours of walking a day, with plenty of sniffing, on the lead","erdekesseg":"In the United States, the scent-tracking results of Bloodhounds have even been accepted in court as evidence.","kinekIgen":["Patient, calm owners with a sense of humour","Houses with a garden and a spacious, fenced yard","Those interested in tracking and mantrailing"],"kinekNem":["Flats with sensitive neighbours","Anyone bothered by drooling","Anyone wanting a dog that can be recalled off the lead"],"egeszseg":["Gastric dilatation-volvulus (bloat, especially common in the breed)","Ear infections","Eyelid abnormalities (entropion, ectropion)","Hip and elbow dysplasia"],"orszag":"Belgium / France","alias":["St. Hubert Hound"]},"bajor-hegyi-vereb":{"nev":"Bavarian Mountain Scent Hound","tagline":"The most persistent tracker of wounded game: the hunter’s secret weapon.","leiras":"The Bavarian Mountain Scent Hound was bred in Bavaria in the late 19th century to follow the blood trail of wounded game on mountain hunts. At home it is a calm, reserved dog, strongly attached to its owner and wary of strangers. At work it is extremely persistent and single-minded, a true specialist that needs regular tasks involving nose work. Without a job, cooped up in a small space, it gets bored, so it is recommended mainly for hunters or for owners who take tracking seriously.","mozgas":"1.5–2 hours a day, with regular scent work","erdekesseg":"Its German name, Bayerischer Gebirgsschweißhund, comes from hunting jargon: here “Schweiß” means not sweat but the blood of wounded game.","kinekIgen":["Hunters and scent hound handlers","Those who take tracking and mantrailing seriously","Those living in the country in a house with a garden"],"kinekNem":["First-time dog owners","City flats","Anyone who just wants a family companion, with no job to do"],"egeszseg":["Hip dysplasia","Ear infections (due to floppy ears)"],"orszag":"Germany","alias":["Bavarian Hound"]},"angol-szetter":{"nev":"English Setter","tagline":"A speckled gentleman in a silky coat, with an endlessly sweet nature.","leiras":"The English Setter took its present form in 19th-century England as a bird-hunting gundog that signals found game by freezing motionless. Gentle, friendly and exceptionally sweet-natured, it is patient with children and open even to strangers, so it is no guard dog. Calm at home but tireless outdoors, it matures slowly and stays scatty and puppy-like for a long time. A sensitive soul, it takes harsh words badly, and its silky coat needs combing several times a week.","mozgas":"1.5–2 hours a day, with plenty of free running","erdekesseg":"Its distinctive fine speckled pattern is called “belton” – a word coined by Edward Laverack, one of the breed’s founders, from the name of a village in Northumberland.","kinekIgen":["Active families, including those with children","Hikers, runners and hunters","Patient owners with a gentle hand"],"kinekNem":["Small flats with little exercise","Anyone looking for a watchdog","Lifestyles with long hours alone"],"egeszseg":["Congenital deafness (hearing-screened parents!)","Hip and elbow dysplasia","Hypothyroidism","Skin allergies"],"orszag":"United Kingdom"},"angol-pointer":{"nev":"English Pointer","tagline":"A living statue of the pointing hunter: stamina and elegance.","leiras":"The English Pointer developed in 17th–18th-century England and gets its name from the classic motionless stance, the “point”, with which it indicates game. A sporty, tireless and good-natured dog, affectionate with its family, patient with children and not suspicious even of strangers. It is only calm at home if it has had a proper run every day; otherwise it gets bored and restless. Its short coat needs hardly any grooming, but it tolerates cold badly, and because of its strong hunting instinct, recall needs to be practised separately.","mozgas":"2 hours a day or more, with plenty of free running","erdekesseg":"In the Second World War, Judy, an English Pointer and the mascot of the Royal Navy, ended up in Japanese captivity, where she was even officially registered as a prisoner of war – she was later awarded the Dickin Medal.","kinekIgen":["Runners, cyclists and hunters","Active families with older children","Those living in the country in a house with a garden"],"kinekNem":["First-time dog owners","Leisurely lifestyles with little exercise","Owners who leave the dog alone all day"],"egeszseg":["Hip dysplasia","Skin allergies","Hypothyroidism"],"orszag":"United Kingdom","alias":["Pointer"]},"drotszoru-nemet-vizsla":{"nev":"German Wirehaired Pointer","tagline":"Any weather, any terrain: the hunter’s bearded all-rounder.","leiras":"The German Wirehaired Pointer was created in Germany at the turn of the 19th–20th century as a versatile hunting dog: it points game, retrieves, follows a trail and also works in water. Its hard, wiry coat and beard protect it in all weathers, so it is at home in thick undergrowth and in the cold. A clever, persistent dog, strongly attached to its family, it is more cautious with strangers than its short-haired relative and watchfully guards its home. Without several hours of active work or sport a day it gets bored, so it is not really recommended for beginners or city flats.","mozgas":"2 hours a day or more, with running and retrieving","erdekesseg":"In the 1930s it also played a part in creating the Hungarian Wirehaired Vizsla: the Hungarian Vizsla was crossed with the German Wirehaired Pointer.","kinekIgen":["Hunters and very active families","Runners, hikers and dog sports enthusiasts","Those living in the country in a house with a garden"],"kinekNem":["City flats with little exercise","First-time dog owners","Anyone who can’t spare several hours a day"],"egeszseg":["Hip and elbow dysplasia","Von Willebrand disease (clotting disorder)","Hypothyroidism"],"orszag":"Germany"},"bretagne-i-spaniel":{"nev":"Brittany","tagline":"A compact French pointer with a spring in its step and a cheerful spirit.","leiras":"The Brittany comes from the Brittany region of France, and although “spaniel” appears in its original name (Épagneul Breton), it actually works as a pointer: it finds game and signals it by standing on point. A compact, nimble and extremely enthusiastic dog, it is strongly attached to its family, plays cheerfully with children and gets on well with other dogs too. Quick to learn and keen to please, but sensitive, so it does not take a harsh tone well. Its energy is practically inexhaustible: without a good daily run and a job to do it becomes restless, so it suits an active, outdoor lifestyle.","mozgas":"1.5–2 hours a day, with plenty of free running","erdekesseg":"Many Brittanys are born with a naturally short tail, or with no tail at all.","kinekIgen":["Active families, including those with children","Runners, hikers and dog sports enthusiasts","Hunters looking for a smaller pointer"],"kinekNem":["Leisurely lifestyles with little exercise","Work schedules that mean long hours alone","Anyone looking for a watchdog"],"egeszseg":["Hip dysplasia","Epilepsy","Hypothyroidism"],"orszag":"France","alias":["Brittany Spaniel","Épagneul Breton","Epagneul Breton"]},"flat-coated-retriever":{"nev":"Flat-Coated Retriever","tagline":"A glossy black Peter Pan: never quite grows up.","leiras":"The Flat-Coated Retriever developed in 19th-century England as a retrieving dog for water and land, and takes its name from its glossy, flat black or liver coat. Cheerful, friendly and eternally optimistic, it loves children and other dogs, and keeps its puppyish good humour into old age. Quick to learn but scatty for a long time, it needs plenty of exercise and shared activities. Sadly, cancers are common in the breed, so its lifespan is shorter than average.","mozgas":"2 hours a day, with running, swimming and retrieving","erdekesseg":"In the late 19th and early 20th century it was one of the most popular retrievers among British gamekeepers, before the Labrador Retriever and the Golden Retriever pushed it into the background.","kinekIgen":["Active families with children","First-time dog owners too, if they are very active","Those who enjoy swimming, retrieving and hiking"],"kinekNem":["Leisurely lifestyles with little exercise","Anyone expecting a calm dog that matures quickly","Anyone looking for a watchdog"],"egeszseg":["Cancers (mainly histiocytic sarcoma)","Glaucoma","Patellar luxation","Hip dysplasia"],"orszag":"United Kingdom"},"nova-scotia-retriever":{"nev":"Nova Scotia Duck Tolling Retriever","tagline":"Fox-coloured decoy dog: lures ducks in by playing.","leiras":"The Nova Scotia Duck Tolling Retriever comes from the coast of Nova Scotia in Canada, where it played along the shore, fox-like, to lure curious wild ducks within shooting range, and then retrieved the shot game. The smallest of the retrievers, it is lively, clever and playful, devoted to its family and a little reserved with strangers at first. When excited it lets out a distinctive, sharp, shrieking sound that may surprise the neighbours. It needs a huge amount of exercise and mental challenge, and becomes restless when bored.","mozgas":"1.5–2 hours a day, with running, swimming and retrieving","erdekesseg":"Since 1995 it has been the official provincial dog of Nova Scotia, Canada.","kinekIgen":["Active families and dog sports enthusiasts","Owners who enjoy swimming and retrieving","People who can set a shared task every day"],"kinekNem":["Leisurely lifestyles with little exercise","Owners who leave the dog alone all day","Anyone looking for a watchdog"],"egeszseg":["Autoimmune diseases (e.g. Addison’s disease)","Collie eye anomaly (CEA, DNA test available)","Progressive retinal atrophy (PRA)","Hip dysplasia"],"orszag":"Canada","alias":["Duck Tolling Retriever"]},"portugal-vizikutya":{"nev":"Portuguese Water Dog","tagline":"Curly-coated fisherman’s helper, born to swim – and it hardly sheds.","leiras":"For centuries the Portuguese Water Dog helped the fishermen of the Algarve: it herded fish into the nets, swam out to fetch lost gear, and carried messages between boats. An excellent swimmer, clever, quick to learn and extremely energetic, it is strongly attached to its family and wants to be involved in everything. It sheds little, but its curly coat grows continuously, so it needs regular combing and clipping every few weeks. Without plenty of daily exercise and mental work it gets bored, and shows it by chewing and destroying things.","mozgas":"1.5–2 hours a day, preferably with swimming","erdekesseg":"The Obama family’s two dogs, Bo and Sunny, were both Portuguese Water Dogs, and lived in the White House for years.","kinekIgen":["Active families, including those with children","Those who enjoy swimming and water sports","People bothered by shedding hair"],"kinekNem":["Leisurely lifestyles with little exercise","Anyone unwilling to spend time and money on grooming","Owners who leave the dog alone all day"],"egeszseg":["Hip dysplasia","Progressive retinal atrophy (PRA)","GM1 gangliosidosis (metabolic disease, DNA test available)","Addison’s disease"],"orszag":"Portugal"},"spanyol-vizikutya":{"nev":"Spanish Water Dog","tagline":"Curly-haired Spanish all-rounder: it herds, swims and learns.","leiras":"The Spanish Water Dog is the versatile working dog of Andalusia: for centuries it herded sheep and goats, helped fishermen and retrieved game from the water. Clever, hard-working and very loyal, it is closely attached to its family but initially reserved with strangers, so it needs early socialisation. Its curly coat sheds little and, instead of being combed, it is clipped evenly a few times a year. Without plenty of exercise and mental work it soon gets bored and finds its own entertainment, which is not always welcome.","mozgas":"1.5–2 hours a day, with plenty of shared work and swimming","erdekesseg":"In its homeland of Andalusia it used to be called “turco andaluz”, meaning “Andalusian Turk”.","kinekIgen":["Active, sporty owners and families","Those who enjoy dog sports (agility, herding)","People looking for a low-shedding dog"],"kinekNem":["Sedentary, stay-at-home lifestyles","Anyone who won’t make time for socialisation and training","Owners who leave the dog alone for long hours"],"egeszseg":["Hip dysplasia","Progressive retinal atrophy (PRA, DNA test available)","Hypothyroidism","Neuroaxonal dystrophy (NAD, DNA test available)"],"orszag":"Spain"},"amerikai-cocker-spaniel":{"nev":"American Cocker Spaniel","tagline":"The English Cocker’s elegant American cousin, in a long, lush coat.","leiras":"The American Cocker Spaniel developed from the English Cocker Spaniel in the United States and became a separate breed in the mid-20th century: smaller, rounder-headed and with a much fuller coat than its European relative. A sweet, cheerful and affectionate companion, it enjoys learning, gets on well with children and is content in a flat as long as it gets enough attention. A sensitive soul, it takes harsh words badly. Its long, silky coat, however, is a serious commitment: it needs regular combing, a groomer every 4–8 weeks and careful ear care.","mozgas":"45–60 minutes of walking and play a day","erdekesseg":"Lady, the heroine of Disney’s 1955 classic Lady and the Tramp, is an American Cocker Spaniel.","kinekIgen":["Beginner owners and families with children","City flats, calmer lifestyles","People who enjoy coat grooming"],"kinekNem":["Anyone unwilling to pay for a regular groomer","Those looking for a watchdog","Owners who leave the dog alone for long hours"],"egeszseg":["Ear infections (floppy, thickly furred ears)","Eye problems (glaucoma, cataracts, PRA)","Skin problems (seborrhoea)","Patellar luxation"],"orszag":"USA"},"kooikerhondje":{"nev":"Kooikerhondje","tagline":"Orange-and-white duck lure with black “earrings”.","leiras":"For centuries in the Netherlands the Kooikerhondje worked at duck decoys (trapping ponds): waving its white, plumed tail, it lured curious ducks in, and in the mid-20th century a Dutch baroness saved it from extinction. A cheerful, nimble and affectionate dog, cuddly and playful with its family, quick to learn and happy in a flat if it gets enough exercise. A sensitive nature: it is often reserved with strangers and copes badly with rough handling and noisy, chaotic surroundings. It therefore needs careful socialisation and patient, positive training.","mozgas":"1–1.5 hours a day of walks, play and dog sports","erdekesseg":"Its name literally means “the little dog of the duck-trap man”: the Dutch “kooi” is the name of a channelled trap built for catching wild ducks.","kinekIgen":["Active families, including those with children","Those who enjoy dog sports (agility, obedience)","People looking for a small but sporty companion"],"kinekNem":["Noisy, chaotic households","Owners who want to train with a heavy hand","Owners who leave the dog alone for long hours"],"egeszseg":["Von Willebrand disease (clotting disorder, DNA test available)","Hereditary necrotising myelopathy (ENM, DNA test available)","Patellar luxation","Cataracts"],"orszag":"Netherlands"},"lhasa-apso":{"nev":"Lhasa Apso","tagline":"Tiny sentry of Tibetan monasteries, in a lush, floor-length coat.","leiras":"The Lhasa Apso was the indoor guard dog of Tibetan monasteries and noble houses, announcing newcomers with sharp barking. Today it is still a watchful, confident and independent little dog: deeply attached to its family, wary of strangers and quick to announce every unusual noise loudly. Its thick, floor-length coat sheds little, but needs daily combing or regular clipping, and its stubborn nature calls for patient, consistent training. Because of its shorter muzzle it copes less well with heat, and mild breathing problems can occur, so choose a puppy from health-screened parents.","mozgas":"30–60 minutes of walking and play a day","erdekesseg":"It is named after Tibet’s holy city, Lhasa, and its Tibetan name, “Abso Seng Kye”, means roughly “barking lion guard dog”.","kinekIgen":["Those living in flats, calmer lifestyles","People who want an alert little dog that sounds the alarm","People who enjoy coat grooming"],"kinekNem":["Anyone looking for a quiet dog that barks little","Busy families with young children","Anyone who won’t make time for daily combing"],"egeszseg":["Eye problems (PRA, dry eye, “cherry eye”)","Hereditary renal dysplasia","Patellar luxation","Mild breathing difficulties (shorter nose)"],"orszag":"Tibet"},"tibeti-terrier":{"nev":"Tibetan Terrier","tagline":"Not actually a terrier: a shaggy Tibetan good-luck charm.","leiras":"The Tibetan Terrier lived in Himalayan monasteries and alongside nomadic families, where it was regarded as a good-luck companion – despite its name, it is not actually a terrier. A cheerful, gentle and adaptable dog, closely attached to its family, patient with children and a little reserved with strangers at first. It is happy in a flat or a house with a garden as long as it can walk and play every day. Its thick, long coat sheds little, but it must be combed through thoroughly several times a week, or it quickly gets matted.","mozgas":"45–60 minutes a day of walk
