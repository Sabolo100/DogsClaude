ing and playing together","erdekesseg":"Its large, flat, round paws work like snowshoes, so it moves more easily over snowy, rocky mountain terrain.","kinekIgen":["Beginner owners and families with children","People looking for a low-shedding dog","City flats and houses with a garden alike"],"kinekNem":["Anyone who doesn’t want to comb regularly","Owners who leave the dog alone for long hours"],"egeszseg":["Primary lens luxation (PLL, DNA test available)","Progressive retinal atrophy (PRA)","Neuronal ceroid lipofuscinosis (NCL, DNA test available)","Hip dysplasia"],"orszag":"Tibet"},"pekingi-palotakutya":{"nev":"Pekingese","tagline":"A lion-hearted imperial lapdog – and well aware of it.","leiras":"For centuries the Pekingese was the treasured favourite of the Chinese imperial court. A dignified, independent and brave little dog, it is loyally attached to its owner, but it is stubborn and dislikes the romping and rougher hands of small children. Its exercise needs are small and it is perfectly happy in a flat, but its thick coat sheds heavily and needs regular combing and cleaning of the facial folds. Its flat nose often causes breathing difficulties (brachycephalic syndrome) and it tolerates heat very badly, so choose a puppy only from health-screened parents.","mozgas":"20–30 minutes a day of gentle walking; in hot weather, only in the cool","erdekesseg":"In 1860, after the sacking of the Summer Palace in Beijing, British soldiers took the first dogs to England, and one of them was given as a gift to Queen Victoria.","kinekIgen":["Calm, quieter homes and flats","Older people and adult-only households","People looking for a dignified lapdog"],"kinekNem":["Busy families with young children","Active, sporty lifestyles","Hot homes without air conditioning"],"egeszseg":["Brachycephalic syndrome (breathing difficulties, heat sensitivity)","Eye injuries, corneal ulcers (prominent eyes)","Intervertebral disc disease (IVDD; long back, short legs)","Skin fold dermatitis"],"orszag":"China"},"papillon":{"nev":"Papillon","tagline":"Butterfly-eared mini genius – the star of the agility course.","leiras":"The Papillon, or “butterfly dog”, was a favourite at the courts of Renaissance Europe and often sits on noble ladies’ laps in old paintings. Despite its tiny size it is lively, curious and extremely clever: it learns quickly, loves tricks and is among the best on the agility course. Its silky coat has no undercoat and needs surprisingly little grooming, and it does very well in a flat. Because of its fragile bones, though, rough play from small children and big jumps can easily injure it.","mozgas":"45–60 minutes a day of walking and plenty of play together","erdekesseg":"The drop-eared variety is called the Phalène, meaning “night moth” – the counterpart to the erect-eared “butterfly”.","kinekIgen":["Beginner owners, city flats","Those who enjoy learning tricks and dog sports","People looking for a tiny but not lazy companion"],"kinekNem":["Busy families with young children","Anyone who sees it only as a decorative dog, with no activities"],"egeszseg":["Patellar luxation","Dental problems","Progressive retinal atrophy (PRA, DNA test available)","Neuroaxonal dystrophy (NAD, DNA test available)"],"orszag":"France / Belgium"},"coton-de-tulear":{"nev":"Coton de Tuléar","tagline":"A cotton-wool grinner from Madagascar who charms everyone.","leiras":"The Coton de Tuléar is related to the bichons, and in Madagascar it was a favourite lapdog of the local nobility. Cheerful, gentle and extremely sociable, it gets on with children, strangers and other animals, barks little, and is an excellent choice even for a first-time owner. Its cotton-like white coat sheds little, but must be combed through thoroughly several times a week or it gets matted. It is very attached to its person, so it finds long periods alone hard to bear.","mozgas":"30–60 minutes of walking and play a day","erdekesseg":"It is named after its cotton-like coat (French “coton”) and the Madagascan port city of Tuléar (now Toliara).","kinekIgen":["Beginner owners and families with children","City flats, older people too","People looking for a low-shedding dog"],"kinekNem":["Anyone who is away from home a lot","Anyone who doesn’t want to comb regularly","Those looking for a watchdog"],"egeszseg":["Patellar luxation","Eye problems (e.g. multifocal retinopathy, DNA test available)","Hip dysplasia","Allergies, skin problems"],"orszag":"Madagascar","alias":["Coton"]},"kinai-meztelen-kutya":{"nev":"Chinese Crested","tagline":"Punk-haired fashion icon: no coat, but all the more love.","leiras":"The origins of the Chinese Crested are obscure, and today’s breed was developed mainly in England and America in the 20th century. It comes in two varieties: the hairless, which has silky hair only on its head, tail and feet, and the fully coated Powderpuff. A sweet, playful and very affectionate lapdog, it barks little and does very well in a flat. Its bare skin does need care, though: regular cleaning and moisturising, sunscreen in summer and a jumper in winter.","mozgas":"30–45 minutes a day of walking, with sunscreen in sunshine","erdekesseg":"Hairlessness is caused by a dominant gene, so a single litter can contain both hairless puppies and puppies with a full coat, known as Powderpuffs.","kinekIgen":["City flats, calmer lifestyles","People looking for a low-shedding dog","People looking for a cuddly, all-day companion"],"kinekNem":["Anyone unwilling to commit to regular skin care","Outdoor living or cold homes","Owners who leave the dog alone for long hours"],"egeszseg":["Skin problems (sunburn, pimples, blackheads)","Missing teeth, dental problems (hairless variety)","Primary lens luxation (PLL, DNA test available)","Patellar luxation"],"orszag":"China","alias":["Chinese Crested Dog"]},"brusszeli-griffon":{"nev":"Brussels Griffon","tagline":"Bearded, human-faced little character who takes everything seriously.","leiras":"The Brussels Griffon once caught rats in the cab stables of the Belgian capital, and then, in the late 19th century, became a fashionable lapdog as the favourite of Queen Marie Henriette of Belgium. A confident, very affectionate little dog with an almost human expression, it often bonds most closely with one person and reacts sensitively to rough handling. Its wiry coat sheds little but needs trimming a few times a year. Its flat nose can cause breathing difficulties (brachycephalic syndrome) and it tolerates heat poorly, so choose a puppy only from health-screened parents.","mozgas":"30–45 minutes a day of walking and play, less in hot weather","erdekesseg":"In the 1997 film “As Good as It Gets”, starring Jack Nicholson, Verdell, the neighbour’s dog, was played by Brussels Griffons.","kinekIgen":["City flats, adult-only households","People who want a companion by their side all day","Older people, calmer households"],"kinekNem":["Busy families with young children","Owners who leave the dog alone for long hours","Hot homes without air conditioning"],"egeszseg":["Brachycephalic syndrome (breathing difficulties)","Eye injuries (large, prominent eyes)","Syringomyelia (Chiari-like malformation)","Patellar luxation"],"orszag":"Belgium"},"angol-agar":{"nev":"Greyhound","tagline":"The dog world’s racing car, happiest parked on the sofa.","leiras":"The Greyhound is an ancient British hunting dog, known today mainly as a racing sighthound – in Europe many retired racing dogs find new families through rescue organisations. At home it is surprisingly calm, gentle and quiet: after short, lightning-fast sprints it spends most of the day dozing on the sofa, and it rarely barks. Its short coat needs almost no grooming, but because of its thin skin and low body fat it feels the cold, so it needs a coat in winter. With its strong prey drive it may chase cats and small animals, so only let it run off the lead in a fenced area.","mozgas":"About 1 hour of walking a day, including short, safe sprints","erdekesseg":"It is the fastest dog breed: in a sprint it can reach speeds of around 70 km/h.","kinekIgen":["Those looking for a calm, quiet housemate","City flats too, if it has somewhere to sprint","People happy to adopt a rescue dog"],"kinekNem":["Households with small pets (judge case by case)","Anyone who would walk it off the lead everywhere","Outdoor living in the cold"],"egeszseg":["Sensitivity to certain anaesthetics","Skin and muscle injuries (thin skin)","Bone cancer (osteosarcoma) in later life","Dental problems (tartar, gingivitis)"],"orszag":"United Kingdom"},"ir-farkaskutya":{"nev":"Irish Wolfhound","tagline":"One of the tallest dogs, with the gentlest heart.","leiras":"The Irish Wolfhound is an ancient Irish hunting dog that once hunted wolves and deer; after it had almost died out by the 19th century, Captain George Augustus Graham revived it by breeding. Despite its huge size it is a gentle, calm and patient giant, kind with children, rarely barking and, for that very reason, no watchdog. It needs a lot of space, and its costs are giant too, from food to the vet. A short-lived breed, living 6–10 years on average, it needs careful, gradual exercise as a puppy.","mozgas":"1–1.5 hours of calm walking a day, with some free running","erdekesseg":"Since 1902 the mascot of the Irish Guards regiment of the British Army has always been an Irish Wolfhound.","kinekIgen":["Families living in a spacious house with a garden","Those looking for a calm, gentle giant","People willing to cover the costs of a giant dog"],"kinekNem":["Small flats with lots of stairs","Those looking for a watchdog","Tight budgets"],"egeszseg":["Dilated cardiomyopathy (heart muscle disease)","Bone cancer (osteosarcoma)","Gastric dilatation-volvulus (bloat, deep chest)","Portosystemic shunt (liver shunt, puppy screening)"],"orszag":"Ireland"},"barzoj":{"nev":"Borzoi","tagline":"Aristocratic Russian sighthound with a long, silky coat.","leiras":"The Borzoi is the sighthound of the Russian aristocracy, kept in large packs for hunting wolves, foxes and hares. At home it is calm, dignified and quiet, gentle with its family and rather reserved with strangers, and it does not like loud, chaotic romping. Independent-minded, it needs patient training, and because of its strong prey drive it should only be let off the lead in a fenced area. Its long, silky coat needs thorough combing every week, and it sheds heavily when moulting.","mozgas":"1–1.5 hours of walking a day, including safe off-lead running","erdekesseg":"Its Russian name, “borzaya”, comes from the word “borzyi”, meaning swift, fast.","kinekIgen":["Experienced, calm owners","Those living in a spacious house with a garden","People looking for an elegant, quiet companion"],"kinekNem":["Households with cats or small pets","Those looking for an obedient, easy-to-train dog","Noisy families with young children"],"egeszseg":["Gastric dilatation-volvulus (bloat, deep chest)","Sensitivity to certain anaesthetics","Bone cancer (osteosarcoma)","Heart disease (cardiomyopathy)"],"orszag":"Russia","alias":["Russian Wolfhound"]},"afgan-agar":{"nev":"Afghan Hound","tagline":"A shimmering, floor-length coat, royal bearing – and a will of its own.","leiras":"The Afghan Hound hunted hares and gazelle in the mountains of Afghanistan, and its thick coat protected it through the harsh, cold winters. Dignified, independent and wary of strangers, but affectionate with its family and sometimes downright clownish. Independent-minded, it needs a great deal of patience in training, and because of its strong prey drive it should only be let off the lead in a safe, fenced area. Its floor-length, silky coat is a real commitment: it needs several hours of combing a week and regular bathing.","mozgas":"1–1.5 hours a day, including safe off-lead running","erdekesseg":"The world’s first cloned dog, Snuppy, born in South Korea in 2005, was an Afghan Hound.","kinekIgen":["Experienced owners who understand sighthounds","People who enjoy spending hours on coat grooming","Active owners living in a house with a garden"],"kinekNem":["Beginner owners","Those looking for an obedient, easy-to-train dog","Households with cats or small pets"],"egeszseg":["Cataracts","Hypothyroidism","Sensitivity to certain anaesthetics","Hip dysplasia"],"orszag":"Afghanistan","alias":["Afghan"]},"saluki":{"nev":"Saluki","tagline":"The gazelle hunter of the ancient Middle East: graceful, quiet, independent.","leiras":"The Saluki is one of the oldest dog breeds: in the deserts of the Middle East, the Bedouin hunted gazelle and hares with it. At home it is quiet, gentle and dignified, attached to its family but not clingy, and rather reserved with strangers. Outdoors, though, it is a tireless runner that regularly needs to race freely in a safe, fenced area. An independent and sensitive nature: training calls for patience and a gentle touch, and because of its strong prey drive its recall is seldom reliable.","mozgas":"1.5–2 hours daily, including safe off-lead running","erdekesseg":"In the Middle East it was traditionally hunted together with a hunting falcon: the bird slowed the gazelle down and the Saluki caught up with it.","kinekIgen":["Runners and active, experienced owners","Those looking for a quiet dog that barks little","Those living in a spacious house with a garden"],"kinekNem":["Households with cats or small pets","Anyone who would let it off the lead everywhere","Those looking for an obedient, easy-to-train dog"],"egeszseg":["Heart disease (cardiomyopathy)","Haemangiosarcoma (blood vessel cancer)","Hypothyroidism","Sensitivity to certain anaesthetics"],"orszag":"Middle East"},"spanyol-galgo":{"nev":"Galgo Español","tagline":"Perhaps Europe’s most-rescued sighthound – a grateful, gentle, quiet housemate.","leiras":"For centuries the Galgo Español has been the hare-hunting sighthound of Spain’s fields, and today it is known across Europe: a great many galgos discarded from hunting find new homes through rescue organisations. At home it is a calm, gentle and quiet housemate that almost never barks and happily dozes through most of the day. Rescued dogs are often timid at first, so they need patient, gentle handling and gradual settling in. Its short coat needs hardly any grooming, but its strong prey drive means it may chase small animals, and it should only be let off the lead in a fenced area.","mozgas":"About 1 hour of walking a day, including safe off-lead running","erdekesseg":"The word “galgo” comes from the Latin “canis gallicus”, meaning “Gaulish dog”, which is what the Romans called the sighthounds of the Celts.","kinekIgen":["Those looking for a calm, quiet housemate","People happy to adopt a rescue dog","City flats too, if it has somewhere to run"],"kinekNem":["Households with small pets (judge case by case)","Outdoor living in the cold","Anyone who would walk it off the lead everywhere"],"egeszseg":["Sensitivity to certain anaesthetics","Skin and muscle injuries (thin skin)","Leishmaniasis and other Mediterranean infections (screen rescue dogs!)"],"orszag":"Spain","alias":["Spanish Greyhound","Spanish Galgo"]}}}}</script>
<script>window.PACSI_PWA=true;</script>
<script>(() => {
'use strict';
const APP_VERSION = "1.10.0", APP_BUILD = "ef95112";
const SITE = {"url": "https://pacsit.hu", "stat": {"endpoint": "https://stat.pacsit.hu/api/send", "website": "54fc0966-6e5f-4ad6-b8c3-7ea5af9642e9", "hosts": ["pacsit.hu", "www.pacsit.hu"]}};
/* ==========================================================================
   Alapok: segédfüggvények, adatok, állapot, tárolás, URL-állapot
   ========================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now();
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const ic = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const num = n => String(n).replace('.', t('fmt.dec'));   // tizedesjel: nyelvfüggő (magyar vessző, angol pont)
const range = a => a[0] === a[1] ? num(a[0]) : `${num(a[0])}–${num(a[1])}`;
const haptic = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* nem támogatott */ } };

const DATA = JSON.parse($('#pacsi-data').textContent);
const BREEDS = DATA.breeds;
const SPARES = Object.fromEntries(DATA.spares.map(s => [s.id, s]));
const BY_ID = new Map(BREEDS.map(b => [b.id, b]));
const IMG = window.PACSI_IMG || {};
const ARTIFACT = !!window.PACSI_ARTIFACT;   // claude.ai artifact-néző: nincs hash-állapot, letöltés, Web Share
let COLL = new Intl.Collator('hu');   // nyelvváltáskor cserélődik (12-i18n.js)

/* A beágyazott (base64) képeket rövid blob:-hivatkozássá alakítjuk. Egy 1,6 MB-os data URI
   egy CSS-változóban minden buborék minden stílus-újraszámolásakor újra feldolgozódna –
   ez okozta a több másodperces akadásokat az egyfájlos verzióban. */
function toBlobURL(uri) {
  if (!uri || !uri.startsWith('data:')) return uri;
  try {
    const comma = uri.indexOf(',');
    const mime = uri.slice(5, comma).split(';')[0];
    const bin = atob(uri.slice(comma + 1));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: mime }));
  } catch (e) { return uri; }
}
const SPRITE = toBlobURL(window.PACSI_SPRITE) || 'img/sprite-thumbs.webp';
window.PACSI_SPRITE = null;
const SP_ROWS = DATA.spriteRows || 8;
document.documentElement.style.setProperty('--sprite', `url("${SPRITE}")`);
document.documentElement.style.setProperty('--sp-size', `800% ${SP_ROWS * 100}%`);

const PORTRAIT_URL = {};
const portrait = id => IMG[id] ? (PORTRAIT_URL[id] || (PORTRAIT_URL[id] = toBlobURL(IMG[id]))) : `img/portrek/${id}.webp`;
/* A portrét már a buborék megérintésekor (asztalon rámutatáskor) dekódoljuk: különben a kártya első
   képkockáiban üres színes kör látszik a helyén, és a kép csak a kinyílás közben ugrik be. */
const DECODED = new Set();
function predecode(id) {
  if (DECODED.has(id)) return;
  DECODED.add(id);
  const im = new Image();
  im.src = portrait(id);
  if (im.decode) im.decode().catch(() => {});
}
const spritePos = b => `${(b.sprite % 8) / 7 * 100}% ${Math.floor(b.sprite / 8) / (SP_ROWS - 1) * 100}%`;
const picStyle = b => `--bgc:${b.bg};--pos:${spritePos(b)}`;

const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
const mqMobile = matchMedia('(max-width: 899px)');
const mqDark = matchMedia('(prefers-color-scheme: dark)');

const store = {
  get(k, d) { try { const v = localStorage.getItem('pacsi:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pacsi:' + k, JSON.stringify(v)); } catch (e) { /* privát mód */ } },
};

/* Központi állapot */
const S = {
  f: { meret: new Set(), szor: new Set(), szerep: new Set(), fci: new Set(), energia: null, t: new Set() },
  quiz: null,                 // { answers:[], crit:[] }
  mode: null,                 // 'rank' | 'strict' | null (= alapértelmezés: Csak találatok)
  view: 'felho', groupBy: 'meret', q: '',
  fav: new Set(store.get('fav', [])),
  cmp: store.get('cmp', []).filter(id => BY_ID.has(id)),
  card: null, drawer: null,
  theme: store.get('theme', 'auto'),
  rmUser: store.get('rm', false),
  mobile: mqMobile.matches,
  crit: [],
};
S.fav.forEach(id => { if (!BY_ID.has(id)) S.fav.delete(id); });
// alapértelmezés mindkét platformon: Csak találatok (a Rangsor egy kattintással bekapcsolható)
const modeOf = () => S.mode || 'strict';
const RM = () => mqRM.matches || S.rmUser;

/* Egyszerű eseménybusz */
const bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  emit(e, a) { (this.h[e] || []).forEach(f => f(a)); },
};

/* ---------- URL-állapot (hash) – szerver nélkül is megosztható ---------- */
function encodeHash() {
  const f = S.f, parts = [];
  for (const k of ['meret', 'szor', 'szerep', 'fci']) if (f[k].size) parts.push(`${k}:${[...f[k]].join('.')}`);
  if (f.energia) parts.push(`energia:${f.energia}`);
  f.t.forEach(t => parts.push(t));
  const p = new URLSearchParams();
  if (parts.length) p.set('f', parts.join(';'));
  if (S.quiz && S.quiz.done) p.set('k', S.quiz.answers.join('.'));
  if (S.mode) p.set('m', S.mode === 'strict' ? 's' : 'r');
  if (S.view !== 'felho') p.set('v', S.view === 'csoport' ? `csoport.${S.groupBy}` : S.view);
  if (S.card) p.set('b', S.card);
  const s = p.toString().replace(/%3A/g, ':').replace(/%3B/g, ';');
  return s ? '#' + s : '';
}
function decodeHash() {
  const h = location.hash.slice(1);
  if (!h) return {};
  const p = new URLSearchParams(h);
  const out = {};
  if (p.get('f')) {
    for (const part of p.get('f').split(';')) {
      const [k, v] = part.split(':');
      if (v != null) {
        if (k === 'energia') S.f.energia = v;
        else if (S.f[k] instanceof Set) v.split('.').forEach(x => S.f[k].add(k === 'fci' ? +x : x));
      } else if (TBY[k]) S.f.t.add(k);
    }
  }
  if (p.get('k')) out.quiz = p.get('k').split('.').map(Number);
  if (p.get('m')) S.mode = p.get('m') === 's' ? 'strict' : 'rank';
  if (p.get('v')) {
    const [v, g] = p.get('v').split('.');
    if (['felho', 'csoport', 'terkep', 'lista'].includes(v)) S.view = v;
    if (g) S.groupBy = g;
  }
  if (p.get('b') && BY_ID.has(p.get('b'))) out.card = p.get('b');
  if (p.has('kviz')) out.kviz = true;   // PWA-gyorsparancs: „Párkereső kvíz”
  return out;
}
let hashTimer = 0;
function syncHash(push = false) {
  if (ARTIFACT) return;
  clearTimeout(hashTimer);
  const go = () => {
    const h = encodeHash();
    const url = location.pathname + location.search + h;
    if (url === location.pathname + location.search + location.hash) return;
    try { (push ? history.pushState : history.replaceState).call(history, null, '', url || location.pathname); } catch (e) { /* file:// korlát */ }
  };
  push ? go() : (hashTimer = setTimeout(go, 250));
}

/* ==========================================================================
   Nyelvek: szótár (t), fajtaszövegek, nyelvváltó (zászló), élő nyelvváltás
   --------------------------------------------------------------------------
   A szövegek a data/i18n/<nyelv>/ fájlokból jönnek (a build egy csomagba, #pacsi-i18n, ágyazza be őket).
   t('kulcs', { n: 3 })  – szöveg az aktuális nyelven; hiányzó kulcs/fordítás esetén a magyar
   tn('kulcs', n)        – többes szám (kulcs.one / kulcs.other, a nyelv PluralRules-ja szerint)
   tH('kulcs')           – mindig magyar: a statisztika nyelvfüggetlen, egységes értékeket kap
   labels(fn)            – nyelvfüggő táblázatok (címkék): induláskor és minden nyelvváltáskor lefut
   Új nyelv: lásd tools/i18n.py (fejléc) – a kódban nincs teendő.
   ========================================================================== */
const I18N = JSON.parse($('#pacsi-i18n').textContent);
const LANGS = I18N.langs;
const LANG_BY = Object.fromEntries(LANGS.map(l => [l.code, l]));
const DEF_LANG = 'hu';

/* Melyik nyelven indulunk: ?lang=xx (és megjegyezzük) › korábbi választás › magyar. A böngésző nyelvét szándékosan nem
   figyeljük: a magyar a főnyelv, a váltó (zászló) a főoldalon és a nyitó ablakban is ott van. */
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && LANG_BY[q]) { store.set('lang', q); return q; }
  const s = store.get('lang', null);
  return LANG_BY[s] ? s : DEF_LANG;
}
let LANG = pickLang();

const dict = l => I18N.ui[l] || {};
const PR = {};
const plural = l => PR[l] || (PR[l] = new Intl.PluralRules(LANG_BY[l] ? LANG_BY[l].locale : l));
function t(key, p, lang = LANG) {
  let s = dict(lang)[key];
  if (s == null) s = dict(DEF_LANG)[key];
  if (s == null) { console.warn('[i18n] hiányzó kulcs:', key); return key; }
  return p ? s.replace(/\{(\w+)\}/g, (m, k) => (k in p ? p[k] : m)) : s;
}
function tn(key, n, p, lang = LANG) {
  const d = dict(lang), cat = plural(lang).select(n);
  const k = [`${key}.${cat}`, `${key}.other`, key].find(x => d[x] != null);
  if (k) return t(k, { n, ...p }, lang);
  return lang === DEF_LANG ? t(key, { n, ...p }) : tn(key, n, p, DEF_LANG);
}
const tH = (key, p) => t(key, p, DEF_LANG);
const LABEL_FNS = [];
function labels(fn) { LABEL_FNS.push(fn); fn(); }
const flag = id => `<svg class="flag" aria-hidden="true"><use href="#${id}"/></svg>`;
// az aktuális nyelvű oldal címe a megosztásokhoz (a magyar a főcím, a többi ?lang=… paraméterrel)
const siteUrl = () => `${SITE.url}/${LANG === DEF_LANG ? '' : `?lang=${LANG}`}`;

/* ---------- Fajtaszövegek ----------
   A fajtaadat (DATA) magyar; a többi nyelv csak a szövegmezőket írja felül (hiányzó mezőnél marad a magyar).
   b.i0 = a magyar eredeti; b.nev0 / b.orszag0 = a magyar név és származás (statisztika, földrajzi csoportosítás). */
const BREED_TEXT = ['nev', 'orszag', 'tagline', 'leiras', 'mozgas', 'erdekesseg', 'kinekIgen', 'kinekNem', 'egeszseg'];
for (const b of BREEDS) {
  b.i0 = Object.fromEntries(BREED_TEXT.filter(f => b[f] != null).map(f => [f, b[f]]));
  b.nev0 = b.nev; b.orszag0 = b.orszag;
  // keresőnevek: bármelyik nyelven be lehet gépelni (a magyar felületen is megtalálható a „german shepherd”)
  const ovs = Object.values(I18N.breeds).map(o => o[b.id] || {});
  b.names = [b.nev, b.en, ...ovs.map(o => o.nev).filter(Boolean)];
  b.syn = [...(b.syn || []), ...ovs.flatMap(o => o.alias || [])];
}
function applyBreedText() {
  const ov = I18N.breeds[LANG] || {};
  for (const b of BREEDS) {
    const o = ov[b.id] || {};
    for (const f in b.i0) b[f] = o[f] != null ? o[f] : b.i0[f];
  }
}

/* ---------- Statikus (HTML-ben lévő) szövegek ----------
   data-i18n="kulcs" → szöveg · data-i18n-html="kulcs" → HTML · data-i18n-attr="attribútum:kulcs;…" → attribútumok */
function applyStatic(root = document) {
  for (const el of $$('[data-i18n]', root)) el.textContent = t(el.dataset.i18n);
  for (const el of $$('[data-i18n-html]', root)) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of $$('[data-i18n-attr]', root)) {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [a, k] = pair.split(':');
      el.setAttribute(a.trim(), t(k.trim()));
    }
  }
}
function applyLangBase() {
  const l = LANG_BY[LANG];
  document.documentElement.lang = l.locale;
  COLL = new Intl.Collator(l.locale);
  applyBreedText();
  LABEL_FNS.forEach(f => f());
  applyStatic();
  document.title = t('meta.title');
  const set = (sel, v) => { const m = $(sel); if (m) m.setAttribute('content', v); };
  set('meta[name="description"]', t('meta.desc'));
  set('meta[property="og:title"]', t('meta.ogTitle'));
  set('meta[property="og:description"]', t('meta.ogDesc'));
}

/* ---------- Nyelvváltó: zászló gomb a főoldalon + lenyíló menü; a nyitó ablakban és a Tippekben kis zászló-gombok ---------- */
const langPills = () => `<span class="lang-pills" role="group" aria-label="${esc(t('lang.label'))}">${LANGS.map(l =>
  `<button class="lang-pill" data-lang="${l.code}" aria-pressed="${l.code === LANG}">${flag(l.flag)}<span>${esc(l.name)}</span></button>`).join('')}</span>`;
function renderLangUI() {
  const cur = LANG_BY[LANG], btn = $('#langBtn');
  btn.innerHTML = flag(cur.flag);
  btn.setAttribute('aria-label', `${t('lang.label')}: ${cur.name}`);
  btn.title = t('lang.label');
  $('#langMenu').innerHTML = LANGS.map(l =>
    `<button role="menuitemradio" aria-checked="${l.code === LANG}" data-lang="${l.code}">${flag(l.flag)}<span>${esc(l.name)}</span><i class="lm-ck">${ic('check')}</i></button>`).join('');
  $$('.lang-pill').forEach(p => p.setAttribute('aria-pressed', p.dataset.lang === LANG));
}
function openLangMenu(open = $('#langMenu').hidden) {
  const m = $('#langMenu'), b = $('#langBtn');
  m.hidden = !open;
  b.setAttribute('aria-expanded', open);
  if (!open) return;
  const q = b.getBoundingClientRect();
  m.style.top = q.bottom + 8 + 'px';
  m.style.right = Math.max(8, innerWidth - q.right - 4) + 'px';
  const cur = $('[aria-checked="true"]', m);
  cur && cur.focus({ preventScroll: true });
}
$('#langBtn').addEventListener('click', () => openLangMenu());
addEventListener('pointerdown', e => { if (!$('#langMenu').hidden && !e.target.closest('#langMenu, #langBtn')) openLangMenu(false); });
$('#langMenu').addEventListener('keydown', e => {
  const items = $$('button', $('#langMenu')), i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  else if (e.key === 'Escape') { e.stopPropagation(); openLangMenu(false); $('#langBtn').focus(); }
  else if (e.key === 'Tab') openLangMenu(false);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b) return;
  const wasMenu = !!b.closest('#langMenu');
  setLang(b.dataset.lang);
  if (wasMenu) { openLangMenu(false); $('#langBtn').focus({ preventScroll: true }); }
});

/* Nyelvváltás menet közben (újratöltés nélkül): táblák, fajtaszövegek, statikus szövegek, majd a látható részek újrarajzolása */
function setLang(l) {
  if (!LANG_BY[l] || l === LANG) return;
  LANG = l;
  store.set('lang', l);
  stat('nyelv', { nyelv: l });
  applyLangBase();
  relang();
}
function relang() {
  setHover(null);
  B.forEach(o => o.el.setAttribute('aria-label', o.b.nev));
  if (S.quiz) S.quiz.crit = quizCrit(S.quiz.answers);       // a kvíz-szempontok címkéi az új nyelven
  closePanelSheet();
  const fci = $('#fciChips'), fciOpen = fci && !fci.hidden;
  renderFilters();
  if (fciOpen) { $('#fciChips').hidden = false; $('#fciMore').textContent = t('filters.hide'); $('#fciMore').setAttribute('aria-expanded', true); }

/* ==========================================================================
   Névtelen statisztika – Umami a saját szerverünkön (stat.pacsit.hu), sütik és személyes adat nélkül
   --------------------------------------------------------------------------
   Csak a saját domainen él (SITE.stat.hosts), és csak ha van website-azonosító (deploy/site.json).
   Nem küld semmit, ha a látogató kikapcsolta (Tippek → Beállítások), vagy a böngészője „ne kövess”
   (Do Not Track / Global Privacy Control) jelzést ad. Külső szkriptet sem tölt be: az eseményeket
   ugyanabban a formában küldi az Umami /api/send végpontjára, mint a hivatalos követőkód.
   Fejlesztéshez: localStorage 'pacsi:statlog' = true → minden esemény a konzolba is kiíródik.
   ========================================================================== */
const STAT = SITE.stat || {};
const statAllowed = () => !!STAT.website && !ARTIFACT && (STAT.hosts || []).includes(location.hostname) && !store.get('nostat', false)
  && navigator.doNotTrack !== '1' && window.doNotTrack !== '1' && !navigator.globalPrivacyControl;
// csak külső hivatkozó számít (a saját oldalon belüli nem)
const STAT_REF = (() => { try { const r = document.referrer; return r && new URL(r).origin !== location.origin ? r : ''; } catch (e) { return ''; } })();
let statCache = '', statOff = false;

/* „Bevont látogatás”: oldalbetöltésenként egyszer, az első érdemi interakciónál egy külön `bevont` esemény is megy.
   Az Umami szűrői eseményszintűek, és az `inditas` minden látogatáskor tüzel – így a hirdetések minősége (hány kattintásból lett
   bevont látogatás) egyetlen számmal mérhető. */
const STAT_ENGAGE = new Set(['kviz-indul', 'kviz-kesz', 'kartya', 'szuro', 'kereses', 'osszevetes', 'meglepetes', 'megosztas']);
let statEngaged = false;

/* stat() = oldalmegtekintés (az UTM-paraméterek innen látszanak); stat('név', { tulajdonság: érték }) = esemény */
function stat(name, data) {
  if (store.get('statlog', false)) console.info('[stat]', name || 'oldalmegtekintés', data || '');
  const engage = () => { if (name && !statEngaged && STAT_ENGAGE.has(name)) { statEngaged = true; stat('bevont', { elso: name }); } };
  if (statOff || !statAllowed()) return engage();      // nem mérünk, de a fejlesztői napló (statlog) így is mutatja a bevont eseményt
  const payload = {
    website: STAT.website, hostname: location.hostname, url: location.origin + location.pathname + location.search,   // a # utáni rész (szűrők) nem kell
    referrer: STAT_REF, title: document.title, language: navigator.language, screen: `${screen.width}x${screen.height}`, tag: `v${APP_VERSION}`,
  };
  if (name) { payload.name = name.slice(0, 50); if (data) payload.data = data; }
  try {
    fetch(STAT.endpoint, {
      method: 'POST', keepalive: true, credentials: 'omit', body: JSON.stringify({ type: 'event', payload }),
      headers: { 'Content-Type': 'application/json', ...(statCache ? { 'x-umami-cache': statCache } : {}) },
    }).then(r => (r.ok ? r.json() : null)).then(r => { if (r) { statOff = !!r.disabled; statCache = r.cache || statCache; } }).catch(() => {});
  } catch (e) { /* offline vagy tiltott: a statisztika nem fontosabb az appnál */ }
  engage();
}

/* Olvasható szűrőnév a kimutatásokhoz (pl. „Méret: Kicsi”, „Gyerekbarát”) */
/* A statisztika nyelvfüggetlen: az értékek mindig magyarul (tH), akármilyen nyelven használja az app a látogató */
function statFilter(k, v) {
  if (k === 't') return TBY[v] ? tH(`tog.${v}.l`) : v;
  if (k === 'meret') return 'Méret: ' + tH(`size.${v}`);
  if (k === 'energia') return 'Energia: ' + tH(`energy.${v}`);
  if (k === 'szor') return 'Szőr: ' + tH(`coat.${v}`);
  if (k === 'szerep') return 'Szerep: ' + tH(`role.${v}`);
  if (k === 'fci') return `FCI ${v}. ${tH(`fci.${v}`)}`.trim();
  return `${k}: ${v}`;
}

/* Keresés: gépelés után 1,5 mp szünettel egyszer, ékezet nélkül, legfeljebb 40 karakter */
let statQTimer = 0, statQLast = '';
function statSearch(q, hits) {
  const nq = norm(q).trim().replace(/\s+/g, ' ').slice(0, 40);
  if (nq.length < 2 || nq === statQLast) return;   // a kereső bezárása (üres keresés) nem törli a függő eseményt
  clearTimeout(statQTimer);
  statQTimer = setTimeout(() => {
    statQLast = nq;
    stat('kereses', { kifejezes: nq, talalat: hits[0] ? hits[0].b.nev0 : '–', db: hits.length });
  }, 1500);
}

/* Indulás: oldalmegtekintés + hogyan használják (telepített app vagy böngésző, mobil vagy asztal) */
function statStart() {
  stat();
  const app = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  stat('inditas', { mod: app ? 'telepített app' : 'böngésző', eszkoz: S.mobile ? 'mobil' : 'asztali', tema: isDark() ? 'sötét' : 'világos', nyelv: LANG });
}

/* A nyelvfüggő címkék (méret, szőr, szerep…) üres táblákban élnek, amelyeket a labels() tölt fel: induláskor és
   nyelvváltáskor (lásd 12-i18n.js). Az azonosítók nyelvfüggetlenek – ezek vannak a szűrőkben és az URL-ben is. */
const SIZE_IDS = ['toy', 'kicsi', 'kozepes', 'nagy', 'orias'];
const SIZES = [], SIZE_L = {};
const SIZE_I = Object.fromEntries(SIZE_IDS.map((k, i) => [k, i]));
const COAT_IDS = ['rovid', 'kozepes', 'hosszu', 'drot', 'gondor', 'zsinoros', 'szortelen'];
const COATS = [], COAT_L = {};
const ROLE_IDS = ['CSA', 'VAR', 'PAS', 'ORZ', 'VAD', 'SPO', 'MUN', 'ESZ'];
const ROLES = [], ROLE_L = {};
const ROLE_C = { CSA: '#FF6B3D', VAR: '#E86A92', PAS: '#17756E', ORZ: '#5B5BD6', VAD: '#C7772B', SPO: '#2FA3D6', MUN: '#6E7B8B', ESZ: '#5AB0F0' };

const ENERGY = [];                                   // [azonosító, címke, érték]

  ENERGY.length = 0;
  for (const k in ENERGY_V) ENERGY.push([k, t(`energy.${k}`), ENERGY_V[k]]);
  for (let k = 1; k <= 10; k++) FCI[k] = t(`fci.${k}`);
});
const SC = [0, 0, .15, .5, .85, 1];

/* Kapcsoló típusú szűrők (8.1 fejezet). A szövegek a szótárban vannak: tog.<id>.l (név), .sub (alcím), .y / .n (a kártyán: megfelel / nem) */
const TOGGLES = [
  { id: 'gyerek', i: 'kid', c: '#FFD9C2', g: 'eletmod', score: b => SC[b.t.Gy], pass: b => b.t.Gy >= 4 },
  { id: 'lakas', i: 'home', c: '#CFE6FA', g: 'eletmod', score: b => SC[b.t.L], pass: b => b.t.L >= 4 },

  { id: 'legzes', i: 'nose', c: '#DDEDB2', g: 'egeszseg', score: b => [1, .4, 0][b.brachy], pass: b => !b.brachy },

];
labels(() => { for (const g of TOGGLES) Object.assign(g, { l: t(`tog.${g.id}.l`), sub: t(`tog.${g.id}.sub`), why: [t(`tog.${g.id}.y`), t(`tog.${g.id}.n`)] }); });
const TBY = Object.fromEntries(TOGGLES.map(t => [t.id, t]));

const setCrit = (key, set, labels, adj) => ({
  key, w: 1,
  label: [...set].map(v => labels[v]).join(', '),
  score: b => {
    const vals = key === 'fci' ? [b.fci] : b[key];
    if (vals.some(v => set.has(v))) return 1;
    if (adj && vals.some(v => [...set].some(s => Math.abs(SIZE_I[s] - SIZE_I[v]) === 1))) return .5;
    return 0;
  },
  pass: b => (key === 'fci' ? [b.fci] : b[key]).some(v => set.has(v)),
  why: [t(`why.${key}.y`), t(`why.${key}.n`)],
});
const energyCrit = (target, w = 1, src) => ({
  key: src ? 'q-E' : 'energia', w, src, label: ENERGY.find(e => e[2] === target)?.[1] || t('energy.label'),
  score: b => clamp(1 - Math.abs(b.t.E - target) / 3, 0, 1),
  pass: b => target < 2 ? b.t.E <= 2 : target > 4 ? b.t.E >= 4 : b.t.E === 3,
  why: [t('why.energy.y'), b => b.t.E > target ? t('why.energy.more') : t('why.energy.less')],
});

/* Kritériumlista a szűrőállapotból (+ kvíz) */
function buildCrit(f = S.f, withQuiz = true) {
  const out = [];
  if (f.meret.size) out.push({ ...setCrit('meret', f.meret, SIZE_L, true), label: t('crit.size', { v: [...f.meret].map(v => SIZE_L[v]).join(', ') }) });
  if (f.szor.size) out.push({ ...setCrit('szor', f.szor, COAT_L), label: t('crit.coat', { v: [...f.szor].map(v => COAT_L[v]).join(', ') }) });
  if (f.szerep.size) out.push({ ...setCrit('szerep', f.szerep, ROLE_L), label: [...f.szerep].map(v => ROLE_L[v]).join(', ') });
  if (f.fci.size) out.push({ ...setCrit('fci', f.fci, Object.fromEntries(Object.keys(FCI).map(k => [k, 'FCI ' + k]))), label: t('crit.fci', { v: [...f.fci].sort((a, b) => a - b).join(', ') }) });
  if (f.energia) out.push(energyCrit(ENERGY.find(e => e[0] === f.energia)[2]));
  for (const t of TOGGLES) if (f.t.has(t.id)) out.push({ key: t.id, label: t.l, w: 1, score: t.score, pass: t.pass, why: t.why });
  if (withQuiz && S.quiz) out.push(...S.quiz.crit);
  return out;
}

/* Kiértékelés: b.m = illeszkedés 0–1 (null, ha nincs szűrő), b.ok = minden feltétel teljesül */
function evaluate() {
  const crit = S.crit = buildCrit();
  for (const b of BREEDS) {
    if (!crit.length) { b.m = null; b.ok = true; b.np = 0; continue; }
    let s = 0, w = 0, ok = true, hard = false, np = 0;
    for (const c of crit) {
      const v = c.score(b), p = c.pass(b);
      s += v * c.w; w += c.w;
      if (c.src === 'quiz') { if (c.hard && !p) { hard = true; ok = false; } }
      else if (!p) ok = false;
      if (p && c.src !== 'quiz') np++;
    }
    b.m = hard ? (s / w) * .25 : s / w;
    b.ok = ok;
    b.np = np;
  }
  return crit;
}
const filterCount = () => S.crit.filter(c => c.src !== 'quiz').length;
const fits = b => b.m == null || (b.ok && b.m >= .6);

/* Élő előnézet: hány fajta felelne meg, ha ezt a szűrőt is bekapcsolnád */
function previewCount(mut) {
  const f = { meret: new Set(S.f.meret), szor: new Set(S.f.szor), szerep: new Set(S.f.szerep), fci: new Set(S.f.fci), energia: S.f.energia, t: new Set(S.f.t) };
  mut(f);
  const crit = buildCrit(f, false);
  return BREEDS.filter(b => crit.every(c => c.pass(b))).length;
}

/* Magyarázat a kártyához: mi teljesül, mi nem */
function reasons(b) {
  return S.crit.map(c => {
    const v = c.score(b);
    const cls = c.pass(b) ? 'y' : v >= .4 ? 'h' : 'n';
    let text = cls === 'y' ? c.why[0] : (typeof c.why[1] === 'function' ? c.why[1](b) : c.why[1]);
    if (c.key === 'meret' && cls === 'y') text = t('crit.size', { v: b.meret.map(v => SIZE_L[v]).join('–') });
    return { cls, text, w: c.w };
  }).sort((a, b) => ({ y: 0, h: 1, n: 2 }[a.cls] - { y: 0, h: 1, n: 2 }[b.cls]) || b.w - a.w);
}

function layoutMap() {
  const px = S.mobile ? 26 : 70, py = S.mobile ? 20 : 34;

    const b = o.b;
    const w = (b.suly[0] + b.suly[1]) / 2;
    const fx = clamp((Math.log(w) - lw) / (hw - lw), 0, 1);
    const jit = ((b.n * 37) % 11) / 10 - .5;
    const fy = clamp((5 - (b.t.E + jit * .7)) / 4.7 + .04, 0, 1);

  }
  // Sok hasonló (nagy, energikus) fajta célpontja szinte egybeesik: a rugó egy pontba húzná őket, az
  // ütközés széttolná – ettől rángatóztak kis kijelzőn. Ezért a célpontokat előre szétterítjük
  // („méhraj”), a fizikával azonos távolsággal: nyugalomban így nincs mi ellen dolgozniuk.

    for (let i = 0; i < vis.length; i++) {

      for (let j = i + 1; j < vis.length; j++) {
        const c = vis[j], min = (a.nrt + c.nrt) * 1.09 + gap;

        const d2 = dx * dx + dy * dy;

        const push = (min - d) / 2 / d;

        c.mx += dx * push; c.my += dy * push;

    o.r = o.rt * .75;

    bus.emit('cloud', false);
  } else {
    o.st = 'in';
    o.r = Math.max(o.r * .35, 4);
  }
}

/* ---------- Fizika (fix 60 Hz-es lépés) ---------- */
let stepN = 0;
function anchor(o) {
  if (S.view === 'csoport' && o.grp) return [o.grp.x, o.grp.y, .024, .024];
  if (S.view === 'terkep') return [o.mx, o.my, .03, .03];      // lágyabb rugó: nyugodtabb térkép
  // ellipszis alakú vonzás: a felhő a színpad arányát veszi fel (kx = ky · (h/w)²)
  const m = o.b.m, asp = clamp(LR.h / LR.w, .3, 1.6), a2 = asp * asp;
  if (m == null) return [LR.cx, LR.cy, .0024 * a2, .0024];
  if (o.tier === 'back') {
    // a gyenge találatok glóriát alkotnak a felhő körül (ellipszis mentén)
    const dx = (o.x - LR.cx) / LR.w, dy = (o.y - LR.cy) / LR.h, d = Math.hypot(dx, dy) || 1;
    return [LR.cx + dx / d * LR.w * .43, LR.cy + dy / d * LR.h * .43, .004, .004];
  }
  // Csak találatok módban nem kell a jobbakat középre rendezni (az egyezést a méret mutatja): a gyengébb
  // vonzás miatt a sűrű közép nem kavarog (az erős húzás és az ütközés egymás ellen dolgozott)
  const k = (.0016 + .0075 * m) * (modeOf() === 'strict' ? .35 : 1);
  return [LR.cx, LR.cy, k * a2, k];
}
function step() {
  stepN++;
  const act = [];
  for (const o of B) if (o.st === 'in' || o.st === 'drop') act.push(o);
  const rm = RM();
  for (const o of act) {
    const target = o.rt * o.hk;
    o.rv += (target - o.r) * (rm ? .5 : .16);
    o.rv *= rm ? .2 : .7;
    o.r += o.rv;
    if (o.r < .5) o.r = .5;
    o.jv += -o.jy * .2; o.jv *= .78; o.jy += o.jv;
    const [ax, ay, kx, ky] = anchor(o);
    o.vx += (ax - o.x) * kx;
    o.vy += (ay - o.y) * ky;
    if (o.st === 'drop') o.vy += .85;
    if (mouse.in && !S.mobile && !rm) {
      const dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy) || 1, R = o.r + 70;
      if (d < R) { const f = (R - d) / R * .9; o.vx += dx / d * f; o.vy += dy / d * f; }
    }
    // a megkavart buborékok egy ideig lazábban csillapodnak: tovább siklanak, mint a vízen
    const damp = o.st === 'drop' ? .99 : stepN - o.stirN < 40 ? .87 : .8;
    o.vx *= damp; o.vy *= damp;
    o.x += o.vx; o.y += o.vy;
  }
  if (stir.on && !rm) stirForce(act);
  const gap = S.mobile ? 4 : 6;
  // Az ütközés csak a helyet tolja szét; a sebességből ki kell venni a szétválasztással ellentétes részt,
  // különben a befelé tartó lendület minden lépésben újra összenyomja a sűrű halmazt (kavargó közép).
  for (const o of act) { o.cx0 = o.x; o.cy0 = o.y; }
  for (let it = 0; it < 2; it++) {
    for (let i = 0; i < act.length; i++) {
      const a = act[i];
      for (let j = i + 1; j < act.length; j++) {
        const c = act[j];
        const min = a.r * 1.09 + c.r * 1.09 + gap;
        const dx = c.x - a.x, dy = c.y - a.y;
        if (dx > min || dx < -min || dy > min || dy < -min) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        const d = Math.sqrt(d2) || .01, ov = (min - d) / d;
        const wa = c.r * c.r / (a.r * a.r + c.r * c.r), wc = 1 - wa;
        a.x -= dx * ov * wa * .5; a.y -= dy * ov * wa * .5;
        c.x += dx * ov * wc * .5; c.y += dy * ov * wc * .5;
      }
    }
  }
  // (csak az egymással ütközés számít; a frissen megkavart buborékokra nem – azok az ujj nyomán átszántanak
  // a felhőn, szétnyitva azt; a szél és a HUD-akadályok saját visszapattanást kezelnek)
  for (const o of act) if (stepN - o.stirN > 40) { o.vx += o.x - o.cx0; o.vy += o.y - o.cy0; }
  for (const o of act) {
    const R = o.r * 1.09;
    for (const q of OBS) {
      if (o.x + R < q.l || o.x - R > q.r || o.y + R < q.t || o.y - R > q.b) continue;
      const nx = clamp(o.x, q.l, q.r), ny = clamp(o.y, q.t, q.b);
      let dx = o.x - nx, dy = o.y - ny, d = Math.hypot(dx, dy);
      if (d === 0) { o.y = q.b + R; o.vy = Math.abs(o.vy); continue; }
      if (d < R) { o.x += dx / d * (R - d); o.y += dy / d * (R - d); }
    }
    const minX = LR.l + R, maxX = Math.max(minX, LR.r - R);
    if (o.x < minX) { o.x = minX; o.vx *= -.3; } else if (o.x > maxX) { o.x = maxX; o.vx *= -.3; }
    const maxY = Math.max(LR.t + R, LR.b - R);
    if (o.st === 'drop') {
      if (o.y > LR.t + R) o.st = 'in';
      if (o.y > maxY) { o.y = maxY; o.vy *= -.45; o.st = 'in'; }
    } else if (o.y < LR.t + R) { o.y = LR.t + R; o.vy *= -.3; }
    else if (o.y > maxY) { o.y = maxY; o.vy *= -.3; }
  }
  // Adaptív kitöltés: ha nyugalmi állapotban is sok az átfedés, kicsit kisebb buborékok
  // (animáció közben – hullám, kirepülés, növekedés – nem mérünk, mert az átfedés ott természetes)
  const settled = () => !stir.on && act.every(o => !o.pend && Math.abs(o.rv) < .05 && Math.abs(o.vx) + Math.abs(o.vy) < .6) && !B.some(o => o.st === 'fly' || o.st === 'drop');
  if (stepN % 45 === 0 && S.view !== 'terkep' && settled()) {
    let ov = 0, n = 0;
    for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
      const a = act[i], c = act[j], d = Math.hypot(c.x - a.x, c.y - a.y), min = (a.r + c.r) * 1.09;
      if (d < min) { ov += min - d; n++; }
    }
    const before = fill;
    if (act.length && ov / act.length > 1.6) fill = Math.max(.62, fill * .97);
    else if (ov / Math.max(act.length, 1) < .5 && fill < 1) fill = Math.min(1, fill * 1.04);
    if (fill !== before) { computeTargets(); for (const o of B) if (!o.pend) o.rt = o.nrt; }
  }
}

/* ---------- Ujjal kavarás (érintőképernyő) ----------
   Ha az ujj a felhőn húzódik, a buborékok kitérnek előle és a mozgás irányába sodródnak – mint a vízbe
   húzott kéz nyomán. A koppintás és a hosszú nyomás változatlan: a kavarás néhány pixelnyi elmozdulás
   után indul. Az ujj útját szakaszként kezeljük, így gyors húzásnál sem ugrik át buborékokat. */
const stir = { id: null, on: false, x: 0, y: 0, px: 0, py: 0, sx: 0, sy: 0, trail: 0, block: 0 };
const RIPPLES = [];
function ripple(x, y) {
  if (RIPPLES.length >= 12) RIPPLES.shift();
  RIPPLES.push({ x, y, t0: now() });
}
function stirForce(act) {
  const ax = stir.px, ay = stir.py, bx = stir.x, by = stir.y;
  stir.px = bx; stir.py = by;
  const mx = bx - ax, my = by - ay, len2 = mx * mx + my * my;
  const sp = Math.min(Math.sqrt(len2), 40);          // ujjsebesség, px / lépés
  const reach = S.mobile ? 62 : 76;                   // hatótáv a buborék szélétől
  for (const o of act) {
    const u = len2 ? clamp(((o.x - ax) * mx + (o.y - ay) * my) / len2, 0, 1) : 1;
    let dx = o.x - (ax + mx * u), dy = o.y - (ay + my * u);
    const d = Math.hypot(dx, dy) || .01, R = o.r + reach;
    if (d >= R) continue;
    const f = 1 - d / R, f2 = f * f;
    dx /= d; dy /= d;
    const push = f2 * (1.5 + sp * .13);               // kitérés az ujj elől (gyorsabb húzásnál erősebb)
    o.vx += dx * push + mx * f2 * .24;                // + sodrás az ujj irányába
    o.vy += dy * push + my * f2 * .24;
    const v = Math.hypot(o.vx, o.vy);
    if (v > 24) { o.vx *= 24 / v; o.vy *= 24 / v; }
    o.stirN = stepN;
  }
  stir.trail += sp;
  if (stir.trail > 38) { stir.trail = 0; ripple(bx, by); }
}

/* ---------- Rajzolás ---------- */
function render(t) {
  const rm = RM();
  if (!S.mobile && !rm) { mouse.px += (mouse.tx - mouse.px) * .06; mouse.py += (mouse.ty - mouse.py) * .06; }
  for (const o of B) {
    if (o.st === 'gone') continue;
    fitBase(o);
    const R0 = o.base;
    let x = o.x, y = o.y + o.jy, s = o.r / R0, rot = 0, op = 1;
    // simított mélységi átlátszóság (keresésnél a nem találatok erősen halványak)
    o.opC += ((o.dim ? .14 : o.opT) - o.opC) * (rm ? 1 : .12);
    if (o.st === 'fly') {
      const f = o.fly, p = (t - f.t0) / f.dur;
      if (p >= 1) {
        o.st = 'gone'; o.el.classList.add('gone'); o.el.style.opacity = ''; o.op = 1;
        flownShown++; bus.emit('cloud', true);
        spark(SR.left + f.tx, SR.top + f.ty, 4, { speed: 2.2, size: 3 });
        continue;
      }
      const a = .16;
      if (p < a) { const u = p / a; s = f.r0 / R0 * (1 - .12 * Math.sin(u * Math.PI / 2)); x = f.x0; y = f.y0 + Math.sin(u * Math.PI) * 3; }
      else {
        const u = (p - a) / (1 - a), e = u * u * (1.7 - .7 * u);
        const cx = f.x0 + (f.tx - f.x0) * .15, cy = Math.min(f.y0, f.ty) - 120;
        x = (1 - e) * (1 - e) * f.x0 + 2 * (1 - e) * e * cx + e * e * f.tx;
        y = (1 - e) * (1 - e) * f.y0 + 2 * (1 - e) * e * cy + e * e * f.ty;
        s = f.r0 / R0 * (.88 - .62 * e);
        rot = f.rot * e;
        op = u > .7 ? 1 - (u - .7) / .3 : 1;
        // szikranyom – korlátozott részecskeszámmal, hogy sok kirepülőnél se lassuljon
        if (FX.length < 260 && Math.random() < .4) spark(SR.left + x + rand(-4, 4), SR.top + y + f.r0 * .6, 1, { trail: true });
      }
    } else if (o.st === 'sink') {
      const p = clamp((t - o.sinkT) / 480, 0, 1);
      s *= 1 - .6 * p; y += 22 * p; op = 1 - p;
      if (p >= 1) { o.st = 'gone'; o.el.classList.add('gone'); o.el.style.opacity = ''; o.op = 1; continue; }
    } else if (!rm) {
      x += Math.sin(t * .0008 + o.ph) * 2.2;
      y += Math.cos(t * .00093 + o.ph * 1.7) * 2.2;
      if (!S.mobile) { const d = DEPTH[o.tier] || 0; x += mouse.px * d * 12; y += mouse.py * d * 10; }
    }
    op *= o.opC;
    o.el.style.transform = `translate3d(${(x - R0).toFixed(1)}px,${(y - R0).toFixed(1)}px,0) scale(${Math.max(s, .002).toFixed(4)})${rot ? ` rotate(${rot.toFixed(1)}deg)` : ''}`;
    if (Math.abs(op - o.op) > .004) { o.el.style.opacity = op > .995 ? '' : op.toFixed(3); o.op = op; }
    o.rx = x; o.ry = y; o.rr = s * R0;
  }
  if (hovered) placeTip(hovered);
  drawUnder(t);
}

/* Lista nézetbe váltáskor a vászon azonnal üres legyen: a felhő ott megáll, és a félig
   átlátszó („kiesett”) listakártyák mögött különben átlátszana az utolsó képkocka. */
function clearUnder() {
  ux.setTransform(1, 0, 0, 1, 0, 0);
  ux.clearRect(0, 0, underC.width, underC.height);
  for (const o of B) { o.ringV = 0; o.glowV = 0; }
  PULSES.length = 0;
  RIPPLES.length = 0;
  underDirty = false;
}

/* ---------- Alsó vászon: illeszkedési gyűrű, glória, pulzus ----------
   Mind a 124 buborék díszítése egyetlen vásznon rajzolódik; a buborékrétegeket így sosem kell
   újrarajzolni, csak mozgatni (transform) és halványítani (opacity). */
function drawUnder(t) {
  const active = S.crit.length > 0 && S.view !== 'lista';
  const rm = RM();
  let work = PULSES.length > 0;
  if (!work) for (const o of B) if (o.ringV > .004 || o.glowV > .01 || (active && o.ringT > 0 && o.st !== 'gone')) { work = true; break; }
  if (!work && !underDirty) return;
  ux.setTransform(underDpr, 0, 0, underDpr, 0, 0);
  ux.clearRect(0, 0, SR.width, SR.height);
  underDirty = work;
  const [cr, cg, cb] = ringRGB;
  const col = a => `rgba(${cr},${cg},${cb},${a})`;
  ux.lineCap = 'round';
  for (const o of B) {
    const live = o.st === 'in' || o.st === 'drop' || o.st === 'sink';
    o.ringV += ((active && live ? o.ringT : 0) - o.ringV) * (rm ? 1 : .07);
    o.glowV += ((active && live && o.tier === 'top' ? 1 : 0) - o.glowV) * (rm ? 1 : .06);
    if (!live || o.rr < 2) continue;
    const a = o.op;
    if (o.glowV > .01 && a > .05) {
      const br = rm ? 0 : (1 - Math.cos(t * .0021 + o.ph)) / 2;       // 3 mp-es „lélegzés”
      // a glória kilógása kis buborékoknál arányos, nagyoknál legfeljebb ~22 px (ne folyjanak össze)
      const R = o.rr + Math.min(o.rr * .435, 22) * (1 + .3 * br);
      const g = ux.createRadialGradient(o.rx, o.ry, o.rr * .6, o.rx, o.ry, R);
      g.addColorStop(0, col(.42 * o.glowV * a * (1 - .35 * br)));
      g.addColorStop(1, col(0));
      ux.fillStyle = g;
      ux.beginPath(); ux.arc(o.rx, o.ry, R, 0, 6.2832); ux.fill();
    }
    if (o.ringV > .004 && a > .05) {
      ux.globalAlpha = a;
      ux.strokeStyle = col(1);
      const lw = Math.min(o.rr * .1, 6);                              // nagy buborékon se legyen vaskos
      ux.lineWidth = lw;
      ux.beginPath();
      ux.arc(o.rx, o.ry, o.rr * 1.1 + lw / 2 + 1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(o.ringV, 1));
      ux.stroke();
      ux.globalAlpha = 1;
    }
  }
  // pulzusgyűrű: 2 × 1,25 mp, tágul és elhalványul
  for (let i = PULSES.length - 1; i >= 0; i--) {
    const p = PULSES[i], o = p.o, el = t - p.t0;
    if (el > 2500 || o.st === 'gone') { PULSES.splice(i, 1); continue; }
    const u = (el % 1250) / 1250, e = 1 - Math.pow(1 - u, 3), sc = 1 + .75 * e;
    ux.strokeStyle = col(.9 * (1 - e) * o.op);
    ux.lineWidth = o.rr * .075 * sc;
    ux.beginPath(); ux.arc(o.rx, o.ry, o.rr * 1.04 * sc, 0, 6.2832); ux.stroke();
  }
}

/* ---------- Tooltip (név + egyezés) ---------- */
function setHover(o) {
  clearTimeout(hoverTimer);
  if (hovered === o) return;
  if (hovered) hovered.hk = 1;
  hovered = o;
  if (!o) { tipEl.classList.remove('on'); return; }
  o.hk = S.mobile ? 1 : 1.18;
  predecode(o.b.id);
  const b = o.b, k = filterCount();
  let badge = '';
  if (S.crit.length) {
    badge = k && !S.quiz
      ? `<span class="m ${b.np === k ? '' : 'part'}">${b.np}/${k}</span>`
      : `<span class="m ${b.ok ? '' : 'part'}">${Math.round(b.m * 100)}%</span>`;
  }
  tipEl.innerHTML = `<span class="tip-in">${b.hu ? ic('flag', 'ic hu') : ''}${esc(b.nev)}${badge}</span>`;
  tipW = tipEl.firstChild.offsetWidth || 180;
  placeTip(o);
  requestAnimationFrame(() => tipEl.classList.add('on'));
}
function placeTip(o) {
  // transformmal pozicionálunk (nem left/top), így képkockánként nincs elrendezés-számolás
  // a címke tényleges szélessége szerint marad a színpadon belül (hosszú fajtanévnél se lógjon ki)
  const R = o.r * 1.1, hw = tipW / 2 + 8;
  let y = o.ry + R + 10;
  if (y + 44 > SR.height) y = o.ry - R - 52;
  tipEl.style.transform = `translate3d(${clamp(o.rx, hw, Math.max(hw, SR.width - hw)).toFixed(1)}px,${y.toFixed(1)}px,0)`;
}

/* ---------- Részecskék (vászon) ---------- */
const fxc = $('#fx'), fxx = fxc.getContext('2d');
let FX = [], fxDpr = 1;
function fxResize() {
  // a részecskék apró pöttyök: 1× felbontás bőven elég, és negyedannyi pixelt kell törölni képkockánként
  fxDpr = 1;
  fxc.width = innerWidth * fxDpr; fxc.height = innerHeight * fxDpr;
  fxx.setTransform(fxDpr, 0, 0, fxDpr, 0, 0);
}
function spark(x, y, n, o = {}) {
  if (RM()) return;
  n = Math.min(n, 420 - FX.length);
  for (let i = 0; i < n; i++) {
    const a = o.trail ? rand(Math.PI * .3, Math.PI * .7) : rand(0, Math.PI * 2);
    const sp = o.trail ? rand(.3, 1.2) : rand(1, o.speed || 4);
    FX.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.g ?? (o.trail ? .02 : .12),
      life: 0, max: o.trail ? rand(26, 44) : rand(34, 60), size: o.size ? rand(o.size * .6, o.size) : rand(2, 4.5),
      c: o.color || FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)], heart: !!o.heart,
    });
  }
}
function drawHeart(x, y, s) {
  fxx.beginPath();
  fxx.moveTo(x, y + s * .35);
  fxx.bezierCurveTo(x - s, y - s * .45, x - s * .45, y - s * 1.1, x, y - s * .45);
  fxx.bezierCurveTo(x + s * .45, y - s * 1.1, x + s, y - s * .45, x, y + s * .35);
  fxx.fill();
}
function fxStep() {
  if (!FX.length && !RIPPLES.length) { if (fxc.dataset.dirty) { fxx.clearRect(0, 0, innerWidth, innerHeight); delete fxc.dataset.dirty; } return; }
  fxc.dataset.dirty = 1;
  fxx.clearRect(0, 0, innerWidth, innerHeight);
  // kavarás hullámai: az ujj nyomán táguló, halványuló körök – a buborékok fölött, hogy a sűrű felhőben is látsszanak
  const tn = now(), [cr, cg, cb] = ringRGB;
  for (let i = RIPPLES.length - 1; i >= 0; i--) {
    const q = RIPPLES[i], u = (tn - q.t0) / 900;
    if (u >= 1) { RIPPLES.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - Math.max(u, 0), 3);
    fxx.strokeStyle = `rgba(${cr},${cg},${cb},${(.62 * (1 - u)).toFixed(3)})`;
    fxx.lineWidth = 3.6 * (1 - u) + 1;
    fxx.beginPath(); fxx.arc(SR.left + q.x, SR.top + q.y, 12 + 70 * e, 0, 6.2832); fxx.stroke();
  }
  FX = FX.filter(p => {
    p.life++;
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy;
    const a = 1 - p.life / p.max;
    if (a <= 0) return false;
    fxx.globalAlpha = a;
    fxx.fillStyle = p.c;
    if (p.heart) drawHeart(p.x, p.y, p.size * 2.2);
    else { fxx.beginPath(); fxx.arc(p.x, p.y, p.size * (.5 + a * .5), 0, 6.283); fxx.fill(); }
    return true;
  });
  fxx.globalAlpha = 1;
}

/* ---------- Kereső-reflektor ---------- */
// név (bármelyik nyelven), angol név vagy ismert másik név szerint, ékezet nélkül (nq: norm-olt keresőszó)
const nameHit = (b, nq) => b.names.some(n => norm(n).includes(nq)) || (b.syn || []).some(s => norm(s).includes(nq));
function applySearch(q) {
  const changed = q !== S.q;
  S.q = q;
  const nq = norm(q.trim());
  const hits = [], all = [];
  for (const o of B) {
    const hit = !!nq && nameHit(o.b, nq);
    if (o.dim !== (!!nq && !hit)) { o.dim = !!nq && !hit; o.el.classList.toggle('dim', o.dim); }
    if (o.el.classList.contains('spot') !== hit) o.el.classList.toggle('spot', hit);
    if (hit) { all.push(o); if (o.vis) hits.push(o); }
  }
  statSearch(q, all);   // a statisztikában a szűrőktől független találat számít (mire keresett)
  // Lista nézetben nem látszanak a buborékok: ott a kereső magát a listát szűri, és az Enter a lista első találatát nyitja meg
  if (S.view === 'lista') {
    if (changed) renderList({ typing: true });
    return nq ? listBreeds().map(b => OB_ID.get(b.id)) : [];
  }
  if (hits.length === 1 && !RM()) { hits[0].jv = -6; }
  return hits;
}

/* ---------- Meglepetés ---------- */
function surprise() {
  const pool = B.filter(o => o.vis && o.st === 'in' && (o.b.m == null || o.b.m >= .6));
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  stat('meglepetes', { fajta: pick.b.nev0 });
  if (!RM()) for (const o of B) if (o.st === 'in') { o.vx += rand(-10, 10); o.vy += rand(-10, 10); }
  haptic(20);
  setTimeout(() => { pulse(pick); pick.jv = -9; }, 380);
  setTimeout(() => openCard(pick.b.id), 950);
}

/* ---------- Intró: spirálban „kipattanó” felhő ---------- */
function intro() {
  measure();
  const ga = Math.PI * (3 - Math.sqrt(5));
  const order = [...B].sort((a, c) => (c.b.nep - a.b.nep) || a.b.n - c.b.n);
  order.forEach((o, i) => {
    o.introIdx = i;
    const rr = Math.sqrt(i) * 5;
    o.x = LR.cx + Math.cos(i * ga) * rr * (LR.w / LR.h > 1 ? 1.4 : 1);
    o.y = LR.cy + Math.sin(i * ga) * rr;
    o.r = .5; o.rt = 0;
  });
  refresh(null, { intro: true });
  if (!RM()) setTimeout(() => spark(SR.left + LR.cx, SR.top + LR.cy, 36, { speed: 7, g: .08 }), 250);
}

/* ---------- Fő ciklus ---------- */
let lastT = now(), acc = 0;
let paused = false;
const bgEl = $('.bg');
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(t - lastT, 100);
  lastT = t;
  // Ha a fajtakártya (vagy mobilon egy takaró lap) nyitva van, a felhő megáll: nem fut a fizika,
  // nem mozognak a rétegek, így a háttér-elmosásnak sem kell képkockánként újraszámolnia.
  const p = !cardEl.hidden || (S.mobile && !scrimEl.hidden) || S.view === 'lista';
  if (p !== paused) { paused = p; bgEl.classList.toggle('paused', p); }   // csak a háttér: ne az egész dokumentum stílusa számolódjon újra
  if (!paused) {
    acc += dt;
    for (const o of B) if (o.pend && t >= o.pend.at) commit(o, o.pend);
    // legfeljebb 3 lépés képkockánként: lassú gépen inkább lassul a mozgás, mint hogy
    // a felgyűlt lépések miatt még lassabb legyen a következő képkocka
    let n = 0;
    while (acc >= 16.67 && n < 3) { step(); acc -= 16.67; n++; }
    if (n === 3) acc = 0;
    render(t);
  } else {
    for (const o of B) if (o.pend && t >= o.pend.at) commit(o, o.pend);
  }
  fxStep();
}

  if (dirs[e.key]) {

let toastTimer = 0;

// 'auto' módban a gyökérelem data-theme bélyegéhez nem nyúlunk (azt a befogadó felület is beállíthatja)
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : mqDark.matches; };
function applyTheme() {
  const r = document.documentElement;
  if (S.theme !== 'auto') r.dataset.theme = S.theme;
  const dark = isDark();
  $('#themeBtn use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  // a media-feltételt elhagyjuk: kézi témánál is a látható téma színe kerüljön a státuszsávba
  $$('meta[name="theme-color"]').forEach(m => { m.removeAttribute('media'); m.setAttribute('content', dark ? '#14121A' : '#FBF6EE'); });
}
function toggleTheme(e) {
  S.theme = isDark() ? 'light' : 'dark';
  store.set('theme', S.theme);
  if (!document.startViewTransition || RM()) return applyTheme();
  const x = e && e.clientX ? e.clientX : innerWidth - 40, y = e && e.clientY ? e.clientY : 40;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(applyTheme);
  vt.ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
    { duration: 650, easing: 'cubic-bezier(.22,1,.36,1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
}
