function animateCardIn(after = 0) {
  // Nyitáskor (after) a kör alakú kinyílás végén indulnak: közben ne kelljen képkockánként újrarajzolni a kártyát.
  // A számláló csak valódi változáskor ír – korábban az indulása előtt is minden képkockában „0%”-ot írt,
  // ami a teljes kártya újrarendezését váltotta ki a kinyílás alatt (ettől akadt meg telefonon).
  const ring = $('.mring .fg', cardEl), cnt = $('.mring b', cardEl);
  if (ring) setTimeout(() => requestAnimationFrame(() => { ring.style.strokeDashoffset = 100 - ring.dataset.pct; }), after);
  if (cnt) {
    const target = +cnt.dataset.count, t0 = now() + 250 + after;
    const tick = t => {
      if (!cnt.isConnected) return;
      const p = clamp((t - t0) / 1000, 0, 1), e = 1 - Math.pow(1 - p, 3), v = Math.round(target * e) + '%';
      if (cnt.textContent !== v) cnt.textContent = v;
      if (p < 1) requestAnimationFrame(tick);
    };
    setTimeout(() => requestAnimationFrame(tick), 250 + after);
  }
}

function openCard(id, { push = true, dir = 0 } = {}) {
  const b = BY_ID.get(id);
  if (!b) return;
  setHover(null);
  const already = !cardEl.hidden;
  if (S.card !== id) stat('kartya', { fajta: b.nev0 });   // melyik fajták érdeklik az embereket
  S.card = id;
  cardOrder = orderList();
  if (!cardOrder.includes(id)) cardOrder.unshift(id);
  cardEl.innerHTML = cardHTML(b);
  cardEl.style.setProperty('--bgc', b.bg);
  cardEl.classList.toggle('morph', !already && S.mobile && !RM());   // mobil kinyílás: lásd .card.morph a CSS-ben
  if (already) {
    cardEl.classList.remove('swap', 'left');
    void cardEl.offsetWidth;
    cardEl.classList.add('swap');
    if (dir < 0) cardEl.classList.add('left');
    animateCardIn();
  } else {
    scrimEl.hidden = false; scrimEl.classList.remove('out');
    cardEl.hidden = false;
    $('#cardPrev').hidden = $('#cardNext').hidden = S.mobile;
    morphIn(OB_ID.get(id));
    animateCardIn(RM() ? 0 : 350);
    lastFocus = document.activeElement;
    setTimeout(() => { const c = $('.close', cardEl); c && c.focus({ preventScroll: true }); }, 60);
  }
  if (push && !already) syncHash(true); else syncHash();
}
let lastFocus = null;

/* Kör alakú vágás (clip-path) képkockánként, requestAnimationFrame-mel. A böngészőre bízott (WAAPI)
   clip-path animációt az Android Chrome a grafikus szálon futtathatja, és ott telefonon néha rossz helyről
   indult (bal felülről), vagy a kártya jobb felső sarka – a bezáró ✕ – levágva maradt. Így a kör mindig a
   buborékból indul, az órája az első kirajzolt képkockától jár, és a végén a vágás biztosan lekerül. */
let clipRaf = 0, clipR = 0;
const easeOut = p => 1 - Math.pow(1 - p, 4);   // ≈ cubic-bezier(.3,.9,.25,1)
const easeIn = p => p * p * p;                  // ≈ cubic-bezier(.55,0,.8,.4)
function clipCircle(el, x, y, r0, r1, dur, ease, { op1 = 1, done } = {}) {
  cancelAnimationFrame(clipRaf);
  const at = `px at ${x.toFixed(1)}px ${y.toFixed(1)}px)`;
  el.style.clipPath = `circle(${r0.toFixed(1)}${at}`;
  clipR = r0;
  let t0 = 0;
  const tick = t => {
    if (!t0) t0 = t;
    const p = Math.min(1, (t - t0) / dur), e = ease(p);
    clipR = r0 + (r1 - r0) * e;
    el.style.clipPath = `circle(${clipR.toFixed(1)}${at}`;
    if (op1 !== 1) el.style.opacity = (1 + (op1 - 1) * e).toFixed(3);
    if (p < 1) { clipRaf = requestAnimationFrame(tick); return; }
    el.style.clipPath = ''; el.style.opacity = ''; clipRaf = 0;
    if (done) done();
  };
  clipRaf = requestAnimationFrame(tick);
}

/* Buborék → kártya: FLIP a portrén + kör alakú kinyílás */
function morphIn(o) {
  cancelAnimationFrame(clipRaf); clipRaf = 0;
  cardEl.style.clipPath = ''; cardEl.style.opacity = '';
  cardEl.style.transition = '';
  if (RM() || !o || o.st === 'gone' || S.view === 'lista') {
    const base = S.mobile ? '' : 'translate(-50%,-50%) ';
    cardEl.animate([{ opacity: 0, transform: base + 'translateY(40px)' }, { opacity: 1, transform: base || 'none' }], { duration: 320, easing: 'cubic-bezier(.22,1,.36,1)' });
    return;
  }
  // mobilon a hajtás alatti részek csak a kinyílás végén rajzolódnak ki (lásd .card.lazy a CSS-ben)
  if (S.mobile) cardEl.classList.add('lazy');
  const cq = cardEl.getBoundingClientRect();
  const bx = SR.left + o.rx - cq.left, by = SR.top + o.ry - cq.top, br = o.r;
  const far = Math.hypot(Math.max(bx, cq.width - bx), Math.max(by, cq.height - by));
  clipCircle(cardEl, bx, by, br, far, 560, easeOut, { done: () => { cardEl.classList.remove('lazy'); o.el.style.visibility = ''; } });
  const pic = $('#cPic', cardEl), pq = pic.getBoundingClientRect();
  const s = (br * 2) / pq.width;
  const dx = SR.left + o.rx - (pq.left + pq.width / 2), dy = SR.top + o.ry - (pq.top + pq.height / 2);
  pic.animate([{ transform: `translate(${dx}px,${dy}px) scale(${s})` }, { transform: 'none' }], { duration: 620, easing: 'cubic-bezier(.3,1.25,.4,1)' });
  // a buborék a kinyílás végén (onfinish) látszik újra – közben a rétegrend átszámolása megakasztaná a kinyílást
  o.el.style.visibility = 'hidden';
}
/* Bemelegítés: az első kártyanyitáskor a böngésző új betűváltozatokat tölt be és formáz – telefonon ez több
   száz ms lehet, és a kinyílást akasztja meg. Ezt a felhő beállása után, üresjáratban, darabokban előre
   elvégezzük egy láthatatlan kártyán (a közös feliratok – Energia, Gyerekbarát… – így már formázva vannak). */
function warmCard() {
  if (!cardEl.hidden) return;
  const idle = f => (window.requestIdleCallback ? requestIdleCallback(f, { timeout: 1200 }) : setTimeout(f, 50));
  try { ['800 30px Fraunces', '500 17px Fraunces', '700 22px Fraunces', '500 15px Manrope', '700 13px Manrope'].forEach(f => document.fonts.load(f, 'őűŐŰ')); } catch (e) { /* régi böngésző */ }
  const tpl = document.createElement('template');
  tpl.innerHTML = cardHTML(BREEDS[0]).replace(/ id="[^"]*"/g, '');
  const parts = [...(tpl.content.querySelector('.card-scroll') || tpl.content).children];
  const box = document.createElement('div'), sc = document.createElement('div');
  box.className = 'card warm';
  box.setAttribute('aria-hidden', 'true');
  box.style.cssText = 'visibility:hidden;pointer-events:none;left:-200vw;right:auto;top:0;bottom:auto;transform:none';
  sc.className = 'card-scroll';
  box.appendChild(sc);
  document.body.appendChild(box);
  const next = () => {
    if (!parts.length || !cardEl.hidden) { box.remove(); return; }
    sc.appendChild(parts.shift());
    void box.offsetHeight;          // elrendezés és szövegformázás most, üresjáratban – nem koppintáskor
    idle(next);
  };
  idle(next);
}

function closeCard({ fromPop = false } = {}) {
  if (cardEl.hidden || cardBusy) return;
  cardBusy = true;
  const o = OB_ID.get(S.card);
  S.card = null;
  if (o) o.el.style.visibility = '';                 // ha a kinyílás vége előtt zárják be
  const done = () => {
    cardEl.hidden = true; scrimEl.hidden = true; cardBusy = false;
    $('#cardPrev').hidden = $('#cardNext').hidden = true;
    if (o && o.st === 'in' && !RM()) { o.r *= .7; o.jv = -5; }
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  };
  scrimEl.classList.add('out');
  if (RM() || !o || o.st === 'gone' || S.view === 'lista') {
    cardEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200 }).onfinish = done;
  } else {
    const cq = cardEl.getBoundingClientRect();
    const bx = SR.left + o.rx - cq.left, by = SR.top + o.ry - cq.top;
    const far = Math.hypot(Math.max(bx, cq.width - bx), Math.max(by, cq.height - by));
    // ha még tart a kinyílás, onnan zsugorodunk, ahol épp tart (nincs ugrás)
    clipCircle(cardEl, bx, by, clipRaf ? clipR : far, Math.max(o.r, 8), 380, easeIn, { op1: .6, done });
  }
  if (!fromPop) syncHash();
}
function navCard(d) {
  if (!S.card) return;
  const i = cardOrder.indexOf(S.card);
  const next = cardOrder[(i + d + cardOrder.length) % cardOrder.length];
  if (next) openCard(next, { push: false, dir: d });
}

cardEl.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  const sim = e.target.closest('[data-sim]');
  if (sim) return openCard(sim.dataset.sim, { push: false, dir: 1 });
  if (!a) return;
  const id = S.card;
  if (a.dataset.act === 'close') closeCard();
  else if (a.dataset.act === 'fav') toggleFav(id, a);
  else if (a.dataset.act === 'cmp') toggleCmp(id, a);
  else if (a.dataset.act === 'share') shareBreed(id);
});
scrimEl.addEventListener('click', () => { if (!cardEl.hidden) closeCard(); else if (S.drawer) closeDrawer(); });
$('#cardPrev').addEventListener('click', () => navCard(-1));
$('#cardNext').addEventListener('click', () => navCard(1));

/* Mobil: lehúzás = bezárás, oldalra húzás = lapozás */
(() => {
  let x0 = null, y0 = 0, dx = 0, dy = 0, axis = null, scroller = null;
  cardEl.addEventListener('pointerdown', e => {
    if (!S.mobile || e.target.closest('button')) return;
    scroller = $('.card-scroll', cardEl);
    x0 = e.clientX; y0 = e.clientY; dx = dy = 0; axis = null;
  });
  cardEl.addEventListener('pointermove', e => {
    if (x0 == null) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (!axis && Math.hypot(dx, dy) > 12) axis = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'x' : 'y';
    if (axis === 'y' && dy > 0 && scroller.scrollTop <= 0) { cardEl.style.transform = `translateY(${dy}px)`; }
    else if (axis === 'x') { $('.card-scroll', cardEl).style.transform = `translateX(${dx * .6}px)`; }
  });
  const end = () => {
    if (x0 == null) return;
    x0 = null;
    const sc = $('.card-scroll', cardEl);
    if (axis === 'y' && dy > 110 && scroller.scrollTop <= 0) { cardEl.style.transform = ''; closeCard(); }
    else if (axis === 'x' && Math.abs(dx) > 70) { sc.style.transform = ''; navCard(dx < 0 ? 1 : -1); }
    else {
      cardEl.animate([{ transform: cardEl.style.transform || 'none' }, { transform: 'none' }], { duration: 250, easing: 'ease-out' });
      cardEl.style.transform = ''; if (sc) sc.style.transform = '';
    }
  };
  cardEl.addEventListener('pointerup', end);
  cardEl.addEventListener('pointercancel', end);
})();

/* ---------- Kedvenc / összevetés ---------- */
function burstAt(el, heart) {
  if (!el) return;
  const q = el.getBoundingClientRect();
  spark(q.left + q.width / 2, q.top + q.height / 2, heart ? 12 : 8, { speed: 5, heart, color: heart ? undefined : '#17756E', g: .1 });
}
function toggleFav(id, srcEl) {
  const on = !S.fav.has(id);
  on ? S.fav.add(id) : S.fav.delete(id);
  store.set('fav', [...S.fav]);
  markFav();
  updateBadges(on ? 'fav' : null);
  if (on) { burstAt(srcEl, true); haptic([8, 30, 8]); }
  const b = BY_ID.get(id);
  stat(on ? 'kedvenc' : 'kedvenc-torles', { fajta: b.nev0 });
  if (S.card === id) {
    const btn = $('[data-act="fav"]', cardEl);
    if (btn) { btn.classList.toggle('on', on); btn.innerHTML = `${ic(on ? 'heart-f' : 'heart')}<span>${on ? t('card.fav.on') : t('card.fav.off')}</span>`; }
  } else toast(t(on ? 'toast.favOn' : 'toast.favOff', { v: esc(b.nev) }));
  if (S.drawer === 'kedvencek') renderDrawer();
}
function toggleCmp(id, srcEl) {
  const i = S.cmp.indexOf(id);
  if (i >= 0) S.cmp.splice(i, 1);
  else {
    if (S.cmp.length >= 3) { toast(t('toast.cmpMax')); return; }
    S.cmp.push(id);
    flyToTray(id, srcEl);
  }
  store.set('cmp', S.cmp);
  markFav();
  updateBadges(i < 0 ? 'cmp' : null);
  renderTray();
  if (S.card === id) {
    const btn = $('[data-act="cmp"]', cardEl), on = S.cmp.includes(id);
    if (btn) { btn.classList.toggle('on', on); btn.innerHTML = `${ic('compare')}<span>${on ? t('card.cmp.on') : t('card.cmp.off')}</span>`; }
  }
  if (S.drawer === 'osszevet') renderDrawer();
}
function flyToTray(id, srcEl) {
  if (RM() || !srcEl) return;
  const target = S.mobile ? $('[data-tab="osszevet"]') : ($('#tray').hidden ? $('[data-drawer="osszevet"]') : $('#tray'));
  if (!target) return;
  const a = srcEl.getBoundingClientRect(), z = target.getBoundingClientRect();
  const el = document.createElement('i');
  el.className = 'flyclone';
  el.style.cssText = picStyle(BY_ID.get(id)) + `;left:${a.left + a.width / 2 - 28}px;top:${a.top + a.height / 2 - 28}px;width:56px;height:56px`;
  document.body.appendChild(el);
  const dx = z.left + z.width / 2 - (a.left + a.width / 2), dy = z.top + z.height / 2 - (a.top + a.height / 2);
  el.animate([
    { transform: 'translate(0,0) scale(1)' },
    { transform: `translate(${dx * .5}px,${dy * .5 - 120}px) scale(1.15)`, offset: .45 },
    { transform: `translate(${dx}px,${dy}px) scale(.4)`, opacity: .6 },
  ], { duration: 700, easing: 'cubic-bezier(.45,0,.3,1)' }).onfinish = () => {
    el.remove();
    const t = $('#tray');
    if (!t.hidden) { t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); }
  };
}

/* ---------- Megosztás ---------- */
async function shareBreed(id) {
  const b = BY_ID.get(id);
  stat('megosztas', { mit: b.nev0 });
  // mindig a saját domainre mutat (helyi fájlból, tükörről vagy artifactból megosztva is)
  const url = `${siteUrl()}#b=${id}`;
  const text = `${b.nev} – ${b.tagline}`;
  if (ARTIFACT) {
    try { await navigator.clipboard.writeText(`${text} 🐾 ${url}`); toast(t('toast.copiedDesc')); }
    catch (e) { toast(esc(text)); }
    return;
  }
  try {
    if (navigator.share && location.protocol.startsWith('http')) { await navigator.share({ title: 'Pacsi by DarwinAI', text, url }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast(t('toast.copiedLink')); }
  catch (e) { toast(t('toast.noShare')); }
}

/* ==========================================================================
   Fiókok: Párkereső kvíz, Kedvencek, Összehasonlítás, Tippek, Kirepültek
   ========================================================================== */
const drawerEl = $('#drawer');
let Q = { i: 0, answers: [] };
const drawerTitle = name => t(`drawer.${name}`);   // kviz, kedvencek, osszevet, tippek, kirepultek

function openDrawer(name) {
  if (S.drawer === name) return;
  closePanelSheet();
  if (!cardEl.hidden) closeCard();
  if (name === 'kviz' && !(S.quiz && !S.quiz.done)) Q = { i: 0, answers: [] };
  if (name === 'kviz' && S.quiz && S.quiz.done) Q = { i: QUIZ.length, answers: S.quiz.answers.slice() };
  S.drawer = name;
  if (name === 'osszevet' && S.cmp.length > 1) stat('osszevetes', { fajtak: S.cmp.map(id => BY_ID.get(id).nev0).join(' · ') });
  drawerEl.hidden = false;
  drawerEl.classList.remove('out');
  drawerEl.classList.toggle('short', name === 'kviz');
  drawerEl.setAttribute('aria-label', drawerTitle(name));
  renderDrawer();
  const needScrim = S.mobile && name !== 'kviz';
  if (needScrim) { scrimEl.hidden = false; scrimEl.classList.remove('out'); }
  else if (!scrimEl.hidden && cardEl.hidden) scrimEl.hidden = true;   // pl. Tippek → Kvíz: a kvíz alatt a felhő látsszon
  updateTabs();
  relayout();
  setTimeout(() => { const f = $('.qopt, .d-body button, [data-dclose]', drawerEl); f && f.focus({ preventScroll: true }); }, 350);
}
function closeDrawer() {
  if (!S.drawer) return;
  S.drawer = null;
  drawerEl.classList.add('out');
  if (!scrimEl.hidden && cardEl.hidden) { scrimEl.classList.add('out'); setTimeout(() => { if (cardEl.hidden) scrimEl.hidden = true; }, 300); }
  setTimeout(() => { if (!S.drawer) drawerEl.hidden = true; }, 340);
  updateTabs();
  relayout();
}
function updateTabs() {
  for (const b of $$('#tabbar button')) b.classList.toggle('on', (b.dataset.tab === 'felfedez' && !S.drawer) || b.dataset.tab === S.drawer);
}
function renderDrawer() {
  const name = S.drawer;
  if (!name) return;
  let body = '', foot = '';
  if (name === 'kviz') [body, foot] = quizView();
  else if (name === 'kedvencek') [body, foot] = favView();
  else if (name === 'osszevet') [body, foot] = cmpView();
  else if (name === 'tippek') [body, foot] = tipsView();
  else if (name === 'kirepultek') [body, foot] = flownView();
  drawerEl.innerHTML = `<div class="handle" aria-hidden="true"></div>
    <div class="d-head"><h2>${drawerTitle(name)}</h2><button class="icbtn" data-dclose aria-label="${esc(t('common.close'))}">${ic('x')}</button></div>
    <div class="d-body">${body}</div>${foot ? `<div class="d-foot">${foot}</div>` : ''}`;
  if (name === 'kviz' && Q.i >= QUIZ.length && !Q.prev && !RM()) {   // egy válasz módosítása után nincs újabb tűzijáték
    const q = drawerEl.getBoundingClientRect();
    spark(q.left + q.width / 2, q.top + 120, 40, { speed: 8, g: .15 });
  }
}
drawerEl.addEventListener('click', e => {
  if (e.target.closest('[data-dclose]')) return closeDrawer();
  const t = e.target;
  const opt = t.closest('.qopt');
  if (opt) return answer(+opt.dataset.a, opt);
  if (t.closest('[data-qback]')) { Q.i = Math.max(0, Q.i - 1); return renderDrawer(); }
  if (t.closest('[data-qrestart]')) { clearTimeout(qTimer); Q = { i: 0, answers: [] }; S.quiz = null; refresh(); return renderDrawer(); }
  if (t.closest('[data-qcloud]')) { closeDrawer(); if (S.view === 'lista') setView('felho'); return; }
  if (t.closest('[data-qshare]')) return shareQuiz();
  if (t.closest('[data-qresult]')) return quizBack();
  const qe = t.closest('[data-qedit]');
  if (qe) return quizEdit(+qe.dataset.qedit);
  if (t.closest('[data-tquiz]')) return openDrawer('kviz');
  const open = t.closest('[data-open]');
  if (open) return openCard(open.dataset.open);
  const unfav = t.closest('[data-unfav]');
  if (unfav) return toggleFav(unfav.dataset.unfav);
  const tcmp = t.closest('[data-tcmp]');
  if (tcmp) return toggleCmp(tcmp.dataset.tcmp, tcmp);
  if (t.closest('[data-favshare]')) return shareFavs();
  if (t.closest('[data-clearall]')) { clearAll(); closeDrawer(); return; }
  const set = t.closest('[data-set]');
  if (set) return setting(set.dataset.set, set);
});
/* Mobilon a fogantyú / fejléc lehúzásával zárható */
(() => {
  let y0 = null, dy = 0;
  drawerEl.addEventListener('pointerdown', e => {
    if (!S.mobile || !e.target.closest('.handle, .d-head') || e.target.closest('button')) return;
    y0 = e.clientY; dy = 0; drawerEl.setPointerCapture(e.pointerId); drawerEl.style.transition = 'none';
  });
  drawerEl.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); drawerEl.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; drawerEl.style.transition = ''; drawerEl.style.transform = ''; if (dy > 90) closeDrawer(); };
  drawerEl.addEventListener('pointerup', end);
  drawerEl.addEventListener('pointercancel', end);
})();

/* ---------- Kvíz ----------
   A kész kvíz bármelyik válasza módosítható az eredmény „A válaszaid” listájából (Q.edit: a módosítás előtti
   állapot). Visszatéréskor Q.prev őrzi az utolsó tényleges módosítás előtti állapotot: ebből mutatja az eredmény,
   mi változott (gazditípus, helyezések, százalékok, kiesettek). */
let qTimer = 0;
const mPct = b => Math.round(b.m * 100);
const focusIn = sel => { const f = $(sel, drawerEl); f && f.focus({ preventScroll: true }); };
function quizView() {
  if (Q.i >= QUIZ.length) return quizResult();
  const q = QUIZ[Q.i], ed = Q.edit;
  const fitting = S.quiz ? BREEDS.filter(b => b.ok && b.m >= .55).length : TOTAL;
  return [`<div class="qprog">${QUIZ.map((_, j) => `<i class="${ed || j < Q.i || (j === Q.i && Q.answers[j] != null) ? 'on' : ''}"></i>`).join('')}</div>
    <div class="qnum">${t('quiz.num', { i: Q.i + 1, n: QUIZ.length })}${ed ? t('quiz.editSuffix') : ''}</div>
    <div class="qtext">${q.q}</div>
    <div class="qopts">${q.a.map((a, j) => `<button class="qopt${Q.answers[Q.i] === j ? ' sel' : ''}" data-a="${j}" style="--i:${j}"><span class="em">${a.e}</span><span>${a.t}</span></button>`).join('')}</div>
    <div class="qnav">${ed ? `<button class="link" data-qresult>${t('quiz.toResult')}</button>`
      : `<button class="link" data-qback ${Q.i ? '' : 'style="visibility:hidden"'}>${t('quiz.back')}</button><span class="qnum">${S.quiz ? tn('quiz.fitSoFar', fitting) : t('quiz.live')}</span>`}</div>`, ''];
}
function answer(j, el) {
  if (Q.i === 0 && Q.answers[0] == null) stat('kviz-indul');   // elkezdte (az első válasszal) – a befejezési arányhoz
  Q.answers[Q.i] = j;
  $$('.qopt', drawerEl).forEach(o => o.classList.toggle('sel', o === el));
  haptic(8);
  const edit = !!Q.edit;
  S.quiz = { answers: Q.answers.slice(), crit: quizCrit(Q.answers), done: edit };
  refresh({ x: S.mobile ? LR.cx : LR.r, y: S.mobile ? LR.b : LR.cy });
  // gyors dupla koppintásnál se ugorjon át egy kérdést: az utolsó választás számít, és csak egyszer lépünk tovább
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    if (edit) return quizBack();
    Q.i++;
    if (Q.i >= QUIZ.length) {
      S.quiz.done = true; syncHash(); setTimeout(() => maybeInstall('quiz'), 2500);
      const top = topBreeds(1)[0];
      stat('kviz-kesz', { tipus: tH(`owner.${ownerType(Q.answers)}.n`), elso: top ? top.nev0 : '–' });
    }
    renderDrawer();
  }, 420);
}
function quizEdit(qi) {
  Q.edit = { qi, was: Q.answers[qi], type: ownerType(Q.answers), top: topBreeds(5).map(b => b.id), pct: new Map(BREEDS.map(b => [b.id, mPct(b)])) };
  Q.i = qi;
  renderDrawer();
  focusIn('.qopt.sel');
}
function quizBack() {
  clearTimeout(qTimer);
  const ed = Q.edit;
  Q.edit = null;
  Q.i = QUIZ.length;
  if (ed && Q.answers[ed.qi] !== ed.was) {
    Q.prev = ed;
    stat('kviz-modositas', { kerdes: `${ed.qi + 1}. ${quizTH(ed.qi)}`, valasz: quizTH(ed.qi, Q.answers[ed.qi]) });
  }
  renderDrawer();
  if (ed) focusIn(`[data-qedit="${ed.qi}"]`);
}
function topBreeds(n) { return [...BREEDS].sort((a, b) => (b.ok - a.ok) || (b.m - a.m)).slice(0, n); }
function quizResult() {
  const tk = ownerType(Q.answers), type = OWNER_TYPES[tk];
  const top = topBreeds(5);
  const P = Q.prev, newType = !!P && P.type !== tk;
  const rows = top.map((b, i) => {
    let tag = '', dp = '';
    if (P) {
      const r0 = P.top.indexOf(b.id), d = mPct(b) - P.pct.get(b.id);
      tag = r0 < 0 ? `<span class="qd new">${t('quiz.new')}</span>` : r0 > i ? `<span class="qd up">▲ ${r0 - i}</span>` : r0 < i ? `<span class="qd down">▼ ${i - r0}</span>` : '';
      if (d) dp = `<small class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${Math.abs(d)}</small>`;
    }
    return `<button class="qrow" data-open="${b.id}" style="${picStyle(b)};--i:${i}"><span class="rk">${i + 1}</span><i class="pic"></i><span><h4>${esc(b.nev)}${tag}</h4><p>${esc(b.tagline)}</p></span><span class="pc">${mPct(b)}%${dp}</span></button>`;
  }).join('');
  let chg = '';
  if (P) {
    const q = QUIZ[P.qi], a0 = q.a[P.was], a1 = q.a[Q.answers[P.qi]];   // q.q, a.t: a szótárból, lásd labels() a 20-score.js-ben
    const out = P.top.filter(id => !top.some(b => b.id === id)).map(id => esc(BY_ID.get(id).nev));
    const same = !newType && !out.length && top.every((b, i) => P.top[i] === b.id && mPct(b) === P.pct.get(b.id));
    chg = `<div class="qchg"><b>✏️ ${P.qi + 1}. ${esc(q.q)}</b><span><s>${a0.e} ${esc(a0.t)}</s> → <b>${a1.e} ${esc(a1.t)}</b></span>

const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
async function shareQuiz() {
  const type = OWNER_TYPES[ownerType(S.quiz.answers)];
  stat('megosztas', { mit: 'kvíz-eredmény' });
  const top = topBreeds(3);
  const W = 1080, H = 1350, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  try { await document.fonts.ready; } catch (e) { /* nem kritikus */ }
  const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#14121A';
  x.fillStyle = dark ? '#14121A' : '#FBF6EE'; x.fillRect(0, 0, W, H);
  [['#FFD2B8', 140, 160, 520], ['#E2D6FF', 960, 420, 560], ['#C9EEDC', 380, 1240, 600]].forEach(([col, cx, cy, r]) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, col + (dark ? '55' : 'cc')); g.addColorStop(1, col + '00');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  });
  const ink = dark ? '#F4EFE8' : '#1E1B18', ink2 = dark ? '#B4ABA2' : '#6B625A';
  x.textAlign = 'center'; x.fillStyle = ink;
  x.font = '800 64px Fraunces, Georgia, serif'; x.fillText('Pacsi', W / 2, 110);
  x.fillStyle = ink2; x.font = '600 24px Manrope, system-ui, sans-serif'; x.fillText('by DarwinAI', W / 2, 146);
  x.fillStyle = '#FF6B3D'; x.beginPath(); x.arc(W / 2 + 62, 58, 9, 0, 6.283); x.fill();
  x.fillStyle = ink2; x.font = '600 30px Manrope, system-ui, sans-serif'; x.fillText(t('shareimg.type'), W / 2, 205);
  x.fillStyle = ink; x.font = '800 76px Fraunces, Georgia, serif'; x.fillText(`${type.e} ${type.n}`, W / 2, 295);
  x.fillStyle = ink2; x.font = '600 30px Manrope, system-ui, sans-serif'; x.fillText(t('shareimg.dogs'), W / 2, 380);
  const imgs = await Promise.all(top.map(b => loadImg(portrait(b.id)).catch(() => null)));
  const pos = [[W / 2, 610, 170], [250, 960, 130], [W - 250, 960, 130]];
  top.forEach((b, i) => {
    const [cx, cy, r] = pos[i];
    x.save(); x.shadowColor = 'rgba(90,50,20,.25)'; x.shadowBlur = 40; x.shadowOffsetY = 14;
    x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, cy, r + 12, 0, 6.283); x.fill(); x.restore();
    x.save(); x.beginPath(); x.arc(cx, cy, r, 0, 6.283); x.clip();
    x.fillStyle = b.bg; x.fillRect(cx - r, cy - r, r * 2, r * 2);
    if (imgs[i]) x.drawImage(imgs[i], cx - r, cy - r, r * 2, r * 2);
    x.restore();
    x.fillStyle = '#EE5A2C'; x.beginPath(); x.arc(cx + r * .72, cy - r * .72, 44, 0, 6.283); x.fill();
    x.fillStyle = '#fff'; x.font = '800 30px Manrope, sans-serif'; x.fillText(Math.round(b.m * 100) + '%', cx + r * .72, cy - r * .72 + 11);
    x.fillStyle = ink; x.font = `700 ${i ? 36 : 46}px Fraunces, Georgia, serif`;
    x.fillText(b.nev.length > 22 ? b.nev.slice(0, 21) + '…' : b.nev, cx, cy + r + (i ? 62 : 74));
  });
  // a képet látók ide találnak el: a saját domain nagyobb és hangsúlyos, a fejlesztő alatta
  x.fillStyle = ink2; x.font = '600 28px Manrope, sans-serif'; x.fillText(t('shareimg.cta'), W / 2, H - 112);
  x.font = '800 40px Manrope, sans-serif'; x.fillStyle = '#EE5A2C'; x.fillText(SITE.url.replace(/^https?:\/\//, ''), W / 2, H - 62);
  x.font = '600 20px Manrope, sans-serif'; x.fillStyle = ink2; x.fillText('Pacsi by DarwinAI 🐾', W / 2, H - 26);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  if (ARTIFACT) {
    // az artifact-keret letiltja a letöltést és a Web Share-t: a képet itt mutatjuk meg, innen menthető
    const src = URL.createObjectURL(blob);
    $('.d-body', drawerEl).innerHTML = `<p style="margin:0 0 12px;color:var(--ink-2)">${t('share.artifactHint')}</p>
      <img src="${src}" alt="${esc(t('share.alt', { v: type.n }))}" style="width:100%;border-radius:20px;box-shadow:var(--shadow)">`;
    $('.d-foot', drawerEl).innerHTML = `<button class="btn fill" data-qresult style="flex:1">${t('quiz.toResult')}</button>`;
    return;
  }
  const file = new File([blob], t('share.file'), { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Pacsi by DarwinAI', text: t('share.text', { v: type.n, url: siteUrl() }) }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = t('share.file');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(t('toast.imgSaved'));
}

/* ---------- Összehasonlítás (radar + táblázat) ---------- */
const RADAR = [['E', ''], ['Gy', ''], ['I', ''], ['U', '', 1], ['H', '', 1], ['A', '', 1]];   // [mutató, felirat (labels), fordított skála?]
labels(() => RADAR.forEach(r => { r[1] = t(`radar.${r[0]}`); }));
const CMP_C = ['#FF6B3D', '#17756E', '#8A63D2'];
/* Kivétel az összevetésből (a fiók alján) – mindig a benne lévő összes fajtára, akkor is, ha már csak egy maradt.
   A gombon portré a fajta színével és a teljes név: az első szó („Rövidszőrű”, „Törpe”) nem volt egyértelmű,
   és jellemzőnek tűnt. */
const cmpOut = list => `<div class="cmp-xs" data-n="${list.length}">${list.map((b, j) =>
  `<button class="cmp-x" data-tcmp="${b.id}" style="${picStyle(b)};--cc:${CMP_C[j]}" aria-label="${esc(t('cmp.remove', { v: b.nev }))}"><i class="pic"><b class="x">${ic('x')}</b></i><span>${esc(b.nev)}</span></button>`).join('')}</div>`;
function cmpView() {
  const list = S.cmp.map(id => BY_ID.get(id)).filter(Boolean);
  if (list.length < 2) {
    const s = SPARES['kerdo-kutya'];
    return [`<div class="dempty"><div class="pic" style="background-image:url('${portrait(s.id)}');background-color:${s.bg}"></div><h3>${t('cmp.empty.h')}</h3>
      <p>${t('cmp.empty.p')}${list.length ? t('cmp.empty.sofar', { v: esc(list[0].nev) }) : ''}</p></div>`, list.length ? cmpOut(list) : ''];
  }
  const cx = 190, cy = 170, R = 118, n = RADAR.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i / n * Math.PI * 2; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  const web = [1, 2, 3, 4, 5].map(l => `<polygon class="web" points="${RADAR.map((_, i) => pt(i, l / 5).join(',')).join(' ')}"/>`).join('');
  const spokes = RADAR.map((_, i) => `<line class="spoke" x1="${cx}" y1="${cy}" x2="${pt(i, 1)[0]}" y2="${pt(i, 1)[1]}"/>`).join('');
  const labels = RADAR.map(([, l], i) => { const [x, y] = pt(i, 1.2); return `<text class="lab" x="${x}" y="${y + 4}" text-anchor="middle">${l}</text>`; }).join('');
  const polys = list.map((b, j) => `<polygon class="poly" style="fill:${CMP_C[j]};stroke:${CMP_C[j]};animation-delay:${j * 150}ms" points="${RADAR.map(([k, , inv], i) => pt(i, (inv ? 6 - b.t[k] : b.t[k]) / 5).join(',')).join(' ')}"/>`).join('');
  const rows = [
    [t('cmp.row.size'), b => b.meret.map(v => SIZE_L[v]).join('–')],
    [t('cmp.row.weight'), b => t('unit.kg', { v: range(b.suly) })],
    [t('cmp.row.height'), b => b.marmagassag ? t('unit.cm', { v: range(b.marmagassag) }) : '–'],
    [t('cmp.row.life'), b => t('unit.years', { v: range(b.elet) }), b => b.elet[1]],
    [t('cmp.row.coat'), b => b.szor.map(v => COAT_L[v]).join(' / ')],
    [t('cmp.row.kids'), b => b.t.Gy + '/5', b => b.t.Gy],
    [t('cmp.row.flat'), b => b.t.L + '/5', b => b.t.L],
    [t('cmp.row.novice'), b => b.t.K + '/5', b => b.t.K],
    [t('cmp.row.cost'), b => COST[b.koltseg || 2].split(' ')[0], b => -(b.koltseg || 2)],
    [t('cmp.row.origin'), b => b.orszag],
  ];
  const table = `<table class="ctable"><tbody>${rows.map(([l, f, score]) => {
    const best = score ? Math.max(...list.map(score)) : null;
    return `<tr><th>${l}</th>${list.map(b => `<td class="${score && score(b) === best && list.some(x => score(x) !== best) ? 'best' : ''}">${esc(f(b))}</td>`).join('')}</tr>`;
  }).join('')}</tbody></table>`;
  return [`<div class="cmp-heads">${list.map((b, j) => `<button class="cmp-h" data-open="${b.id}" style="${picStyle(b)};--cc:${CMP_C[j]};border:0;background:none;padding:0"><i class="pic"></i>${esc(b.nev)}</button>`).join('')}</div>
    <svg class="radar" viewBox="0 0 380 340">${web}${spokes}${polys}${labels}</svg>${table}`, cmpOut(list)];
}

  });
  setTimeout(() => WL.open && go.focus({ preventScroll: true }), 120);
  // „pacsi!”: amikor a kéz és a mancs összeér (és a gyűrű körbeért), szívecskék pattannak ki
  setTimeout(() => {
    if (!WL.open || RM()) return;
    const q = $('.wl-hero', welcomeEl).getBoundingClientRect(), x = q.left + q.width * .31, y = q.top + q.height * .29;
    spark(x, y, 9, { heart: true, size: 6, speed: 4.5, g: .05, up: 1.4, color: '#FF6B3D' });
    spark(x, y, 7, { heart: true, size: 5, speed: 4, g: .05, up: 1.2, color: '#FF8FA3' });
  }, 1500);
}
function closeWelcome() {
  if (!WL.open || WL.busy) return;
  WL.busy = true;
  stat('bemutato', { lepes: 'Kezdjük' });
  const go = $('[data-go]', welcomeEl), q = go.getBoundingClientRect();
  spark(q.left + q.width / 2, q.top + q.height / 2, 26, { speed: 6, g: .1 });
  haptic(12);
  welcomeEl.classList.add('out');
  $('#app').inert = false;
  setTimeout(() => {
    welcomeEl.hidden = true; welcomeEl.innerHTML = '';
    WL.open = WL.busy = false;
    store.set('welcome', 1);
    const then = WL.then; WL.then = null;
    then && then();
  }, RM() ? 60 : 380);
}
welcomeEl.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;   // a fókus az ablakon belül marad: a „Kezdjük!” és a nyelvváltó gombjai között körbejár
  e.preventDefault();
  const f = $$('button', welcomeEl), i = f.indexOf(document.activeElement);
  f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
});

/* Teljes bevezetés: nyitó ablak → bemutató (első látogatáskor és a Tippek → „Bemutató újra” gombbal) */
function startOnboarding() {
  if (CO) endCoach(false);
  openWelcome(() => setTimeout(() => coach(0), 260));
}

/* ---------- Bemutató (coach mark) ----------
   Reflektorfény: a lépés célpontja kivilágítva, a többi elsötétül (a kattintás átmegy rajta), a célpont
   körül lüktető gyűrű; a buborékban a Pacsi kabala „mondja” a tippet. Ha a lépés kérését a látogató
   megteszi (buborékot nyit, szűrőt kapcsol, kvízt indít), a bemutató magától továbblép. */
const COACH = [
  { t: () => stage, pad: -8, r: 30, h: 'coach.1.h',
    p: () => t(S.mobile ? 'coach.1.p.mobile' : 'coach.1.p.desktop', { n: TOTAL }),
    did: () => !!S.card },
  { t: () => S.mobile ? $('#dock') : $('#panel'), pad: 6, r: S.mobile ? 30 : 34, h: 'coach.2.h',
    p: () => modeOf() === 'rank' ? t('coach.2.p.rank') : t(S.mobile ? 'coach.2.p.mobile' : 'coach.2.p.desktop'),
    did: () => filterSig() !== CO.sig },
  { t: () => S.mobile ? $('[data-tab="kviz"]') : $('#quizBtn'), pad: 6, r: S.mobile ? 20 : 40, h: 'coach.3.h',
    p: () => t('coach.3.p'),
    did: () => S.drawer === 'kviz' },
];
const filterSig = () => S.crit.map(c => c.label).join('|');
let CO = null;   // { i, sig, done, hold, iv, adv, rect }
const coachBlocked = () => WL.open || !cardEl.hidden || !!S.drawer || $('#panel').classList.contains('open') || !$('#mobSearch').hidden;

function coach(i = 0) {
  if (i >= COACH.length) return endCoach(true, 'vége');
  if (!CO) CO = { iv: setInterval(coachWatch, 200) };
  clearTimeout(CO.adv);
  Object.assign(CO, { i, sig: filterSig(), done: false, adv: 0, rect: '' });
  if (CO.statI !== i) { CO.statI = i; stat('bemutato', { lepes: `tipp ${i + 1}` }); }   // újramegjelenítéskor nem számol újra
  if (coachBlocked()) { CO.hold = true; hideCoach(); return; }
  CO.hold = false;
  showCoach(i);
}
function showCoach(i) {
  const c = COACH[i];
  coachEl.innerHTML = `<i class="co-pic" style="background-image:url('${portrait('kabala-pacsi')}')" aria-hidden="true"></i>
    <span class="co-step">${t('coach.step', { i: i + 1, n: COACH.length })}</span><h4>${t(c.h)}</h4><p>${c.p()}</p>
    <div class="row"><span class="dots3">${COACH.map((_, j) => `<i class="${j === i ? 'on' : j < i ? 'was' : ''}"></i>`).join('')}</span>
    <span><button class="link" data-skip>${t('coach.skip')}</button> <button class="btn fill" data-next>${i === COACH.length - 1 ? t('welcome.go') : t('coach.next')}</button></span></div>`;
  coachEl.hidden = false;
  coachEl.style.animation = 'none'; void coachEl.offsetWidth; coachEl.style.animation = '';   // minden lépés újra „beugrik”
  $('[data-next]', coachEl).onclick = () => coach(i + 1);
  $('[data-skip]', coachEl).onclick = () => endCoach();
  const first = spotEl.hidden || !spotEl.classList.contains('on');
  if (first) spotEl.style.transition = 'none';
  spotEl.hidden = false;
  placeCoach(i);
  if (first) { void spotEl.offsetWidth; spotEl.style.transition = ''; }
  spotEl.classList.add('on');
  haptic(10);
}
function placeCoach(i) {
  const c = COACH[i], q = c.t().getBoundingClientRect();
  CO.rect = `${q.left},${q.top},${q.width},${q.height}`;
  // reflektor: a célpont (+ margó), a képernyőn belül tartva, hogy a gyűrű mindig látsszon
  const sx = clamp(q.left - c.pad, 5, innerWidth - 5), sy = clamp(q.top - c.pad, 5, innerHeight - 5);
  const sw = clamp(q.right + c.pad, 5, innerWidth - 5) - sx, sh = clamp(q.bottom + c.pad, 5, innerHeight - 5) - sy;
  const r = Math.min(c.r, sw / 2, sh / 2);
  Object.assign(spotEl.style, { left: sx + 'px', top: sy + 'px', width: sw + 'px', height: sh + 'px', borderRadius: r + 'px' });
  spotEl.style.setProperty('--sx', ((sw + 26) / sw).toFixed(4));   // a lüktetés mindkét irányban ~13 px-t tágul
  spotEl.style.setProperty('--sy', ((sh + 26) / sh).toFixed(4));
  // a tippbuborék: asztalon a célpont mellett/alatt, mobilon a célpont fölött
  const box = coachEl, w = box.offsetWidth, h = box.offsetHeight;
  box.classList.remove('up', 'left');
  let x, y;
  if (i === 0) { x = q.left + q.width / 2 - w / 2; y = q.top + q.height * (S.mobile ? .5 : .56); box.style.setProperty('--ax', w / 2 - 10 + 'px'); }
  else if (!S.mobile) {
    x = sx + sw + 22;
    y = i === 1 ? q.top + 62 : q.top + q.height / 2 - h / 2;
    box.classList.add('left');
    box.style.setProperty('--ay', (i === 1 ? 64 : h / 2 - 10) + 'px');
  } else {
    x = 16; y = sy - h - 18;
    box.classList.add('up');
    box.style.setProperty('--ax', clamp(q.left + q.width / 2 - 16 - 10, 22, w - 34) + 'px');
  }
  box.style.left = clamp(x, 12, innerWidth - w - 12) + 'px';
  box.style.top = clamp(y, 12, innerHeight - h - 12) + 'px';
}
function hideCoach() {
  coachEl.hidden = true;
  spotEl.classList.remove('on');
  spotEl.hidden = true;
}
function coachWatch() {
  if (!CO) return;
  const c = COACH[CO.i];
  if (!CO.done && c.did()) CO.done = true;
  const bl = coachBlocked();
  if (bl) { if (!CO.hold) { CO.hold = true; hideCoach(); } return; }
  if (CO.hold) {                       // bezárult a kártya/lap/fiók: jöhet a következő (vagy ugyanez a) lépés
    CO.hold = false;
    return coach(CO.done ? CO.i + 1 : CO.i);
  }
  if (CO.done && !CO.adv) CO.adv = setTimeout(() => CO && coach(CO.i + 1), 1500);   // hadd lássa a hatást
  const q = c.t().getBoundingClientRect();
  if (`${q.left},${q.top},${q.width},${q.height}` !== CO.rect) placeCoach(CO.i);   // átméretezés, elforgatás
}
function endCoach(save = true, how = 'kihagyva') {
  if (!CO) return;
  clearInterval(CO.iv); clearTimeout(CO.adv);
  if (save) stat('bemutato', { lepes: how === 'vége' ? 'vége' : `kihagyva (tipp ${CO.i + 1})` });
  CO = null;
  coachEl.hidden = true;
  spotEl.classList.remove('on');
  setTimeout(() => { if (!CO) spotEl.hidden = true; }, 380);
  if (save) store.set('coach', 1);
}

/* ==========================================================================
   Indítás, globális események, PWA
   ========================================================================== */
function init() {
  // verziószám a felületen (asztali panel lábléce) és a konzolban – a Tippek névjegykártyáján is látszik
  $$('[data-ver]').forEach(e => { e.textContent = `v${APP_VERSION} · build ${APP_BUILD}`; });
  console.info(`Pacsi v${APP_VERSION} (build ${APP_BUILD})`);
  applyTheme();
  document.documentElement.classList.toggle('rm', RM());
  // „mode2”: az alapértelmezés Csak találatokra váltott, a korábban elmentett választást egyszer nullázzuk
  S.mode = store.get('mode2', null);
  const h = decodeHash();
  if (h.quiz) S.quiz = { answers: h.quiz, crit: quizCrit(h.quiz), done: true };
  stage.classList.toggle('mobile', S.mobile);
  renderFilters();
  renderLangUI();
  $('#listView').hidden = S.view !== 'lista';
  bubblesEl.style.visibility = S.view === 'lista' ? 'hidden' : '';
  stage.classList.toggle('list', S.view === 'lista');
  markFav();
  updateBadges();
  fxResize();
  $('#logo').classList.add('hi5');
  setTimeout(() => $('#logo').classList.remove('hi5'), 1200);
  intro();
  requestAnimationFrame(t => { lastT = t; frame(t); });
  setTimeout(initRoving, 1600);
  setTimeout(warmCard, 3200);         // a felhő beállása után: első kártyanyitás gyorsítása
  if (h.card) setTimeout(() => openCard(h.card, { push: false }), 1300);
  else if (h.kviz) { syncHash(); setTimeout(() => openDrawer('kviz'), 1300); }
  store.set('visits', store.get('visits', 0) + 1);
  statStart();   // névtelen statisztika: megnyitás (csak a saját domainen, lásd 15-stat.js)
  // első látogatás: nyitó ablak (a felhő közben pattan ki mögötte), a „Kezdjük!” után a bemutató.
  // ?bemutato: újra megmutatja (pl. telepített appban); ?nocoach: nincs bevezetés (marketing-felvételek)
  const tour = /[?&]bemutato/.test(location.search);
  if ((tour || !store.get('coach', 0)) && !h.card && !h.kviz && !/[?&]nocoach/.test(location.search)) {
    preloadHero();
    setTimeout(() => { if (!S.card && !S.drawer) startOnboarding(); }, 450);
  } else setTimeout(() => maybeInstall(), 5000);
  if ('serviceWorker' in navigator && window.PACSI_PWA && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) toast(t('update.msg'), { action: t('update.btn'), onAction: () => location.reload(), ms: 6000 });
        });
      });
    }).catch(() => {});
  }
}

/* Átméretezés, forgatás, mobil/desktop váltás */
let rzTimer = 0;
new ResizeObserver(() => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => { fxResize(); relayout(); segAll(); }, 90);
}).observe(stage);
mqMobile.addEventListener('change', () => {
  S.mobile = mqMobile.matches;
  stage.classList.toggle('mobile', S.mobile);
  closePanelSheet();
  if (S.drawer) closeDrawer();
  if (!cardEl.hidden) closeCard();
  refresh();
});
mqRM.addEventListener('change', () => document.documentElement.classList.toggle('rm', RM()));

/* Billentyűzet */
addEventListener('keydown', e => {
  if (WL.open) { if (e.key === 'Escape') closeWelcome(); return; }   // nyitó ablak: csak a „Kezdjük!” (vagy Esc) visz tovább
  const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (!cardEl.hidden) return closeCard();
    if (!coachEl.hidden) return endCoach();
    if (S.drawer) return closeDrawer();
    if ($('#panel').classList.contains('open')) return closePanelSheet();
    if (!$('#mobSearch').hidden) return closeMobSearch();
  }
  if (typing) return;
  if (e.key === '/' && !S.mobile) { e.preventDefault(); qInput.focus(); return; }
  if (!cardEl.hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); navCard(e.key === 'ArrowRight' ? 1 : -1); }
});

/* Vissza gomb (böngésző / Android) */
addEventListener('popstate', () => {
  const p = new URLSearchParams(location.hash.slice(1));
  const b = p.get('b');
  if (!b && !cardEl.hidden) closeCard({ fromPop: true });
  else if (b && b !== S.card && BY_ID.has(b)) openCard(b, { push: false });
});

/* Logó: pacsi + alaphelyzet */
$('#logo').addEventListener('click', e => {
  e.preventDefault();
  const l = $('#logo');
  l.classList.remove('hi5'); void l.offsetWidth; l.classList.add('hi5');
  if (!cardEl.hidden) closeCard();
  if (S.drawer) closeDrawer();
  if (S.view !== 'felho') setView('felho');
  if (S.crit.length) clearAll();
  const q = l.getBoundingClientRect();
  spark(q.right - 14, q.top + 6, 14, { speed: 4 });
});
$('#surpriseBtn').addEventListener('click', surprise);

/* Telefon megrázása = meglepetés (ahol engedély nélkül elérhető) */
if ('DeviceMotionEvent' in window && typeof DeviceMotionEvent.requestPermission !== 'function') {
  let lastShake = 0;
  addEventListener('devicemotion', e => {
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    const f = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    if (f > 28 && now() - lastShake > 2500 && !S.card && !S.drawer) { lastShake = now(); surprise(); }
  });
}

init();

})();</script>
