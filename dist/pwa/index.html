<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<div class="app" id="app">
  <!-- Felső sáv (desktop) / app bar (mobil) -->
  <header class="topbar">
    <div class="brand">
      <a class="logo" href="#" id="logo" aria-label="Pacsi – kezdőlap" data-i18n-attr="aria-label:top.home">
        <span class="logo-word">Pacs<span class="logo-i">ı<svg class="logo-paw" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-paw"/></svg></span></span>
      </a>
      <a class="byline" href="https://www.darwinai.hu" target="_blank" rel="noopener" title="A Pacsit a DarwinAI fejlesztette – www.darwinai.hu" data-i18n-attr="title:top.byline">by <b>DarwinAI</b></a>
    </div>
    <label class="search" id="searchBox">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Keress fajtát… pl. vizsla" autocomplete="off" aria-label="Fajta keresése" data-i18n-attr="placeholder:search.ph;aria-label:search.aria">
      <kbd class="kbd">/</kbd>
    </label>
    <nav class="seg views" id="views" role="tablist" aria-label="Nézet" data-i18n-attr="aria-label:view.aria">
      <button role="tab" data-view="felho"><svg class="ic"><use href="#i-cloud"/></svg><span data-i18n="view.felho">Felhő</span></button>
      <button role="tab" data-view="csoport"><svg class="ic"><use href="#i-groups"/></svg><span data-i18n="view.csoport">Csoportok</span></button>
      <button role="tab" data-view="terkep"><svg class="ic"><use href="#i-map"/></svg><span data-i18n="view.terkep">Térkép</span></button>
      <button role="tab" data-view="lista"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="view.lista">Lista</span></button>
    </nav>
    <div class="tb-actions">
      <span class="pill-count mob" id="mobCount" aria-hidden="true"><b>…</b> fajta</span>
      <button class="flycloud mob" id="flyCloud" aria-label="Kirepült fajták" data-i18n-attr="aria-label:drawer.kirepultek" hidden><svg class="ic"><use href="#i-arrow-up"/></svg><b>0</b></button>
      <button class="icbtn mob" id="mobSearchBtn" aria-label="Keresés" data-i18n-attr="aria-label:top.search"><svg class="ic"><use href="#i-search"/></svg></button>

set.stat":"Névtelen statisztika","set.mode":"Alapértelmezett mód: {v}","set.switch":"Váltás","set.coach":"Bemutató újra","set.start":"Indítás","set.lang":"Nyelv","tips.responsible.h":"❤️ Válassz felelősen","tips.responsible.body":"<p>Hosszú évekre, sokszor 10–15 évre veszel magad mellé valakit, aki a családod tagja lesz. Ezért ne csak a külseje alapján dönts: nézd meg, illik-e az életmódodhoz, az otthonodhoz és a családodhoz. Ebben segít a Pacsi is, a szűrőkkel, a Párkereső kvízzel és az összehasonlítással.<\/p><p><button class=\"link\" data-tquiz>Kitöltöm a Párkereső kvízt →<\/button><\/p>","tips.bred.h":"🧬 Mire tenyésztették?","tips.bred.body":"<p>Nézd meg, mire tenyésztették és mire használták eredetileg a fajtát, amelyik tetszik, és gondold végig, ki tudod-e szolgálni az ösztöneit. A vadászkutya szimatolna és futna, a terelőkutya terelne, az őrzőkutya őrizne – akkor is, ha nálad nincs rá feladata.<\/p><p>Például a dalmata, a <i>101 kiskutya<\/i> sztárja, eredetileg lovas kocsik mellett futó kísérő- és őrzőkutya volt. Ma is rengeteg futás kell neki, megvan benne az őrző ösztön, és heves természete miatt kisgyerek mellé nem kifejezetten ajánlott.<\/p><small>A fajtakártyák leírásában is utánanézhetsz, honnan jön és mire használták a fajtát.<\/small>","tips.checklist.h":"✅ Mielőtt kutyát veszel","tips.checklist.body":"<ul><li>Nézd meg a kölyök szüleit és a tartási körülményeket.<\/li><li>Kérj törzskönyvet (FCI/MEOESZ) és a szülők egészségügyi szűréseit (pl. csípő, szem, szív).<\/li><li>A kölyök legalább 8 hetes legyen, mikrochippel és oltási könyvvel.<\/li><li>Kerüld az „olcsó, azonnal elvihető” hirdetéseket – gyakran szaporítótól származnak.<\/li><li>Kérj írásos adásvételi szerződést.<\/li><\/ul>","tips.puppytest.h":"🐶 Kölyökteszt: melyik kölyök illik hozzád?","tips.puppytest.body":"<p>A fajtán belül is sokat számít, hogy az alomból melyik kölyök kerül hozzád: így kerülhet jó kutya jó helyre. A tenyésztők ezt kölyöktesztnek hívják. Már 6 hetes korban sokat elárul a kiskutya egyéniségéről, például:<\/p><ul><li>mennyire szereti az embereket,<\/li><li>fél-e a zajoktól,<\/li><li>könnyen vagy nehezen motiválható-e, és mivel (étel, játék, dicséret),<\/li><li>mennyire önálló és mennyire tanulékony.<\/li><\/ul><small>Kérdezd meg a tenyésztőt, végzett-e kölyöktesztet, és melyik kölyköt ajánlja a családodhoz.<\/small>","tips.adopt.h":"🏡 Gondolj az örökbefogadásra","tips.adopt.body":"<p>Rengeteg fajtatiszta kutya és keverék vár menhelyen vagy fajtamentő szervezetnél. Egy felnőtt kutya jellemét ráadásul már ismerni lehet.<\/p><p><b>Mentett kutyánál még fontosabb egy szakértő, például egy kutyakiképző segítsége.<\/b> Laikus gazdaként nem mindig látod, milyen fizikai adottságai vagy betegségei vannak, és érte-e testi vagy lelki trauma. Pedig ezekkel számolnod kell a befogadás utáni szocializációban. Előfordulhat például, hogy a kutya:<\/p><ul><li>antiszociális más kutyákkal, háziállatokkal vagy emberekkel,<\/li><li>retteg az emberektől vagy más állatoktól,<\/li><li>nehezen motiválható, így nehezen képezhető.<\/li><\/ul>","tips.legal.h":"📋 Kötelezettségek Magyarországon","tips.legal.body":"<ul><li>Mikrochip és nyilvántartásba vétel.<\/li><li>Évenkénti veszettség elleni oltás.<\/li><li>Az önkormányzati ebösszeírás.<\/li><\/ul><small>Tájékoztató jellegű – ellenőrizd a hatályos jogszabályokat és a helyi rendeleteket.<\/small>","tips.flat.h":"😮‍💨 Lapos orrú fajták","tips.flat.body":"<p>A francia bulldog, a mopsz vagy az angol bulldog cuki, de gyakoriak náluk a légzési, szem- és gerincproblémák. Ha ilyet választasz, csak egészségügyileg szűrt, nyitott orrlyukú szülőktől.<\/p>","tips.cost.h":"💶 Mire számíts az első évben?","tips.cost.body":"<ul><li>Eledel (a mérettől függően ez a legnagyobb tétel)<\/li><li>Oltások, féreghajtás, parazita elleni védelem<\/li><li>Kutyaiskola, felszerelés, fekhely<\/li><li>Kozmetikus a sokat ápolandó fajtáknál<\/li><li>Tartalék váratlan állatorvosi költségekre, vagy biztosítás<\/li><\/ul><small>A fajtakártyák €–€€€ jelölése a relatív havi fenntartási költséget mutatja.<\/small>","tips.newsletter.h":"✉️ Heti kutyás levél","tips.newsletter.body":"Csütörtökönként a hét fajtája, gazdi-tippek és egy kis fejtörő – ingyen, bármikor leiratkozhatsz.","tips.newsletter.link":"Feliratkozom ↗","tips.about.h":"ℹ️ A Pacsiról","tips.about.p1":"A jellemzők a fajtákra jellemző átlagot írják le; az egyes kutyák ettől eltérhetnek. A portrék saját, mesterséges intelligenciával készült illusztrációk.","tips.about.p2":"<b>Adatvédelem:<\/b> nincs regisztráció, és nem gyűjtünk személyes adatot; a kedvencek csak ezen az eszközön tárolódnak. A {host} névtelen, sütik nélküli látogatottsági statisztikát készít a saját szerverén (pl. mely fajták és szűrők a legnépszerűbbek) – ezt fent, a Beállításokban kikapcsolhatod.","tips.credit":"A Pacsit a <b>DarwinAI<\/b> tervezte és fejlesztette.","tips.version":"Verzió: {v}","welcome.eyebrow":"{n} kutyafajta · egy élő felhőben","welcome.h1a":"Válaszd ki a","welcome.h1b":"neked való","welcome.h1c":"kutyafajtát,","welcome.lead":"hogy mindketten azt kapjátok, amire vágytok.","welcome.body":"Állítsd be a szűrőket, és nézd meg, melyik fajta illik hozzád.","welcome.go":"Kezdjük!","welcome.next":"Utána 3 gyors tipp következik","welcome.match":"<b>100%<\/b> illik hozzád","coach.1.h":"Ez itt a fajtafelhő","coach.1.p.mobile":"{n} kutyafajta, mind egy helyen. Koppints egy buborékra, és megtudod, ki az.","coach.1.p.desktop":"{n} kutyafajta, mind egy helyen. Vidd az egeret egy buborékra, és megtudod, ki az.","coach.2.h":"Szűrj, és figyeld!","coach.2.p.rank":"Kapcsolj be egy szűrőt, és nézd, ki ugrik előre!","coach.2.p.mobile":"Kapcsolj be egy szűrőt: ami nem illik hozzád, kirepül.","coach.2.p.desktop":"Kapcsolj be egy szűrőt: ami nem illik hozzád, eltűnik, a többi megnő.","coach.3.h":"Nem tudod, hol kezdd?","coach.3.p":"A Párkereső kvíz 10 kérdés, kb. 1 perc – és élőben formálja a felhőt.","coach.step":"Tipp {i}/{n}","coach.skip":"Kihagyom","coach.next":"Tovább"},"en":{"meta.tit wner.kaland.n":"Active Adventurer","owner.kaland.d":"Running, hiking, cycling: you need a partner who keeps up the pace and asks for more.","owner.csalad.n":"Family Conductor","owner.csalad.d":"Children’s chatter, shared plans: you’re after a patient, cheerful family member.","owner.kanape.n":"Sofa Captain","owner.kanape.d":"Quiet evenings, short walks, lots of cuddles. Comfort is your love language.","owner.varos.n":"Urban Flâneur","owner.varos.d":"Café terraces, walks in the park, the lift. You’re looking for an adaptable city companion.","radar.E":"Energy","radar.Gy":"Child-friendly","radar.I":"Quick learner","radar.U":"Quiet","radar.H":"Low shedding","radar.A":"Low grooming","cmp.remove":"Remove {v} from the comparison","cmp.empty.h":"What shall we compare?","cmp.empty.p":"Add at least 2 breeds to the comparison with the <b>Compare<\/b> button on their cards (max. 3).","cmp.empty.sofar":"<br>So far: <b>{v}<\/b>","cmp.row.size":"Size","cmp.row.weight":"Weight","cmp.row.height":"Height at withers","cmp.row.life":"Lifespan","cmp.row.coat":"Coat","cmp.row.kids":"Child-friendly","cmp.row.flat":"Flat-friendly","cmp.row.novice":"For beginners","cmp.row.cost":"Cost","cmp.row.origin":"Origin","fav.empty.h":"No favourites yet","fav.empty.p":"Mark one with the ♥ button on a breed card (on mobile, long-press the bubble).","fav.open":"Open {v}","fav.cmpOff":"Remove from comparison","fav.cmpOn":"Add to comparison","fav.remove":"Remove from favourites","fav.share":"Share my favourites","fav.text":"My favourite dog breeds on Pacsi: {v} 🐾 Which one suits you? – Pacsi by DarwinAI","shareimg.type":"My owner type:","shareimg.dogs":"…and the dogs that suit me:","shareimg.cta":"Find the dog that suits you too:","share.artifactHint":"Right-click the image (on mobile, long-press it) to save or share it.","share.alt":"My Pacsi quiz result: {v}","share.file":"pacsi-my-result.png","share.text":"My owner type on Pacsi: {v} 🐾 What kind of owner are you? {url}","flown.none.h":"Nobody flew out","flown.none.p":"Every breed is in the cloud.","flown.intro":"These breeds have flown out – but you can call them back any time by releasing a filter.","flown.all":"Everyone back into the cloud","set.title":"⚙️ Settings","set.theme":"Dark theme","set.rm":"Reduced motion","set.stat":"Anonymous statistics","set.mode":"Default mode: {v}","set.switch":"Switch","set.coach":"Replay the tour","set.start":"Start","set.lang":"Language","tips.responsible.h":"❤️ Choose responsibly","tips.responsible.body":"<p>You’re taking someone into your life for many years, often 10–15, who will become a member of your family. So don’t decide by looks alone: check whether the dog fits your lifestyle, your home and your family. Pacsi helps with this too, with its filters, the Matchmaker quiz and the comparison tool.<\/p><p><button class=\"link\" data-tquiz>Take the Matchmaker quiz →<\/button><\/p>","tips.bred.h":"🧬 What was it bred for?","tips.bred.body":"<p>Find out what the breed you like was bred and originally used for, and think about whether you can meet its instincts. A hunting dog would sniff and run, a herding dog would herd, a guard dog would guard – even if there is no job for it at your place.<\/p><p>For example, the Dalmatian, star of <i>101 Dalmatians<\/i>, was originally a coach dog that ran alongside horse-drawn carriages as an escort and guard. It still needs plenty of running, has a guarding instinct, and because of its spirited temperament it is not specifically recommended for homes with small children.<\/p><small>You can also look up where a breed comes from and what it was used for in the breed card descriptions.<\/small>","tips.checklist.h":"✅ Before you buy a dog","tips.checklist.body":"<ul><li>Look at the puppy’s parents and the conditions they are kept in.<\/li><li>Ask for pedigree papers (FCI/MEOESZ, the Hungarian Kennel Association) and the parents’ health screenings (e.g. hips, eyes, heart).<\/li><li>The puppy should be at least 8 weeks old, microchipped and have a vaccination record.<\/li><li>Avoid “cheap, available immediately” adverts – they often come from puppy farms.<\/li><li>Ask for a written sales contract.<\/li><\/ul>","tips.puppytest.h":"🐶 Puppy test: which puppy suits you?","tips.puppytest.body":"<p>Even within a breed it matters a lot which puppy from the litter comes home with you: that is how a good dog ends up in a good home. Breeders call this a puppy test. Already at 6 weeks old it reveals a lot about a puppy’s personality, for example:<\/p><ul><li>how much it likes people,<\/li><li>whether it is afraid of noises,<\/li><li>how easy or hard it is to motivate, and with what (food, toys, praise),<\/li><li>how independent and how quick to learn it is.<\/li><\/ul><small>Ask the breeder whether they have done a puppy test, and which puppy they recommend for your family.<\/small>","tips.adopt.h":"🏡 Think about adoption","tips.adopt.body":"<p>Plenty of purebred dogs and mixed breeds are waiting in shelters and breed rescues. What’s more, an adult dog’s character is already known.<\/p><p><b>With a rescue dog, expert help – for example from a dog trainer – is even more important.<\/b> As a lay owner you can’t always see what physical traits or illnesses it has, or whether it has suffered physical or emotional trauma. Yet you have to reckon with these when socialising it after adoption. For instance, the dog may:<\/p><ul><li>be antisocial towards other dogs, pets or people,<\/li><li>be terrified of people or other animals,<\/li><li>be hard to motivate, and so hard to train.<\/li><\/ul>","tips.legal.h":"📋 Obligations in Hungary","tips.legal.body":"<ul><li>Microchip and registration.<\/li><li>Annual rabies vaccination.<\/li><li>The municipal dog census.<\/li><\/ul><small>For information only – check the current legislation and local regulations.<\/small>","tips.flat.h":"😮‍💨 Flat-faced breeds","tips.flat.body":"<p>The French Bulldog, the Pug or the English Bulldog are cute, but breathing, eye and spine problems are common in them. If you choose one, get it only from health-screened parents with open nostrils.<\/p>","tips.cost.h":"💶 What to expect in the first year","tips.cost.body":"<ul><li>Food (depending on size, this is the biggest item)<\/li><li>Vaccinations, worming, parasite protection<\/li><li>Dog school, equipment, bed<\/li><li>Groomer for breeds that need a lot of grooming<\/li><li>A reserve for unexpected vet costs, or insurance<\/li><\/ul><small>The €–€€€ rating on breed cards shows the relative monthly running costs.<\/small>","tips.newsletter.h":"✉️ Weekly dog newsletter","tips.newsletter.body":"Every Thursday: the breed of the week, owner tips and a little brain-teaser – free, unsubscribe any time.","tips.newsletter.link":"Subscribe ↗","tips.about.h":"ℹ️ About Pacsi","tips.about.p1":"The traits describe the average for each breed; individual dogs may differ. The portraits are original illustrations made with artificial intelligence. “Pacsi” is Hungarian for “high five”.","tips.about.p2":"<b>Privacy:<\/b> no sign-up, and we don’t collect personal data; favourites are stored only on this device. {host} keeps anonymous, cookie-free visitor statistics on its own server (e.g. which breeds and filters are most popular) – you can switch this off above, in Settings.","tips.credit":"Pacsi was designed and built by <b>DarwinAI<\/b>.","tips.version":"Version: {v}","welcome.eyebrow":"{n} dog breeds · one living cloud","welcome.h1a":"Pick the","welcome.h1b":"dog breed","welcome.h1c":"made for you,","welcome.lead":"so that you both get what you’ve been hoping for.","welcome.body":"Set your filters and see which breed suits you.","welcome.go":"Let’s go!","welcome.next":"Three quick tips follow","welcome.match":"<b>100%<\/b> match","coach.1.h":"This is the breed cloud","coach.1.p.mobile":"{n} dog breeds, all in one place. Tap a bubble to find out who it is.","coach.1.p.desktop":"{n} dog breeds, all in one place. Hover over a bubble to find out who it is.","coach.2.h":"Filter and watch!","coach.2.p.rank":"Switch on a filter and watch who jumps to the front!","coach.2.p.mobile":"Switch on a filter: whatever doesn’t suit you flies out.","coach.2.p.desktop":"Switch on a filter: whatever doesn’t suit you disappears, and the rest grow.","coach.3.h":"Not sure where to start?","coach.3.p":"The Matchmaker quiz is 10 questions, about a minute – and it reshapes the cloud live.","coach.step":"Tip {i}/{n}","coach.skip":"Skip","coach.next":"Next"}},"breeds":{"en":{"nemet-juhaszkutya":{"nev":"German Shepherd","tagline":"Clever, loyal and always ready for a job.","leiras":"The German Shepherd was founded by Max von Stephanitz in 1899 as a versatile herding and working dog. Clever, loyal and highly trainable, it holds its own almost everywhere, from police work and search and rescue to guide dog work. It bonds closely with its family and is reserved with strangers, so it needs early socialisation and consistent training. Be prepared for heavy shedding all year round, and for a dog that soon gets bored without a job.","mozgas":"1.5–2 hours a day, both physical exercise and mental tasks","erdekesseg":"The four-legged star of the popular Austrian crime series “Inspector Rex” (Kommissar Rex) was a German Shepherd too.","kinekIgen":["Active, sporty owners","People who enjoy training and doing dog sports","Families living in a house with a garden"],"kinekNem":["People who struggle with shedding","Small flats with little exercise","Owners who leave the dog alone for many hours a day"],"egeszseg":["Hip dysplasia (screened parents!)","Elbow dysplasia","Degenerative myelopathy","Gastric dilatation-volvulus (bloat)"],"orszag":"Germany","alias":["GSD","German Shepherd Dog","Alsatian"]},"malinois":{"nev":"Belgian Malinois","tagline":"Elite athlete in a fur coat – only for experienced, active owners.","leiras":"The Malinois is one of the four varieties of the Belgian Shepherd, named after the city of Mechelen (Malines in French). An extremely fast, tireless and work-obsessed breed, it is now one of the most sought-after dogs of police forces and armies worldwide. A well-occupied Malinois is a devoted, cooperative companion, but a daily walk is not enough for it: it needs regular, serious work. Bored, it can quickly become tense and destructive, so it suits mainly experienced owners who do dog sports.","mozgas":"2+ hours a day of intense exercise and regular work","erdekesseg":"The US Secret Service also employs Malinois to guard the White House.","kinekIgen":["Experienced owners who do dog sports","People who give the dog several hours a day","Those preparing for tracking or protection work"],"kinekNem":["First-time dog owners","Calm, stay-at-home lifestyles","Families with young children and little spare time"],"egeszseg":["Hip dysplasia","Elbow dysplasia","Epilepsy"],"orszag":"Belgium","alias":["Belgian Shepherd","Malinois"]},"border-collie":{"nev":"Border Collie","tagline":"The genius of the dog world: if you don’t give it a job, it will find one.","leiras":"The Border Collie developed as the working dog of shepherds in the English–Scottish border country and is still one of the world’s best herders. Extremely clever, attentive and hungry for work, it learns lightning fast and is almost unbeatable in dog sports (agility, obedience, herding). If it doesn’t get enough mental and physical work, it finds some for itself – for instance, by trying to herd cars, cyclists or children. It is happy in a family too, but only if the lifestyle is truly active.","mozgas":"2 hours a day, with plenty of mental challenges","erdekesseg":"An American Border Collie called Chaser learned to recognise more than a thousand of its toys by name, and the dog’s abilities were even documented in a scientific paper.","kinekIgen":["Active, sporty owners","Agility and dog sports fans","People living on a farm or in a house with a garden"],"kinekNem":["Leisurely, stay-at-home lifestyles","Owners who leave the dog alone all day","First-time dog owners with no preparation"],"egeszseg":["Collie eye anomaly (CEA)","Hip dysplasia","Epilepsy"],"orszag":"United Kingdom"},"ausztral-juhaszkutya":{"nev":"Australian Shepherd","tagline":"Colourful-coated bundle of energy that herds the family too.","leiras":"Despite its name, the Australian Shepherd developed on farms in the western United States and became truly well known at rodeos in the mid-20th century. A clever, enthusiastic and highly trainable herder, it bonds closely with its family and can be wary of strangers at first. With an active owner it makes a great sports and hiking partner, but without a job it soon gets bored and may start herding children or other animals. Its thick coat sheds heavily, so brushing several times a week is essential.","mozgas":"1.5–2 hours a day, with running and tasks","erdekesseg":"Australian Shepherds often have two different-coloured eyes – or two colours within a single eye – which is completely accepted in the breed.","kinekIgen":["Active families, hikers and runners","Owners who enjoy dog sports","People who spend a lot of time outdoors"],"kinekNem":["Sedentary city-flat lifestyles","Households sensitive to shedding","Days with long hours alone"],"egeszseg":["Hip dysplasia","MDR1 gene mutation (drug sensitivity)","Eye diseases (e.g. cataracts, CEA)","Epilepsy"],"orszag":"USA"},"shetlandi-juhaszkutya":{"nev":"Shetland Sheepdog","tagline":"Mini Collie with a big heart – and an even bigger voice.","leiras":"The Sheltie developed on Scotland’s Shetland Islands as a small herding dog and was later crossed with the Rough Collie as well. Gentle, sensitive and highly trainable, it is very attached to its owner and rather reserved with strangers. It can live happily in a flat if it gets its daily exercise and shared playtime. Be prepared for a dog that loves to bark, and whose thick coat needs regular brushing and sheds heavily.","mozgas":"1 hour of walking a day, with play and learning","erdekesseg":"The breed was originally meant to be recognised as the “Shetland Collie”, but after protests from Collie breeders it ended up with the name Shetland Sheepdog.","kinekIgen":["Families, including those with older children","First-time dog owners who enjoy training","Those interested in agility and obedience"],"kinekNem":["Thin-walled blocks of flats with noise-sensitive neighbours","People who dislike regular brushing"],"egeszseg":["Collie eye anomaly (CEA)","MDR1 gene mutation (drug sensitivity)","Hypothyroidism"],"orszag":"United Kingdom","alias":["Sheltie"]},"welsh-corgi-pembroke":{"nev":"Pembroke Welsh Corgi","tagline":"Short legs, big personality – a royal favourite.","leiras":"The Pembroke Welsh Corgi developed in Pembrokeshire, in south-west Wales, for herding cattle: its low build let it dodge kicks easily. A cheerful, brave and clever dog with a big personality, it loves being the centre of attention. It learns easily and is a good choice for first-time owners, but it may instinctively nip at the heels of running children and likes to bark. It is prone to obesity, which also strains its long back, so watch the portions.","mozgas":"1–1.5 hours a day of walking, play and learning","erdekesseg":"During her reign, the British Queen Elizabeth II kept more than thirty corgis, which is why many people still know the breed as the “royal dog” today.","kinekIgen":["First-time dog owners who enjoy training","Active singles and couples","Families with older children"],"kinekNem":["Quiet, noise-sensitive surroundings","People who struggle with shedding","Very small children (ankle nipping)"],"egeszseg":["Intervertebral disc disease (IVDD)","Degenerative myelopathy","Hip dysplasia","Prone to obesity"],"orszag":"United Kingdom","alias":["Corgi"]},"puli":{"nev":"Puli","tagline":"Walking cloud of dreadlocks: cheerful, nimble and an eternal teenager.","leiras":"For centuries the Puli has been the herding dog of Hungarian shepherds, working beside the flocks alongside the larger guard dogs. Nimble, lively and extremely alert, it is devoted to its family, suspicious of strangers and quick to raise the alarm loudly. Its corded coat sheds little but needs careful care: the cords have to be separated by hand, and after a bath the coat can take up to a whole day to dry. Clever but independent-minded, it needs patient, consistent training.","mozgas":"1–1.5 hours a day, with plenty of play and tasks","erdekesseg":"Beast, the dog of Facebook founder Mark Zuckerberg, is a Puli too.","kinekIgen":["More experienced, active owners","People who enjoy grooming the coat","Those who enjoy dog sports (agility, herding)"],"kinekNem":["People who don’t have time to groom the cords","Those who need a quiet environment","First-time owners new to dogs"],"egeszseg":["Hip dysplasia","Patellar luxation","Skin problems under wet, unkempt cords"],"orszag":"Hungary"},"pumi":{"nev":"Pumi","tagline":"Curly, high-spirited Hungarian herder who notices everything.","leiras":"The Pumi developed in Hungary in the 17th–18th centuries, when the ancient Puli was crossed with western, prick-eared, terrier-type herding dogs. Lively, brave and extremely alert, it notices everything and reports on it all loudly. It learns lightning fast, excels in dog sports, is very attached to its family and is reserved with strangers. Its curly coat sheds little and is easy to manage, but without daily exercise and mental tasks, the high-energy, noisy Pumi can quickly become too much to handle.","mozgas":"1.5–2 hours a day, with plenty of running and tasks","erdekesseg":"The American Kennel Club (AKC) officially recognised the Pumi in 2016, and since then it has become better and better known across the Atlantic.","kinekIgen":["Active, sporty owners","Those who enjoy agility and dog sports","People looking for a low-shedding dog"],"kinekNem":["Noise-sensitive neighbours","Calm, leisurely lifestyles"],"egeszseg":["Hip dysplasia","Patellar luxation"],"orszag":"Hungary"},"mudi":{"nev":"Mudi","tagline":"Hungary’s secret weapon: versatile, quick to learn, an agility champion.","leiras":"The Mudi arose spontaneously among Hungarian herding dogs in the 18th–19th centuries. Extremely versatile, it herds, guards and also excels in dog sports (agility, flyball, obedience). Clever, brave and quick to learn, it is very attached to its family and gets on well with children, but is alert and noisy towards strangers. Its coat is easy to care for, but the Mudi is a lively working dog that needs daily exercise and mental tasks.","mozgas":"1.5–2 hours a day, exercise and mental work","erdekesseg":"It was first described as a breed in its own right only in 1936, by Dr Dezső Fényes; until then it had not been sharply distinguished from the Puli and the Pumi.","kinekIgen":["Active, sporty families","Agility and dog sports fans","People who want an easy-care coat"],"kinekNem":["Sedentary, stay-at-home lifestyles","Noise-sensitive, crowded blocks of flats","Days with long hours alone"],"egeszseg":["Hip dysplasia","Elbow dysplasia","Epilepsy"],"orszag":"Hungary"},"komondor":{"nev":"Komondor","tagline":"White corded guardian angel that defends its flock at all costs.","leiras":"For centuries the Komondor has been the livestock guardian of Hungarian shepherds: it did not herd, but protected the animals from wolves and thieves. Calm, dignified and independent, it takes guarding the family and territory entrusted to it very seriously and is suspicious of strangers. Its white, corded coat is unique but demands a great deal of care: the cords must be separated regularly, and after a bath the coat can take a day or two to dry. It needs an experienced owner, a spacious fenced yard and early, thorough socialisation.","mozgas":"1 hour of calm walking a day, plus a patrol of the yard","erdekesseg":"With its white, corded coat it almost blends into a flock of sheep, and the thick cords also protect it from predators’ bites.","kinekIgen":["Experienced owners used to large dogs","Those with a spacious, well-fenced yard","People committed to coat grooming"],"kinekNem":["First-time dog owners","Flats and city lifestyles","Busy households with lots of visitors"],"egeszseg":["Hip dysplasia","Gastric dilatation-volvulus (bloat)","Skin problems under wet, unkempt cords"],"orszag":"Hungary"},"kuvasz":{"nev":"Kuvasz","tagline":"Noble white guardian: gentle with the family, bold with strangers.","leiras":"The Kuvasz is an ancient Hungarian livestock guardian that for centuries protected shepherds’ animals from predators. It is gently attached to its family and can be patient with children, but is reserved with strangers and boldly stands up for “its flock”. Bred to make independent decisions, it is not known for blind obedience: it needs patient, consistent training and early socialisation. Its white, wavy coat sheds heavily, and an adult Kuvasz needs plenty of space.","mozgas":"1–1.5 hours of walking a day, plus free roaming in the yard","erdekesseg":"After the Second World War the breed was on the brink of extinction and had to be rebuilt from a few surviving dogs.","kinekIgen":["Experienced owners used to large dogs","Those living in a house with a large fenced yard","People looking for a reliable watchdog"],"kinekNem":["First-time dog owners","Flats and city lifestyles","People who struggle with shedding"],"egeszseg":["Hip dysplasia","Osteochondritis dissecans (OCD)","Hypothyroidism","Gastric dilatation-volvulus (bloat)"],"orszag":"Hungary"},"rottweiler":{"nev":"Rottweiler","tagline":"Calm strength and devotion – needs consistent training.","leiras":"The Rottweiler is named after the German town of Rottweil, where butchers used it to drive cattle and pull carts. Calm, self-assured and extremely loyal, it protects its family naturally and rarely barks without reason. It is highly trainable and happy to work, but because of its great strength it needs consistent, positive training and thorough socialisation from puppyhood. In some countries keeping one requires a permit, so check the local rules.","mozgas":"1–1.5 hours a day of walking and shared tasks","erdekesseg":"In the early 20th century it was officially recognised as a police dog breed in Germany.","kinekIgen":["Experienced, confident owners","People who enjoy going to dog training classes","Active families living in a house with a garden"],"kinekNem":["First-time dog owners","Small flats with little exercise","People who can’t physically handle a strong dog"],"egeszseg":["Hip and elbow dysplasia","Bone cancer (osteosarcoma)","Cruciate ligament rupture","Aortic stenosis"],"orszag":"Germany"},"dobermann":{"nev":"Dobermann","tagline":"Elegant bodyguard, secretly convinced it’s a lapdog.","leiras":"The breed was developed by Louis Dobermann, a tax collector from Thuringia, in the late 19th century to be a reliable companion and protector. Elegant, energetic and extremely intelligent, it learns quickly and willingly. It is very attached to its family, seeks closeness and is alert with strangers. Its short coat is easy to groom, but it feels the cold and needs plenty of exercise, and because heart muscle disease (cardiomyopathy) is common in the breed, regular heart screening is recommended.","mozgas":"1.5–2 hours a day, with running and tasks","erdekesseg":"In the Second World War it was one of the main combat dogs of the US Marine Corps; the statue on the war dog memorial in Guam also portrays a Dobermann.","kinekIgen":["Active, sporty owners","People who enjoy training and doing dog sports","Families where the dog can live indoors"],"kinekNem":["Outdoor living in cold weather","Days with long hours alone","First-time dog owners with no preparation"],"egeszseg":["Dilated cardiomyopathy (heart muscle dilation)","Von Willebrand disease (clotting disorder)","Wobbler syndrome","Hip dysplasia"],"orszag":"Germany","alias":["Doberman","Doberman Pinscher"]},"nemet-boxer":{"nev":"Boxer","tagline":"Eternal clown in a muscular body – a children’s favourite.","leiras":"The Boxer developed in Munich in the late 19th century as a descendant of the old Bullenbeisser (“bull biter”) type of dog. Playful, cheerful and extremely patient with children, it is also an alert watchdog. It matures slowly: it often behaves like a puppy until the age of three, so enthusiastic jumping and pulling on the lead are worth tackling early. Because of its short muzzle it tolerates heat poorly, and in summer exercise must be scheduled for the cooler hours.","mozgas":"1–1.5 hours a day, with lots of play; in summer during the cool hours","erdekesseg":"In the First World War, Boxers were used as messenger dogs, pack dogs and guard dogs.","kinekIgen":["Active families with children","People who love a playful, goofy dog","Those who commit to regular exercise together"],"kinekNem":["Calm, quiet lifestyles","Hot, poorly ventilated surroundings","Days with long hours alone"],"egeszseg":["Heart disease (Boxer cardiomyopathy, aortic stenosis)","Cancers (e.g. mast cell tumours)","Hip dysplasia","Prone to heatstroke"],"orszag":"Germany","alias":["German Boxer"]},"torpe-schnauzer":{"nev":"Miniature Schnauzer","tagline":"Bearded little sage and alert watchdog, in pocket size.","leiras":"The Miniature Schnauzer developed in Germany in the late 19th century by crossing the Standard Schnauzer with smaller breeds, originally as a ratter on farms and in stables. A lively, clever and cheerful dog, it is attached to its family and is a good choice for first-time owners. It does very well in a flat, but as an alert watchdog it announces every noise loudly, so it is worth working on barking early. Its wire coat sheds little but needs regular trimming and beard care.","mozgas":"1 hour of walking a day, with play and nose work","erdekesseg":"The name Schnauzer comes from the German word “Schnauze” (muzzle, snout), referring to the breed’s characteristic bearded muzzle.","kinekIgen":["First-time dog owners living in a flat","Families with children","People looking for a low-shedding dog"],"kinekNem":["Noise-sensitive neighbours","People unwilling to commit to regular trimming"],"egeszseg":["Pancreatitis","Hyperlipidaemia (high blood fat levels)","Urinary stones","Eye diseases (e.g. cataracts, PRA)"],"orszag":"Germany","alias":["Mini Schnauzer"]},"cane-corso":{"nev":"Cane Corso","tagline":"Italian bodyguard: imposing, loyal – a serious responsibility.","leiras":"A descendant of the ancient Roman molossers, it guarded estates and livestock in southern Italy for centuries and even helped with big-game hunting. Calm, self-assured and extremely loyal to its family, it is reserved with strangers and takes its guarding role seriously. It is clever and learns willingly, but needs early, thorough socialisation and a consistent, calm hand, so it suits an experienced owner better. In some countries keeping one requires a permit, so check the local rules.","mozgas":"1–1.5 hours a day of walking, play and shared tasks","erdekesseg":"By the mid-20th century it had almost completely disappeared, and it survives only thanks to an Italian rescue programme launched in the 1970s.","kinekIgen":["Experienced, confident dog owners","Calm families living in a house with a garden","Anyone looking for a dedicated guard and protection companion"],"kinekNem":["First-time dog owners","Small flats with no garden","Anyone bothered by drooling"],"egeszseg":["Hip and elbow dysplasia","Gastric dilatation-volvulus (bloat)","Eyelid abnormalities (entropion, ectropion)"],"orszag":"Italy","alias":["Italian Mastiff"]},"nemet-dog":{"nev":"Great Dane","tagline":"The Apollo of dogs: giant size, gentle heart.","leiras":"Although its name suggests Danish origins, the Great Dane developed in Germany, originally for wild boar hunting and guarding grand estates. Despite its enormous size it is calm, gentle and very affectionate, happily leans on its owner and is patient with children. At home it is a surprisingly quiet couch potato, but its space needs, appetite and running costs are all enormous too. Sadly it is a short-lived breed, so it is especially important to choose a puppy from health-screened parents.","mozgas":"1–1.5 hours of calm walking a day, with gentle exercise during puppyhood","erdekesseg":"According to Guinness World Records, the tallest dog of all time, Zeus, who stood 111.8 cm at the withers, was a Great Dane – and so is the cartoon hero Scooby-Doo.","kinekIgen":["Calm, patient families","Those living in a spacious home with a garden","People who adore gentle giants"],"kinekNem":["Small flats or small cars","Tight dog budgets","Anyone bothered by drooling"],"egeszseg":["Gastric dilatation-volvulus (bloat)","Dilated cardiomyopathy (heart muscle disease)","Hip dysplasia","Bone cancer (osteosarcoma)"],"orszag":"Germany"},"berni-pasztorkutya":{"nev":"Bernese Mountain Dog","tagline":"Tricolour mountain teddy bear with endless patience.","leiras":"It was the all-rounder of farms in the Swiss Alps: it pulled small carts, herded livestock and guarded the yard. Calm, good-natured and endlessly patient, especially sweet with children, it doesn’t like to be away from its family for long. It learns willingly and first-time owners can cope with it, but its thick, tricolour coat sheds heavily and it struggles in a heatwave. Sadly it is a short-lived breed, and cancers are more common in it than average.","mozgas":"1–1.5 hours of walking a day, in summer during the cool hours","erdekesseg":"In Switzerland it used to be harnessed to small carts loaded with milk churns, and cart pulling is still a popular dog sport among the breed’s fans.","kinekIgen":["Families with children, in a house with a garden","Those who enjoy cool weather and long walks","Well-prepared owners getting their first large dog"],"kinekNem":["Anyone bothered by lots of dog hair","Small flats with lots of stairs","Many hours alone every day"],"egeszseg":["Cancers (e.g. histiocytic sarcoma)","Hip and elbow dysplasia","Gastric dilatation-volvulus (bloat)"],"orszag":"Switzerland","alias":["Bernese"]},"bernathegyi":{"nev":"Saint Bernard","tagline":"Legendary rescue dog: calm, kindly – and a drooler.","leiras":"It was kept by the monks of the hospice at the Great St Bernard Pass in Switzerland and for generations helped find travellers lost in snowstorms. A calm, kindly and patient giant that practically takes children into its care. It is content with little exercise, but because of its weight, good lead manners and basic obedience matter from puppyhood. Be prepared for drooling, heavy shedding and the fact that it tolerates heat very badly.","mozgas":"About 1 hour of calm walking a day, less in a heatwave","erdekesseg":"Its most famous representative, Barry, is said by tradition to have saved more than 40 people in the early 19th century; his stuffed body can be seen today in the Natural History Museum of Bern.","kinekIgen":["Calm families with children","Those living in a large house with a garden","People who like cool weather"],"kinekNem":["Anyone bothered by drool and hair","Small flats or hot climates","Tight dog budgets"],"egeszseg":["Hip and elbow dysplasia","Gastric dilatation-volvulus (bloat)","Eyelid abnormalities (entropion, ectropion)","Dilated cardiomyopathy (heart muscle disease)"],"orszag":"Switzerland","alias":["St. Bernard","St Bernard"]},"uj-fundlandi":{"nev":"Newfoundland","tagline":"Swimming nanny: the gentle giant of water rescue.","leiras":"In Canada, on the island of Newfoundland, it was the fishermen’s workmate: it hauled nets, carried loads and rescued people who had fallen into the water. Extremely gentle, patient and well balanced, it is legendarily tender with children and rarely heard barking. Thanks to its webbed feet and water-repellent coat it loves swimming, so the lakeside is its favourite territory. Its thick double coat needs brushing several times a week and sheds heavily, and you must reckon with drooling too.","mozgas":"About 1 hour of walking a day, best with some swimming","erdekesseg":"A Newfoundland called Seaman accompanied Lewis and Clark’s famous expedition (1804–1806) all the way across North America to the Pacific Ocean.","kinekIgen":["Calm families with children","Those living near water, in a house with a garden","People who enjoy brushing and combing"],"kinekNem":["Anyone bothered by drool and hair","Small flats or hot climates","Anyone looking for an alert watchdog"],"egeszseg":["Hip and elbow dysplasia","Aortic stenosis (SAS, congenital heart disease)","Cystinuria (urinary stones)","Gastric dilatation-volvulus (bloat)"],"orszag":"Canada","alias":["Newfie"]},"angol-bulldog":{"nev":"English Bulldog","tagline":"Grumpy face, heart of gold – a true couch captain.","leiras":"Its ancestors were used for bull-baiting in England for centuries, but today’s English Bulldog is a far cry from that: a calm, sweet and affectionate companion. It tolerates children well and feels best near the sofa. It can be stubborn, so it is best raised with patience and treats. Because of its flat nose, breathing difficulties are common, and it copes badly with heat and exertion, so only choose one from health-screened parents.","mozgas":"2–3 short, calm walks a day, taking it easy in warm weather","erdekesseg":"In the Second World War it became a symbol of British resilience, and Winston Churchill was often compared to a Bulldog.","kinekIgen":["Calm, stay-at-home owners","City flats and short walks","Patient families with a sense of humour"],"kinekNem":["Active owners looking for a running partner","Hot homes without air conditioning","Anyone who can’t afford high vet bills"],"egeszseg":["Brachycephalic syndrome (breathing difficulties)","Skin fold dermatitis","Hip dysplasia","Eye problems (e.g. cherry eye, entropion)"],"orszag":"United Kingdom","alias":["Bulldog","British Bulldog"]},"yorkshire-terrier":{"nev":"Yorkshire Terrier","tagline":"Silk-maned little boss, blissfully unaware of its size.","leiras":"In 19th-century northern England, in the factories and mines of Yorkshire and Lancashire, it was a ratter, and only later became the darling of the drawing rooms. Its tiny body holds a big terrier soul: brave, lively, curious, very attached to its owner, and happy to bark at anything that moves. It sheds little, but its long, silky coat needs daily combing or regular clipping short. It is fragile, so it needs supervision around small children, and its teeth need regular care too.","mozgas":"30–60 minutes of walking and play a day","erdekesseg":"In the Second World War, a Yorkshire Terrier named Smoky crawled through a narrow pipe in the Philippines, pulling a telegraph wire through it, so the soldiers did not have to start days of risky digging.","kinekIgen":["Those living in a small city flat","Adult households or families with older children","People who enjoy coat grooming"],"kinekNem":["If quiet matters – it barks a lot","Busy families with young children","People who won’t make time for combing"],"egeszseg":["Patellar luxation","Tartar, early tooth loss","Tracheal collapse","Portosystemic shunt (liver blood vessel abnormality)"],"orszag":"United Kingdom"},"jack-russell-terrier":{"nev":"Jack Russell Terrier","tagline":"Spring-legged little hunter with inexhaustible energy.","leiras":"It is named after the English clergyman John “Jack” Russell, who in the early 19th century bred these nimble little terriers for fox hunting. Cheerful, pushy and astonishingly tenacious: if it isn’t given a job, it quickly finds one, such as digging up the garden or chewing furniture. Clever but strong-willed, it needs consistent, playful training, and in dog sports it is a real little champion. Because of its strong hunting instinct, take care around cats and small pets, and when letting it off the lead.","mozgas":"1–1.5 hours of active exercise a day, with plenty of play and tasks","erdekesseg":"Uggie, the canine star of the Oscar-winning film “The Artist”, was a Jack Russell Terrier too.","kinekIgen":["Active, sporty owners","Those who enjoy dog sports (agility, flyball)","Lively families with older children"],"kinekNem":["First-time dog owners longing for a quiet life","Homes with cats, rabbits or rodents","Many hours alone every day"],"egeszseg":["Patellar luxation","Primary lens luxation (eye disease)","Congenital deafness","Legg–Calvé–Perthes disease (femoral head necrosis)"],"orszag":"United Kingdom","alias":["JRT"]},"west-highland-white-terrier":{"nev":"West Highland White Terrier","tagline":"Snow-white, self-assured little Scot with plenty of humour.","leiras":"It was bred in the Scottish Highlands from small terriers working on rocky ground to hunt foxes and rodents. A confident, cheerful and friendly little dog with plenty of terrier independence and humour, it loves being at the centre of the family. It copes well in a flat and first-time owners get along with it, but it likes to bark, and outdoors it craves adventure. It has sensitive skin: allergic dermatitis is common, and its wiry coat needs regular trimming.","mozgas":"About 1 hour of walking and play a day","erdekesseg":"It used to be called the Poltalloch Terrier too, after the Scottish Malcolm family’s estate, where the white line was deliberately bred.","kinekIgen":["Owners living in a city flat","Playful families with their first dog","Active older owners too"],"kinekNem":["If quiet matters","Homes with rabbits, rodents or other small pets","Anyone unwilling to commit to skin and coat care"],"egeszseg":["Allergic dermatitis (atopy)","Pulmonary fibrosis (in later life)","Craniomandibular osteopathy (CMO, in puppies)"],"orszag":"United Kingdom"},"staffordshire-bullterrier":{"nev":"Staffordshire Bull Terrier","tagline":"Muscle giant in a small package that adores its people.","leiras":"It developed in 19th-century England, in the county of Staffordshire, and quickly became a favourite companion of working-class families. Muscular, strong and brave, yet extremely people-loving and famously patient with children. Energetic, so it needs lots of play and exercise, but it doesn’t always get on with other dogs, so early socialisation is important. In some countries keeping one requires a permit or is restricted, so check the local rules.","mozgas":"1–1.5 hours a day of walking, running and shared play","erdekesseg":"The British Kennel Club’s breed standard specifically highlights that the Staffie is especially devoted to children.","kinekIgen":["Active families with children","People who spend a lot of time with their dog","Playful, sporty owners in the city"],"kinekNem":["Many hours alone every day","Those looking for a calm, low-activity dog","Anyone looking for a watchdog – it befriends everyone"],"egeszseg":["Hereditary cataracts (DNA test available)","L2-HGA (metabolic neurological disease)","Skin allergies","Patellar luxation"],"orszag":"United Kingdom"},"amerikai-staffordshire-terrier":{"nev":"American Staffordshire Terrier","tagline":"Strong, brave and devoted – best in experienced hands.","leiras":"It developed in the United States in the 19th century from English bulldog–terrier type dogs brought over from England, and grew larger and stronger than its English cousin. Strong, brave and very affectionate, it is sweet with its family and often a real clown who loves to be near its owner. It needs an experienced, consistent owner and early socialisation, because it does not always get along with other dogs. In some countries keeping one requires a licence or is restricted, so find out about the local rules in advance.","mozgas":"1–1.5 hours a day of walking, running and strength-based play","erdekesseg":"In 1936 the American Kennel Club still recognised it as the “Staffordshire Terrier”; it received its present name in 1972, to tell it apart from its smaller English relative.","kinekIgen":["Experienced, consistent owners","Active, sporty families","People who enjoy going to dog training classes"],"kinekNem":["First-time dog owners","Multi-dog households with no preparation","Many hours alone every day"],"egeszseg":["Hip and elbow dysplasia","Cerebellar ataxia (NCL-A, DNA test available)","Skin allergies","Hypothyroidism"],"orszag":"USA"},"tacsko":{"nev":"Dachshund","tagline":"Long body, huge courage – the badger hunter who rules the sofa too.","leiras":"Bred in Germany for badger and fox hunting: its name (Dachshund) literally means “badger dog” in German, and its short legs helped it in the burrow. Brave, curious and very affectionate, but also strong-willed, and it announces everything with loud barking. It comes in three coat varieties (short, long and wire-haired) and several sizes, so it can fit into many kinds of homes. Because of its long spine it is prone to intervertebral disc disease, so avoid lots of stair climbing, jumping and excess weight.","mozgas":"About 1 hour of walking a day with plenty of sniffing, no jumping","erdekesseg":"The mascot of the 1972 Munich Olympics, the stripy Waldi, was a Dachshund – the first official Olympic mascot.","kinekIgen":["Flat dwellers, if there is a lift","Patient owners with a sense of humour","Adult households or families with older children"],"kinekNem":["If quiet matters","Homes with no lift and lots of stairs","Anyone expecting a quick, obedient pupil"],"egeszseg":["Intervertebral disc disease (IVDD)","Obesity (also strains the spine)","Progressive retinal atrophy (PRA)"],"orszag":"Germany","alias":["Wiener dog","sausage dog","doxie"]},"sziberiai-husky":{"nev":"Siberian Husky","tagline":"Ice-blue-eyed escape artist who would rather sing than bark.","leiras":"In north-eastern Siberia the Chukchi people bred it for sled pulling; it reached Alaska in the early 20th century and spread from there worldwide. A friendly, cheerful pack dog that gets along with almost everyone, so it is not at all suited as a guard dog. It rarely barks, but is all the keener to howl and “sing”, and with its huge need for exercise it is a true escape artist, so it needs a tall, secure fence. Independent-minded, it finds recall hard to learn, and twice a year it sheds its undercoat in huge amounts.","mozgas":"2 hours a day or more, ideally with running and pulling","erdekesseg":"In 1925 sled dogs carried diphtheria serum in a relay to Nome, Alaska, which was struck by an epidemic; the two most famous lead dogs, Balto and Togo, were Siberian Huskies too.","kinekIgen":["Runners, cyclists and sled dog sport enthusiasts","Very active owners who like cold weather","Experienced, patient dog owners with a sense of humour"],"kinekNem":["First-time dog owners","Small flats with little exercise","Households with cats or small pets"],"egeszseg":["Hereditary cataracts","Progressive retinal atrophy (PRA)","Corneal dystrophy"],"orszag":"Siberia / USA"},"szamojed":{"nev":"Samoyed","tagline":"A smiling snow cloud who counts everyone as a friend.","leiras":"It is named after the Siberian Samoyedic peoples (including the Nenets), who kept it for reindeer herding, sled pulling and companionship. An extremely friendly, cheerful and sociable dog: it regards everyone as a friend, so it is no guard dog, but it adores children. A chatty dog that likes to bark and “comment”, and when bored or left alone a lot, it lets you know loudly. Its snow-white, thick coat sheds heavily and needs regular, thorough brushing, and it finds great summer heat hard to bear.","mozgas":"1.5–2 hours a day of walking, running and play – in summer, during the cool hours","erdekesseg":"Genetic studies place the Samoyed among the most ancient dog breeds, alongside the likes of the Siberian Husky or the Akita.","kinekIgen":["Sociable families with children","Active owners who like cold weather","People who enjoy combing (and vacuuming)"],"kinekNem":["Anyone bothered by lots of hair","Many hours alone every day","Anyone looking for a watchdog"],"egeszseg":["Hip dysplasia","Hereditary kidney disease (glomerulopathy)","Diabetes","Eye diseases (PRA, glaucoma)"],"orszag":"Russia","alias":["Sammy"]},"pomeraniai-torpespicc":{"nev":"Pomeranian","tagline":"A fluffy pompom with a surprisingly big voice.","leiras":"A descendant of the larger German Spitzes, it is named after Pomerania on the Baltic Sea, and it acquired its tiny size largely in 19th-century England, as Queen Victoria’s favourite. A lively, curious and confident little dog that loves attention and barks at every little noise. Ideal in a flat and a loyal companion, but it is fragile, so it is less recommended around small children. Its thick double coat needs regular brushing and sheds heavily.","mozgas":"30–60 minutes of walking a day plus play indoors","erdekesseg":"Only three dogs survived the 1912 Titanic disaster, and two of them were Pomeranians.","kinekIgen":["Owners living in a city flat","Adult households or families with older children","Attentive first-time dog owners"],"kinekNem":["Families with young children","If quiet matters","People who dislike combing"],"egeszseg":["Patellar luxation","Tracheal collapse","Alopecia X (hair loss)","Tartar, dental disease"],"orszag":"Germany / Poland","alias":["Pom"]},"shiba-inu":{"nev":"Shiba Inu","tagline":"Cat-hearted Japanese rebel: clean, independent, stubborn.","leiras":"The Shiba Inu hunted small game in the mountains of Japan and is the smallest of the six native Japanese breeds. A clean, almost cat-like self-groomer and an independent dog that is attached to its family, but prefers to be petted in its own time. It barks little, but if something displeases it, it protests with a loud “Shiba scream”. Because of its strong hunting instinct and stubbornness its recall is unreliable, so on walks it mostly stays on the lead.","mozgas":"1 hour of walking a day, mostly on the lead","erdekesseg":"The star of the world-famous “Doge” internet meme, the Japanese dog called Kabosu, was also a Shiba Inu.","kinekIgen":["Patient, consistent owners","People who respect a dog’s independence","City flats too, with regular walks"],"kinekNem":["Inexperienced first-time dog owners","Anyone wanting a dog that can be recalled off the lead","Anyone bothered by heavy moulting twice a year"],"egeszseg":["Patellar luxation","Allergic dermatitis","Glaucoma"],"orszag":"Japan"},"akita-inu":{"nev":"Akita","tagline":"Dignified, quiet, one-person loyalty.","leiras":"The Akita comes from the mountains of Japan’s northern Akita Prefecture, where it was once used to hunt big game and also kept as a guard dog. A dignified, calm and quiet dog that is deeply loyal to its family but reserved with strangers. It is well balanced at home, but strong-willed, and often does not get on with other dogs – especially of the same sex. It needs early, thorough socialisation and a confident, consistent owner, so it is not recommended for beginners.","mozgas":"1–1.5 hours a day of calm, regular walks","erdekesseg":"The most famous Akita, Hachiko, waited every day for nearly ten years for his late owner at Shibuya station in Tokyo, where a statue now keeps his memory alive.","kinekIgen":["Experienced, confident, consistent owners","Calm, adult-only households","Houses with a garden where it has something to guard"],"kinekNem":["First-time dog owners","Families with young children","Multi-dog households or sociable dog groups"],"egeszseg":["Hip dysplasia","Autoimmune diseases (e.g. sebaceous adenitis)","Hypothyroidism","Gastric dilatation-volvulus (bloat)"],"orszag":"Japan","alias":["Akita Inu","Japanese Akita"]},"beagle":{"nev":"Beagle","tagline":"A cheerful pack dog who thinks with his nose – always ready to make a break for it.","leiras":"The Beagle developed in England, where it followed the scent of hares in a pack. Cheerful, friendly and patient, it gets on well with children and other dogs, and finds its pack in its family. But its nose always leads the way: when it catches an interesting scent, it forgets the recall, and it is a clever escape artist. It signals with loud, drawn-out baying, and when left alone it gets bored, so not every neighbour will love it.","mozgas":"1–1.5 hours of walking a day, with plenty of sniffing","erdekesseg":"Snoopy, the world-famous character of the Peanuts comics, is a Beagle too – and thanks to their excellent noses, in several countries they are used at airports to sniff out banned food in luggage.","kinekIgen":["Cheerful families with children","People who have or will get another dog","Patient owners who train with treats"],"kinekNem":["Thin-walled flats with sensitive neighbours","Anyone who wants to walk off the lead","Owners who leave the dog alone all day"],"egeszseg":["Epilepsy","Hypothyroidism","Intervertebral disc disease (IVDD)","Prone to obesity"],"orszag":"United Kingdom"},"dalmata":{"nev":"Dalmatian","tagline":"Spotted running champion who needs loads of exercise.","leiras":"The Dalmatian is named after Dalmatia in Croatia and became famous in the 18th–19th centuries as an escort and guard dog running alongside horse-drawn carriages. That is the source of its enormous stamina, which has lasted to this day: an energetic, playful, people-oriented dog and an excellent running partner. Despite its short coat it sheds heavily all year round, and the needle-like hairs get stuck in everything. Without exercise and activity it gets bored and destructive, and its boisterous play can be too much for small children.","mozgas":"2 hours a day, including running or cycling","erdekesseg":"Dalmatian puppies are born pure white; their characteristic spots only begin to appear in the first weeks.","kinekIgen":["Runners, cyclists and hikers","Active families with older children","People who spend a lot of time with their dog"],"kinekNem":["Anyone bothered by hair everywhere","Leisurely lifestyles with little exercise","Work schedules that mean long hours alone"],"egeszseg":["Congenital deafness (hearing-screened parents!)","Urinary stones (urate stones)","Skin allergies"],"orszag":"Croatia","alias":["Dalmation"]},"erdelyi-kopo":{"nev":"Transylvanian Hound","tagline":"Hunter of the Carpathians: tenacious, brave, with a ringing voice.","leiras":"For centuries the Transylvanian Hound has been the hunting dog of the Carpathian forests, signalling the trail of game with its ringing, far-carrying voice. Well balanced, good-natured, brave and extremely tenacious, it is faithfully devoted to its family and gets on well with children too. When hunting it works independently, so once it picks up a scent it is hard to call back. It needs a spacious, well-fenced garden and plenty of exercise, and does not feel at home in a flat or in city life.","mozgas":"2 hours a day or more, with lots of exercise out in open country","erdekesseg":"There used to be two varieties: the long-legged one was used for big game, the short-legged one for fox and hare – today you almost only meet the long-legged type.","kinekIgen":["Hunters and active country families","Houses with a garden and strong fencing","Those who enjoy long hikes and woodland walks"],"kinekNem":["Flats and city lifestyles","First-time dog owners","Anyone bothered by loud baying"],"egeszseg":["Hip dysplasia (screened parents!)","Ear infections (floppy ears)"],"orszag":"Hungary","alias":["Erdélyi kopó","Hungarian Hound"]},"basset-hound":{"nev":"Basset Hound","tagline":"Floppy ears, soulful eyes, endless calm (and a nose).","leiras":"The Basset Hound developed in France, where hunters on foot used these low-slung dogs with excellent scenting ability to follow the trail of hares. Calm, gentle and patient, friendly with children and other dogs, and a true sofa-dweller at home. On walks, however, its nose is in charge: it stubbornly follows scents, and likes to bay in its deep, booming voice. Its long back and drooping ears need careful attention, and expect drooling too.","mozgas":"1 hour of leisurely walking a day, with plenty of sniffing","erdekesseg":"Its name comes from the French “bas” (low), which refers to its short legs.","kinekIgen":["Calm-paced families, including those with children","Flats with few stairs or a lift","Patient owners with a sense of humour"],"kinekNem":["Those looking for a running partner or a dog-sports dog","Anyone expecting perfect obedience","Anyone bothered by drool and baying"],"egeszseg":["Intervertebral disc disease (IVDD), back problems","Ear infections","Eyelid abnormalities (ectropion, entropion)","Glaucoma"],"orszag":"France"},"rhodesiai-ridgeback":{"nev":"Rhodesian Ridgeback","tagline":"“Ridged” back, calm, strong, an independent thinker.","leiras":"The Rhodesian Ridgeback developed in South Africa from the dogs of European settlers and the local, ridge-backed Khoikhoi dogs; it is named after the strip of hair on its back that grows in the opposite direction. At home it is calm, dignified and loyal, gentle with its family and reserved with strangers. It barks little, but it is a strong, independent thinker, so it needs early socialisation and patient, consistent training. Because of its strong hunting instinct it may chase smaller animals.","mozgas":"1.5–2 hours a day, with free running in a fenced area","erdekesseg":"It was once also called the “African lion dog”, because in a small pack it could hold a lion at bay until the hunter arrived.","kinekIgen":["Experienced, active owners","Runners, hikers and horse riders","Calm, consistent families"],"kinekNem":["First-time dog owners","Households with a cat, unless they grew up together","Outdoor living (thin coat, no undercoat)"],"egeszseg":["Dermoid sinus (congenital skin tract on the back)","Hip and elbow dysplasia","Hypothyroidism"],"orszag":"South Africa / Zimbabwe","alias":["Ridgeback"]},"magyar-vizsla":{"nev":"Hungarian Vizsla","tagline":"Golden-brown Velcro dog: always at its owner’s side.","leiras":"The Hungarian Vizsla has been the companion of hunters in the Carpathian Basin for centuries. A sensitive, extremely affectionate breed that is happiest close to its owner, so it is not suited to a kennel or to long periods alone. It learns quickly, but cannot bear harsh treatment. If it gets its daily proper run and is raised with positive reinforcement, it is an excellent family and sports companion – without exercise, however, it can become restless and destructive.","mozgas":"1.5–2 hours a day, with plenty of off-lead running","erdekesseg":"Several times in its history – most recently after the Second World War – it came close to extinction, but breeders revived it from a few surviving dogs.","kinekIgen":["Active families, runners and cyclists","People who spend a lot of time at home","Those who enjoy dog sports (agility, canicross)"],"kinekNem":["Owners who leave the dog alone for 8–10 hours a day","Sedentary lifestyles","Outdoor kennel living (no undercoat)"],"egeszseg":["Hip dysplasia (screened parents!)","Epilepsy","Skin allergies"],"orszag":"Hungary","alias":["Magyar Vizsla","Hungarian Pointer","Hungarian Short-haired Pointer"]},"drotszoru-magyar-vizsla":{"nev":"Hungarian Wirehaired Vizsla","tagline":"The bearded, hard-wearing Vizsla – at home in water and thick undergrowth.","leiras":"The Hungarian Wirehaired Vizsla came into being in the first half of the 20th century to be a hunting dog that works tirelessly even on harsh, cold and wet terrain. Like its short-haired relative it is affectionate, quick to learn and sensitive, and patient with children, with a somewhat sturdier build. Its harsh, dense coat protects it well; weekly brushing and the occasional hand-stripping are enough. It needs plenty of exercise and tasks, and is unhappy when left alone or idle.","mozgas":"1.5–2 hours a day, with free running, even swimming","erdekesseg":"It was created in the 1930s by crossing Hungarian Vizslas with German Wirehaired Pointers, so that it would cope better with cold and water.","kinekIgen":["Hunters and active, outdoorsy families","People who enjoy hiking and swimming with their dog","Those who enjoy dog sports"],"kinekNem":["Owners who leave the dog alone all day","Small flats with little exercise","Anyone looking for a calm sofa dog"],"egeszseg":["Hip dysplasia (screened parents!)","Elbow dysplasia"],"orszag":"Hungary","alias":["Wirehaired Vizsla","Hungarian Wire-haired Pointer"]},"weimari-vizsla":{"nev":"Weimaraner","tagline":"Silver-grey ghost: elegant, energetic, devoted.","leiras":"The Weimaraner became known in the 19th century as the hunting dog of the grand ducal court of Weimar; you can recognise it from afar by its silver-grey colour and pale eyes. Intelligent, energetic and extremely devoted, it follows its owner like a shadow, and it has guarding instincts too. Left alone it is prone to separation anxiety, and when bored it destroys things or makes a racket. Because of its strong will and hunting instinct it needs an experienced, consistent owner and plenty of exercise every day.","mozgas":"2 hours a day, with running and mental challenges","erdekesseg":"Since the 1970s the American art photographer William Wegman has become world-famous for his humorous, often costumed pictures featuring Weimaraners.","kinekIgen":["Active, experienced owners","Runners, cyclists and hunters","People who spend a lot of time at home"],"kinekNem":["First-time dog owners","Work schedules that mean long hours alone","Households with cats or small pets"],"egeszseg":["Gastric dilatation-volvulus (bloat)","Hip dysplasia","Hypothyroidism"],"orszag":"Germany","alias":["Weim"]},"rovidszoru-nemet-vizsla":{"nev":"German Shorthaired Pointer","tagline":"Hunter and athlete, ready for any terrain.","leiras":"The German Shorthaired Pointer (Kurzhaar) was born in 19th-century Germany as a true all-rounder: it points game, retrieves, follows a trail and works in water too. A cheerful, friendly, quick-to-learn dog, patient with children, with almost inexhaustible stamina. At home it is calm only if it has been thoroughly tired out outdoors beforehand, otherwise it gets bored, destructive or tries to escape. It stays puppy-like and bouncy for a long time, so it needs several hours of active programme every day.","mozgas":"2 hours a day or more, mostly running","erdekesseg":"In 2016 a German Shorthaired Pointer named CJ won Best in Show at the prestigious Westminster dog show in New York.","kinekIgen":["Hunters and sporty families","Runners, cyclists and hikers","Those living in a house with a garden"],"kinekNem":["Leisurely lifestyles with little exercise","Small flats with the dog alone all day","Anyone who can’t spare several hours a day"],"egeszseg":["Hip dysplasia","Gastric dilatation-volvulus (bloat)","Von Willebrand disease (clotting disorder)"],"orszag":"Germany"},"ir-szetter":{"nev":"Irish Setter","tagline":"Red silk, eternal high spirits and lots of running.","leiras":"The Irish Setter developed in 18th–19th-century Ireland for bird hunting: when it finds game, it signals by freezing and crouching low – hence its name (English “to set”). Cheerful and friendly, it likes children and other dogs, and is a true eternal teenager. It matures slowly, stays scatty and easily distracted for a long time, so training takes patience. Its silky red coat must be brushed several times a week, and it needs masses of running.","mozgas":"2 hours a day, with plenty of off-lead running","erdekesseg":"The solid red setter became dominant in the 19th century; the older red-and-white type is now a separate breed, the Irish Red and White Setter.","kinekIgen":["Active families, including those with children","Runners and hikers","People who enjoy combing regularly"],"kinekNem":["Small flats with little exercise","Anyone expecting a calm dog that matures quickly","Lifestyles with long hours alone"],"egeszseg":["Progressive retinal atrophy (PRA)","Gastric dilatation-volvulus (bloat)","Hip dysplasia","CLAD (inherited immune deficiency, DNA test available)"],"orszag":"Ireland","alias":["Irish Red Setter","Red Setter"]},"labrador-retriever":{"nev":"Labrador Retriever","tagline":"Everyone’s best friend – and the rightful owner of every dropped morsel.","leiras":"The Labrador’s ancestors were helpers to fishermen on the island of Newfoundland; the breed was shaped into a gundog in 19th-century England. Friendly, cooperative and easy to train, so it is one of the world’s most popular family, guide and assistance dogs. It loves eating, swimming and carrying everything in its mouth, but when young it is rather boisterous and chewy. It is prone to obesity, sheds plenty, and without daily exercise and mental tasks it gets bored.","mozgas":"1.5 hours a day, with retrieving and swimming","erdekesseg":"A 2016 study in Cambridge showed that many Labradors carry a faulty variant of the POMC gene, which increases the feeling of hunger – which is why they are so greedy.","kinekIgen":["First-time dog-owning families too","Active families with children","People who enjoy learning and doing sports with their dog"],"kinekNem":["Anyone bothered by lots of shed hair","Anyone looking for a watchdog","Low exercise and being left alone all day"],"egeszseg":["Hip and elbow dysplasia","Prone to obesity","Progressive retinal atrophy (PRA)","Exercise-induced collapse (EIC)"],"orszag":"United Kingdom / Canada"},"golden-retriever":{"nev":"Golden Retriever","tagline":"Sunshine on four paws: patient, kind and in love with carrying things about.","leiras":"The Golden Retriever was born in 19th-century Scotland as a gundog that retrieves gently from both water and thick cover. Patient, kind and friendly with everyone, excellent with children and happy to learn – but not suited as a watchdog. It loves water, mud and playing together. Its long coat sheds heavily and needs brushing several times a week, and cancers are more common in the breed than average.","mozgas":"1.5 hours a day, with plenty of play and retrieving","erdekesseg":"The first Golden litter was born in 1868 in Scotland on Lord Tweedmouth’s estate, from the mating of a yellow retriever called Nous and a Tweed Water Spaniel called Belle.","kinekIgen":["First-time dog-owning families too","Families with children, even young ones","Those who enjoy active outdoor activities"],"kinekNem":["Anyone looking for a watchdog","Anyone bothered by hair on the sofa and clothes","Owners who leave the dog alone for long hours"],"egeszseg":["Hip and elbow dysplasia","Cancers (more common than average)","Eye diseases (e.g. PRA)","Skin allergies"],"orszag":"United Kingdom"},"angol-cocker-spaniel":{"nev":"English Cocker Spaniel","tagline":"A cheerful, flop-eared hunter who wants to be part of the family.","leiras":"The English Cocker Spaniel is the classic British dog for hunting winged game: it flushes birds out of thick undergrowth and brings them back. A cheerful, endlessly tail-wagging, people-oriented breed that wants to take part in every family activity. Thanks to its size it can also be kept in a flat, as long as it is exercised daily. Its silky coat and long ears need regular brushing, trimming and ear cleaning, and the working lines are much more energetic than the show type.","mozgas":"1–1.5 hours, with sniffing and retrieving","erdekesseg":"It takes its name from the woodcock, a game bird it was once an excellent helper in hunting.","kinekIgen":["Families, including those with children","City flats too, with proper daily walks","People who enjoy coat grooming"],"kinekNem":["Anyone unwilling to spend time or money on grooming","Owners who leave the dog alone for long hours","Anyone looking for a completely calm lapdog"],"egeszseg":["Ear infections","Progressive retinal atrophy (PRA)","Hereditary kidney disease (familial nephropathy)"],"orszag":"United Kingdom"},"angol-springer-spaniel":{"nev":"English Springer Spaniel","tagline":"Tireless, friendly, a lover of water and mud.","leiras":"The English Springer Spaniel is the classic flushing and retrieving dog of the British hunting fields. Friendly, cheerful and very affectionate, it gets on brilliantly with children too, and learns quickly and willingly. Its energy is almost inexhaustible: water, mud and thick undergrowth are its true terrain, so its drooping ears and wavy coat need regular grooming. With too little exercise and activity it gets bored and restless, so it is not a sofa dog.","mozgas":"2 hours a day, with plenty of free running and swimming","erdekesseg":"Its name comes from the English verb “to spring”, meaning to flush game: its job was to make game burst out of the bushes in front of the hunter.","kinekIgen":["Active, sporty families","Hikers, runners and hunters","Those who enjoy dog sports and search work"],"kinekNem":["Sedentary, shut-in lifestyles","Owners who leave the dog alone for long hours","Anyone who can’t stand a muddy, wet dog"],"egeszseg":["Hip dysplasia","Progressive retinal atrophy (PRA)","Ear infections (floppy ears)","Phosphofructokinase deficiency (PFK, DNA test available)"],"orszag":"United Kingdom"},"lagotto-romagnolo":{"nev":"Lagotto Romagnolo","tagline":"Curly truffle hunter that barely sheds.","leiras":"The Lagotto Romagnolo was originally a water retriever in the marshes of Romagna in northern Italy, and today it is a truffle-hunting specialist. Balanced, friendly and quick to learn, it gets on well with children, and nose work and shared tasks make it happy. Its curly coat sheds little but needs regular brushing and clipping every few months, otherwise it mats. It has a strong urge to sniff and dig, so expect a hole or two in the garden.","mozgas":"1–1.5 hours, with plenty of scent games","erdekesseg":"Its name comes from the Romagna dialect phrase “can lagòt”, meaning water dog, because it originally retrieved waterfowl from the marshes of the Comacchio lagoons.","kinekIgen":["Active families, including those with children","People looking for a low-shedding dog","Those who enjoy nosework and search games"],"kinekNem":["Anyone unwilling to commit to regular clipping","Gardeners who pamper a perfect lawn","Owners who leave the dog alone all day"],"egeszseg":["Hip dysplasia","Juvenile epilepsy (DNA test available)","Lagotto storage disease (DNA test available)","Ear infections"],"orszag":"Italy"},"francia-bulldog":{"nev":"French Bulldog","tagline":"Bat-eared city star – just keep an eye on its breathing.","leiras":"The French Bulldog’s ancestors came to France in the 19th century with English lace-makers, and became real stars on the streets of Paris. A cheerful, affectionate and distinctly quiet companion: it barely barks (though it can snore), and gets along fine in a small flat. Its exercise needs are moderate, but it is not lazy – it likes to play and clown around. Because of its flat nose, breathing difficulties are common (brachycephalic syndrome), and it tolerates heat poorly, so choose a puppy only from health-screened parents.","mozgas":"30–60 minutes of calm walking a day, in hot weather only when it is cool","erdekesseg":"In 2022, based on American Kennel Club (AKC) registrations, the French Bulldog became the most popular breed in the USA, knocking the Labrador Retriever off the throne after 31 years.","kinekIgen":["Owners living in a city flat","Beginner owners and calmer families","People looking for a quiet companion that barks little"],"kinekNem":["Those looking for a running partner or hiking dog","Hot homes without air conditioning","Anyone who can’t set money aside for vet bills"],"egeszseg":["Brachycephalic syndrome (breathing difficulties)","Heat sensitivity, risk of heatstroke","Spinal problems (vertebral abnormalities, intervertebral disc disease)","Skin fold dermatitis, allergies"],"orszag":"France"},"mopsz":{"nev":"Pug","tagline":"Wrinkly little comedian who follows you everywhere.","leiras":"The Pug is an ancient Chinese breed brought to Europe by Dutch traders in the 16th–17th centuries, where it quickly became a favourite of the royal courts. A cheerful, affectionate little comedian who follows you everywhere, patient with children and friendly with strangers too. It is content with little exercise and does well in a flat, but sheds surprisingly heavily. Because of its flat nose, breathing difficulties are common (brachycephalic syndrome), and it tolerates heat poorly, so choose only from health-screened parents.","mozgas":"30–45 minutes of easy walking a day, shorter in hot weather","erdekesseg":"The breed’s old motto is the Latin “multum in parvo”, meaning “much in little”.","kinekIgen":["Beginner owners, city flats","Families with children and older people","People who want a companion by their side all day"],"kinekNem":["Those looking for a running partner or hiking dog","Anyone bothered by lots of loose hair","Hot homes without air conditioning"],"egeszseg":["Brachycephalic syndrome (breathing difficulties)","Eye injuries, corneal ulcers (prominent eyes)","Skin fold dermatitis","Prone to obesity"],"orszag":"China"},"chihuahua":{"nev":"Chihuahua","tagline":"The smallest dog with the biggest self-confidence.","leiras":"The Chihuahua comes from Mexico and is the world’s smallest dog breed – though it has no idea. Brave, lively and very affectionate, it often bonds truly with just one person and can be wary of strangers. Thanks to its tiny size you can take it almost anywhere, and it gets plenty of exercise indoors too. It tends to bark a lot, and because of its fragile bones it is less suitable for families with small children.","mozgas":"A 20–40-minute walk daily, plus lots of play at home","erdekesseg":"It is named after the Mexican state of Chihuahua, and the Guinness World Records title of “smallest living dog” has mostly been held by Chihuahuas.","kinekIgen":["Those living in a small city flat","Singles, older people and adult couples","People who would take their dog everywhere"],"kinekNem":["Families with young children","Neighbours sensitive to barking","Anyone looking for a tough hiking companion"],"egeszseg":["Patellar luxation","Dental problems (tartar, tooth loss)","Tracheal collapse","Puppy hypoglycaemia (low blood sugar)"],"orszag":"Mexico"},"cavalier-king-charles-spaniel":{"nev":"Cavalier King Charles Spaniel","tagline":"Big-eyed and gentle – the king of lapdogs.","leiras":"The Cavalier King Charles Spaniel takes its name from King Charles II of England, who
